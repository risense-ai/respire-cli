# Sweep an approved development server after explicitly configuring its address.
# Windows, macOS, and Linux run the same isolated script.
name: Dev server sweep

on:
  workflow_dispatch:
    inputs:
      x64_gnu_history_replay:
        description: Replay the frozen dev.26 GNU history case or complete matrix
        type: boolean
        default: false
      arm64_gnu_only:
        description: Run the base and supplemental suites on the exact Linux ARM64 GNU candidate
        type: boolean
        default: false
      windows_arm64_history_replay:
        description: Replay the isolated Windows ARM64 v1.0.19 case against candidate 44886625312
        type: boolean
        default: false
      database_sync_only:
        description: Only test legacy ciphertext migration, real sync and independent current-device decryption
        type: boolean
        default: false
      history_sources:
        description: Diagnostic historical DB tags separated by commas (latest resolves the latest formal); requires database_sync_only
        type: string
        default: ''
      api_only:
        description: Run cloud API diagnostics only; does not validate all CLI features or publish
        type: boolean
        default: false
      local_api_only:
        description: Diagnose authenticated runtime contracts only; never validates the complete release gate
        type: boolean
        default: false
      business_only:
        description: Run only synthetic cross-device business diagnostics; never release acceptance
        type: boolean
        default: false
      runtime_sha:
        description: Exact published Runtime source SHA, required for business diagnostics
        required: false
        type: string
      cli_run_id:
        description: Validated Release run whose exact artifacts will be tested without rebuilding
        required: true
        type: string
      cli_sha:
        description: Exact 40-character CLI source SHA for cli_run_id
        required: true
        type: string
  workflow_call:
    inputs:
      database_sync_only:
        type: boolean
        default: false
      history_sources:
        type: string
        default: ''
      api_only:
        type: boolean
        default: false
      local_api_only:
        type: boolean
        default: false
      business_only:
        type: boolean
        default: false
      runtime_sha:
        required: false
        type: string
      cli_run_id:
        required: true
        type: string
      cli_sha:
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  sweep:
    if: ${{ inputs.x64_gnu_history_replay || inputs.arm64_gnu_only || inputs.windows_arm64_history_replay || !inputs.api_only || inputs.local_api_only || inputs.database_sync_only || inputs.business_only }}
    name: ${{ inputs.business_only && 'Business diagnostics (Linux musl)' || inputs.local_api_only && 'Runtime diagnostics' || format('sweep ({0})', matrix.target) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.x64_gnu_history_replay && '[{"os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu"}]' || inputs.windows_arm64_history_replay && '[{"os":"windows-11-arm","target":"aarch64-pc-windows-msvc"}]' || inputs.arm64_gnu_only && '[{"os":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-gnu"}]' || (inputs.local_api_only || inputs.database_sync_only || inputs.business_only) && '[{"os":"ubuntu-latest","target":"x86_64-unknown-linux-musl"}]' || '[{"os":"ubuntu-latest","target":"x86_64-unknown-linux-musl"},{"os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu"},{"os":"macos-latest","target":"aarch64-apple-darwin"},{"os":"windows-latest","target":"x86_64-pc-windows-msvc"}]') }}
    # Full fixture mechanics only: this workflow is diagnostic, never full acceptance
    # of the harness source and never reusable as publication evidence.
    env:
      ARTIFACT_SOURCE: build
      VALIDATION_PROFILE: full
      RSRS_RUNTIME_TRIPLE: ${{ matrix.target }}
    steps:
      - name: Require the isolated Windows ARM64 history replay inputs
        if: inputs.windows_arm64_history_replay
        shell: pwsh
        env:
          CLI_RUN_ID: ${{ inputs.cli_run_id }}
          CLI_SHA: ${{ inputs.cli_sha }}
          HISTORY_SOURCES: ${{ inputs.history_sources }}
          DATABASE_SYNC_ONLY: ${{ inputs.database_sync_only }}
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or $env:RUNNER_ARCH -ne 'ARM64' -or [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'Arm64') {
            throw 'History replay requires native GitHub-hosted Windows ARM64'
          }
          if ($env:DATABASE_SYNC_ONLY -ne 'true' -or $env:HISTORY_SOURCES -ne 'v1.0.19' -or $env:CLI_RUN_ID -ne '44886625312' -or $env:CLI_SHA -ne '79083eb3fea58d476af5501c0ca73c4931924ec2') {
            throw 'History replay requires the frozen candidate and exactly the v1.0.19 diagnostic subset'
          }
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require the approved development server
        env:
          RSRS_DEV_SERVER_ADDR: ${{ vars.RESPIRE_DEV_SERVER_ADDR }}
          CLI_RUN_ID: ${{ inputs.cli_run_id }}
          CLI_SHA: ${{ inputs.cli_sha }}
          API_ONLY: ${{ inputs.api_only }}
          LOCAL_API_ONLY: ${{ inputs.local_api_only }}
          DATABASE_SYNC_ONLY: ${{ inputs.database_sync_only }}
          HISTORY_SOURCES: ${{ inputs.history_sources }}
          BUSINESS_ONLY: ${{ inputs.business_only }}
          ARM64_GNU_ONLY: ${{ inputs.arm64_gnu_only }}
          WINDOWS_ARM64_HISTORY_REPLAY: ${{ inputs.windows_arm64_history_replay }}
          X64_GNU_HISTORY_REPLAY: ${{ inputs.x64_gnu_history_replay }}
          EXPECTED_RUNTIME_SHA: ${{ inputs.runtime_sha }}
        run: |
          node -e 'if(process.env.X64_GNU_HISTORY_REPLAY==="true"&&(process.env.DATABASE_SYNC_ONLY!=="true"||["API_ONLY","LOCAL_API_ONLY","BUSINESS_ONLY","ARM64_GNU_ONLY","WINDOWS_ARM64_HISTORY_REPLAY"].some(key=>process.env[key]==="true"))) throw new Error("x64 GNU history replay requires only database sync")'
          node -e 'if(process.env.ARM64_GNU_ONLY==="true"&&["API_ONLY","LOCAL_API_ONLY","DATABASE_SYNC_ONLY","BUSINESS_ONLY"].some(key=>process.env[key]==="true")) throw new Error("ARM64 GNU accepts only the base and supplemental diagnostic scope")'
          node -e 'if(process.env.BUSINESS_ONLY==="true"&&(process.env.API_ONLY==="true"||process.env.LOCAL_API_ONLY==="true"||process.env.DATABASE_SYNC_ONLY==="true")) throw new Error("Choose one diagnostic scope")'
          node -e 'if(process.env.API_ONLY==="true"&&process.env.LOCAL_API_ONLY==="true") throw new Error("Choose one diagnostic scope")'
          node -e 'if(process.env.DATABASE_SYNC_ONLY==="true"&&(process.env.API_ONLY==="true"||process.env.LOCAL_API_ONLY==="true")) throw new Error("Choose one diagnostic scope")'
          node -e 'if(process.env.HISTORY_SOURCES&&process.env.DATABASE_SYNC_ONLY!=="true") throw new Error("Historical sources require database_sync_only")'
          node -e 'if(process.env.BUSINESS_ONLY==="true"&&!/^[a-f0-9]{40}$/.test(process.env.EXPECTED_RUNTIME_SHA||"")) throw new Error("Pass the exact published Runtime source SHA for business diagnostics")'
          node -e 'const value=process.env.RSRS_DEV_SERVER_ADDR; if(!value) throw new Error("Configure RSRS_DEV_SERVER_ADDR before testing"); const u=new URL(value); if(u.origin!=="https://api-dev.rsrs.rs"||u.pathname!=="/"||u.search||u.hash||u.username||u.password) throw new Error("CLI smoke requires https://api-dev.rsrs.rs"); if(!process.env.CLI_RUN_ID||!process.env.CLI_SHA) throw new Error("Pass the exact CI run ID and source SHA; mutable npm tags are not smoke artifacts")'
      - name: Require a native Linux ARM64 runner
        if: inputs.arm64_gnu_only
        run: bash scripts/require-native-linux-arm64.sh aarch64-unknown-linux-gnu
      - name: Verify the original release build
        if: inputs.cli_run_id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CLI_RUN_ID: ${{ inputs.cli_run_id }}
          CLI_SHA: ${{ inputs.cli_sha }}
        run: |
          node - <<'NODE'
          const cp=require('child_process'),m=require('./npm/artifact-manifest.json');
          const id=process.env.CLI_RUN_ID,sha=process.env.CLI_SHA,repo=process.env.GITHUB_REPOSITORY;
          if(!/^\d+$/.test(id)||!/^[a-f0-9]{40}$/.test(sha)) throw new Error('Pass an exact validated run ID and full CLI SHA');
          const api=path=>JSON.parse(cp.execFileSync('gh',['api',`repos/${repo}/${path}`],{encoding:'utf8'}));
          const run=api(`actions/runs/${id}`);
          if(run.head_sha!==sha||!['.github/workflows/release.yml','.github/workflows/release-validation.yml'].includes(run.path)) throw new Error('Unexpected release source or workflow');
          const jobs=JSON.parse(cp.execFileSync('gh',['api','--paginate','--slurp',`repos/${repo}/actions/runs/${id}/jobs?per_page=10`],{encoding:'utf8'})).flatMap(page=>page.jobs);
          const required=[...m.targets.map(t=>`Release (${t.triple})`),'npm-dry-run'];
          for(const name of required) if(!jobs.some(j=>(j.name===name||j.name.endsWith(` / ${name}`))&&j.conclusion==='success')) throw new Error(`Original release validation did not pass: ${name}`);
          NODE
      - uses: actions/download-artifact@v4
        if: inputs.cli_run_id != ''
        with:
          name: cli-release-${{ matrix.target }}
          path: original-artifact
          run-id: ${{ inputs.cli_run_id }}
          github-token: ${{ github.token }}
      - name: Verify and extract the original binary
        id: verified_artifact
        if: inputs.cli_run_id != ''
        shell: bash
        env:
          CLI_TARGET: ${{ matrix.target }}
          CLI_SHA: ${{ inputs.cli_sha }}
        run: |
          node - <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const metadata=JSON.parse(fs.readFileSync(`original-artifact/cli-build-${process.env.CLI_TARGET}.json`,'utf8'));
          cp.execFileSync(process.execPath,['npm/scripts/set-build-version.mjs',metadata.version],{stdio:'inherit'});
          cp.execFileSync(process.execPath,['npm/scripts/extract-artifact.mjs','original-artifact','validated-cli'],{env:{...process.env,CLI_VERSION:metadata.version},stdio:'inherit'});
          fs.appendFileSync(process.env.GITHUB_ENV,`CLI_VERSION=${metadata.version}\n`);
          NODE
      - uses: actions/setup-python@v5
        id: supplement_python
        if: ${{ !cancelled() && steps.verified_artifact.outcome == 'success' }}
        with:
          python-version: '3.12'
      - name: Bind diagnostic fixtures to the CLI's official pinned Runtime
        id: standalone_runtime
        if: ${{ !cancelled() && steps.verified_artifact.outcome == 'success' && steps.supplement_python.outcome == 'success' }}
        shell: bash
        env:
          CLI_SHA: ${{ inputs.cli_sha }}
          CLI_RUN_ID: ${{ inputs.cli_run_id }}
          BUSINESS_ONLY: ${{ inputs.business_only }}
          EXPECTED_RUNTIME_SHA: ${{ inputs.runtime_sha }}
          RSRS_DATA_DIR: ${{ runner.temp }}/diagnostic-runtime-proof
        run: |
          set -euo pipefail
          exe=validated-cli/rsrs
          if [ "$RUNNER_OS" = Windows ]; then exe="$exe.exe"; fi
          node scripts/ci-install-pinned-runtime.mjs "$exe"
          node - "$exe" <<'NODE'
          const fs=require('fs'),path=require('path'),cp=require('child_process'),assert=require('assert/strict'),{createHash}=require('crypto');
          const hash=value=>createHash('sha256').update(value).digest('hex');
          const binary=fs.realpathSync(process.argv[2]),root=process.env.RSRS_DATA_DIR;
          const env={...process.env,HOME:path.join(root,'home'),USERPROFILE:path.join(root,'home'),RSRS_UPDATE_CHECK:'0',RSRS_NO_AUTOSYNC:'1'};
          for(const key of Object.keys(env)) if(['RSRS_RUNTIME_BIN','RSRS_CORE_TEST_MODE','GH_TOKEN','GITHUB_TOKEN'].includes(key)||key.endsWith('_TOKEN')||key.endsWith('_API_KEY')) delete env[key];
          const invoke=args=>cp.execFileSync(binary,args,{env,encoding:'utf8',timeout:30000}).trim();
          const pin=JSON.parse(fs.readFileSync('.github/runtime-test-fixture.json','utf8'));
          const inventory=JSON.parse(invoke(['--json','runtime','list']));
          assert.equal(inventory.command,'runtime.list');assert.equal(inventory.status,'ok');
          assert.equal(inventory.summary.installed.find(entry=>entry.current)?.version,pin.required,'Selected Runtime differs from the test fixture');
          const metadata=JSON.parse(fs.readFileSync(`validated-cli/cli-build-${process.env.RSRS_RUNTIME_TRIPLE}.json`,'utf8'));
          assert.equal(metadata.git_sha,process.env.CLI_SHA);
          assert.equal(String(metadata.producer.run_id),process.env.CLI_RUN_ID,'CLI artifact producer differs');
          assert.equal(hash(fs.readFileSync(binary)),metadata.binary_sha256);
          const version=JSON.parse(invoke(['--json','v'])),display=invoke(['--version']);
          assert.equal(version.command,'version');assert.equal(version.status,'ok');
          assert.equal(version.summary.version,metadata.version);assert.equal(display,`rsrs ${metadata.version}`);
          const receipt=JSON.parse(fs.readFileSync(path.join(root, 'bin', 'runtime.json'),'utf8'));
          const runtimeMetadata=JSON.parse(receipt.release.metadata_json);
          assert.equal(receipt.version,pin.required);
          assert.equal(hash(receipt.release.metadata_json),receipt.release.metadata_sha256);
          assert.equal(runtimeMetadata.binary_sha256,receipt.sha256);
          assert.equal(runtimeMetadata.runtime_version,pin.required);
          assert.equal(runtimeMetadata.target_triple??runtimeMetadata.triple,process.env.RSRS_RUNTIME_TRIPLE);
          if(process.env.BUSINESS_ONLY==='true'){
            assert.match(process.env.EXPECTED_RUNTIME_SHA??'',/^[a-f0-9]{40}$/,'Exact Runtime source SHA required');
            assert.equal(runtimeMetadata.source_commit,process.env.EXPECTED_RUNTIME_SHA,'Pinned Runtime source differs from the requested candidate');
          }
          const runtime=fs.realpathSync(path.join(root, 'bin', 'runtime',pin.required,'rsrs-runtime'+(process.platform==='win32'?'.exe':'')));
          assert.notEqual(runtime,binary);assert.equal(hash(fs.readFileSync(runtime)),receipt.sha256);
          assert.match(process.env.GITHUB_SHA,/^[a-f0-9]{40}$/);
          const evidence={schema:1,kind:'standalone-cli-diagnostic',diagnostic_only:true,publication_reusable:false,
            full_acceptance:false,harness_sha:process.env.GITHUB_SHA,cli_source_sha:metadata.git_sha,
            diagnostic_run_id:process.env.GITHUB_RUN_ID,diagnostic_run_attempt:process.env.GITHUB_RUN_ATTEMPT,
            producer:metadata.producer,target:metadata.target,cli:{version:version.summary.version,version_display:display,binary_sha256:metadata.binary_sha256},
            runtime:{version:receipt.version,binary_sha256:receipt.sha256,fixture_version:pin.required,
              release_metadata_sha256:receipt.release.metadata_sha256,release_metadata:runtimeMetadata},
            limits:['Installation identity only; fixture outcomes are separate','An old CLI producer cannot establish full acceptance or publication of the new harness']};
          if(process.env.BUSINESS_ONLY==='true') evidence.expected_runtime_source_sha=process.env.EXPECTED_RUNTIME_SHA;
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'standalone-diagnostic-identity.json'),JSON.stringify(evidence,null,2)+'\n');
          NODE
      - name: Verify the exact GNU history replay inputs
        id: gnu_history_replay
        if: inputs.x64_gnu_history_replay
        shell: bash
        env:
          DATABASE_SYNC_ONLY: ${{ inputs.database_sync_only }}
          HISTORY_SOURCES: ${{ inputs.history_sources }}
        run: |
          set -euo pipefail
          test "$DATABASE_SYNC_ONLY" = true
          if [ "$HISTORY_SOURCES" != v1.0.11 ]; then
            test "$HISTORY_SOURCES" = 'v1.0.11,v1.0.11-dev.1,v1.0.12,v1.0.15,v1.0.16,v1.0.17-dev.6,v1.0.18,v1.0.19,v1.0.20,v1.0.7,v1.0.8,v1.0.9'
          fi
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {join} from 'node:path';
          const proof = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'standalone-diagnostic-identity.json')));
          assert.equal(proof.producer.run_id.toString(), '44947347013');
          assert.equal(Number(proof.producer.run_attempt), 2);
          assert.equal(proof.target, 'x86_64-unknown-linux-gnu');
          assert.equal(proof.cli.binary_sha256, '09b366d5a72bcdee301a95c09b463e9d9c20415af5ec18daa162d07c3ca03bed');
          assert.equal(proof.runtime.binary_sha256, '95852e50e8534a0ad46a457c6f6883f21be171737ef73e933dff12e137ee7c52');
          assert.equal(proof.runtime.release_metadata.archive_sha256, 'a6ed1c49fdd35169680bc9cc9875652b2e2e2af1d6e8aff2639ebdc5f5deab74');
          NODE
      - name: Prepare persistent native credentials for diagnostic fixtures
        id: native_credentials
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.standalone_runtime.outcome == 'success' && (!inputs.x64_gnu_history_replay || steps.gnu_history_replay.outcome == 'success') }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci-apt-get.sh update
          bash scripts/ci-apt-get.sh install -y --no-install-recommends dbus-x11 gnome-keyring
          python3 -m pip install --only-binary=:all: SecretStorage==3.3.3 jeepney==0.9.0 cryptography==46.0.3 psutil==7.1.0
      - name: Verify the exact Windows history replay binaries
        id: history_replay_bytes
        if: inputs.windows_arm64_history_replay
        shell: pwsh
        run: |
          $proof = Get-Content -Raw -LiteralPath (Join-Path $env:RUNNER_TEMP 'standalone-diagnostic-identity.json') | ConvertFrom-Json
          if ($proof.producer.run_attempt -ne 1 -or $proof.cli.binary_sha256 -ne 'c79eee5e00bbfbfe8fd0eecf128bc819dadd888e5d0628f9e5ce49b7e4355fae' -or $proof.runtime.binary_sha256 -ne 'ff2cfbbe1e575809c4632684072ef6a2836cf76c233d72fac64db95555ece630') {
            throw 'History replay executable digests differ from the failed native job'
          }
          if ($proof.runtime.release_metadata.archive_sha256 -ne '3db85ea29c8072a80c3797a0e768dd539a12e7f8f70f91b5f49215dc6c65ea68') {
            throw 'History replay Runtime archive differs from the failed native job'
          }
      - name: Install PowerShell
        if: ${{ !inputs.local_api_only && !inputs.database_sync_only && runner.os != 'Windows' }}
        shell: bash
        run: |
          set -euo pipefail
          if command -v pwsh >/dev/null 2>&1; then
            exit 0
          fi
          if [ "$(uname -s)" = Linux ]; then
            . /etc/os-release
            curl -fsSL "https://packages.microsoft.com/config/ubuntu/${VERSION_ID}/packages-microsoft-prod.deb" -o /tmp/packages-microsoft-prod.deb
            sudo dpkg -i /tmp/packages-microsoft-prod.deb
            bash scripts/ci-apt-get.sh update
            bash scripts/ci-apt-get.sh install -y powershell
          else
            brew install powershell
          fi
      - name: Sweep the exact CI binary
        if: ${{ !cancelled() && !inputs.local_api_only && !inputs.database_sync_only && steps.standalone_runtime.outcome == 'success' && (runner.os != 'Linux' || steps.native_credentials.outcome == 'success') }}
        shell: pwsh
        env:
          RSRS_LANG: en
          RSRS_DEV_SERVER_ADDR: ${{ vars.RESPIRE_DEV_SERVER_ADDR }}
          CLI_RUN_ID: ${{ inputs.cli_run_id }}
          RSRS_ENGINE: cpu
          CLI_SHA: ${{ inputs.cli_sha }}
          BUSINESS_ONLY: ${{ inputs.business_only }}
          RSRS_M3_DIR: ${{ runner.temp }}/sweep-model/bge-m3
        run: |
          $ErrorActionPreference = 'Stop'
          $businessArgs = @()
          if ($env:BUSINESS_ONLY -eq 'true') { $businessArgs += '-BusinessOnly' }
          $root = Join-Path $env:RUNNER_TEMP 'om-sweep'
          $exe = Join-Path (Resolve-Path validated-cli) $(if ($IsWindows) { 'rsrs.exe' } else { 'rsrs' })
          if ($IsLinux) {
            & dbus-run-session -- env RSRS_SS_FIXTURE_BUS=private python3 scripts/dev-secret-service-keyring-selftest.py --root (Join-Path $env:RUNNER_TEMP 'base-sweep-credentials') --timeout 6600 -- pwsh -NoProfile -File scripts/dev-release-sweep.ps1 -Exe $exe -ExpectVersion $env:CLI_VERSION -Root $root -DeferSupplemental @businessArgs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            ./scripts/dev-release-sweep.ps1 -Exe $exe -ExpectVersion $env:CLI_VERSION -Root $root -DeferSupplemental @businessArgs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Upload base smoke diagnostics
        if: ${{ always() && !inputs.local_api_only && !inputs.database_sync_only }}
        uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: base-sweep-report-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/om-sweep/report.md
            ${{ runner.temp }}/om-sweep/coverage.json
            ${{ runner.temp }}/base-sweep-credentials/business-keyring-selftest.json
          if-no-files-found: warn
      - name: Diagnose GNU login interruption with the original binary
        if: ${{ !cancelled() && !inputs.business_only && !inputs.local_api_only && !inputs.database_sync_only && matrix.target == 'x86_64-unknown-linux-gnu' && steps.standalone_runtime.outcome == 'success' && steps.native_credentials.outcome == 'success' }}
        shell: bash
        env:
          CLI_SHA: ${{ inputs.cli_sha }}
        run: |
          set -euo pipefail
          binary="$(realpath validated-cli/rsrs)"
          checksum="$(sha256sum "$binary" | cut -d ' ' -f 1)"
          python3 scripts/test-login-interruption-contract.py
          dbus-run-session -- env RSRS_SS_FIXTURE_BUS=private python3 scripts/dev-login-interruption-smoke.py --native-credentials --binary "$binary" --binary-sha256 "$checksum" --version "$CLI_VERSION" --source-sha "$CLI_SHA" --root "$RUNNER_TEMP/gnu-login-interruption" --model-dir "$RUNNER_TEMP/om-sweep/models/bge-m3"
      - name: Verify all supplementary CLI contracts
        if: ${{ !cancelled() && !inputs.business_only && !inputs.local_api_only && !inputs.database_sync_only && runner.os == 'Linux' && steps.supplement_python.outcome == 'success' && steps.standalone_runtime.outcome == 'success' && (runner.os != 'Linux' || steps.native_credentials.outcome == 'success') }}
        shell: bash
        env:
          CLI_SHA: ${{ inputs.cli_sha }}
          RSRS_DEV_SERVER_ADDR: ${{ vars.RESPIRE_DEV_SERVER_ADDR }}
          RSRS_DEV_SERVER_SHA: ${{ vars.RESPIRE_DEV_SERVER_SHA }}
        run: |
          set -euo pipefail
          python3 -m pip install --only-binary=:all: cryptography==46.0.3
          binary="$(realpath validated-cli/rsrs)"
          checksum="$(sha256sum "$binary" | cut -d ' ' -f 1)"
          dbus-run-session -- env RSRS_SS_FIXTURE_BUS=private python3 scripts/dev-secret-service-keyring-selftest.py --root "$RUNNER_TEMP/supplement-credentials" --timeout 6600 -- python3 scripts/dev-smoke-supplements.py --binary "$binary" --binary-sha256 "$checksum" --version "$CLI_VERSION" --source-sha "$CLI_SHA" --root "$RUNNER_TEMP/dev-supplements" --cli-report "$RUNNER_TEMP/om-sweep/coverage.json"
      - name: Verify historical Secret Service profile migration
        if: ${{ !cancelled() && !inputs.business_only && !inputs.local_api_only && !inputs.database_sync_only && runner.os == 'Linux' && steps.supplement_python.outcome == 'success' && steps.standalone_runtime.outcome == 'success' && (runner.os != 'Linux' || steps.native_credentials.outcome == 'success') }}
        shell: bash
        env:
          CLI_SHA: ${{ inputs.cli_sha }}
          RSRS_DEV_SERVER_ADDR: ${{ vars.RESPIRE_DEV_SERVER_ADDR }}
          RSRS_DEV_SERVER_SHA: ${{ vars.RESPIRE_DEV_SERVER_SHA }}
        run: |
          set -euo pipefail
          bash scripts/ci-apt-get.sh update
          bash scripts/ci-apt-get.sh install -y dbus gnome-keyring
          python -m pip install --only-binary=:all: SecretStorage==3.3.3 jeepney==0.9.0 cryptography==46.0.3
          binary="$(realpath validated-cli/rsrs)"
          checksum="$(sha256sum "$binary" | cut -d ' ' -f 1)"
          root="$RUNNER_TEMP/secret-service-profile-migration"
          fixture_status=0
          dbus-run-session -- env RSRS_SS_FIXTURE_BUS=private python scripts/dev-secret-service-migration-smoke.py --binary "$binary" --binary-sha256 "$checksum" --version "$CLI_VERSION" --source-sha "$CLI_SHA" --root "$root" || fixture_status=$?
          python scripts/dev-secret-service-migration-gate.py --migration-report "$root/migration-coverage.json" --report "$root/migration-platform-gate.json" --binary-sha256 "$checksum" --version "$CLI_VERSION" --source-sha "$CLI_SHA"
          test "$fixture_status" -eq 0
      - name: Verify native encrypted profile migration
        if: ${{ !cancelled() && !inputs.business_only && !inputs.local_api_only && !inputs.database_sync_only && runner.os != 'Linux' && steps.supplement_python.outcome == 'success' && steps.standalone_runtime.outcome == 'success' && (runner.os != 'Linux' || steps.native_credentials.outcome == 'success') }}
        shell: pwsh
        env:
          CLI_SHA: ${{ inputs.cli_sha }}
          RSRS_DEV_SERVER_ADDR: ${{ vars.RESPIRE_DEV_SERVER_ADDR }}
          RSRS_DEV_SERVER_SHA: ${{ vars.RESPIRE_DEV_SERVER_SHA }}
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --only-binary=:all: cryptography==46.0.3
          if ($LASTEXITCODE -ne 0) { throw 'Native migration fixture dependencies failed' }
          $binary = Join-Path (Resolve-Path validated-cli) $(if ($IsWindows) { 'rsrs.exe' } else { 'rsrs' })
          $checksum = (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant()
          New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP 'dev-supplements') | Out-Null
          $migrationRoot = Join-Path $env:RUNNER_TEMP 'dev-supplements/profile-migration'
          python scripts/dev-profile-migration-smoke.py --binary $binary --binary-sha256 $checksum --version $env:CLI_VERSION --source-sha $env:CLI_SHA --root $migrationRoot
          $migrationExit = $LASTEXITCODE
          python scripts/dev-smoke-gate.py --migration-only --cli-report (Join-Path $env:RUNNER_TEMP 'om-sweep/coverage.json') --profile-migration (Join-Path $migrationRoot 'migration-coverage.json') --report (Join-Path $env:RUNNER_TEMP 'dev-supplements/migration-platform-gate.json') --binary-sha256 $checksum --version $env:CLI_VERSION --source-sha $env:CLI_SHA
          if ($migrationExit -ne 0 -or $LASTEXITCODE -ne 0) { throw 'Native migration or artifact gate failed.' }
      - name: Verify migrated legacy ciphertext on an independent current device
        if: ${{ !cancelled() && inputs.database_sync_only && steps.supplement_python.outcome == 'success' && steps.standalone_runtime.outcome == 'success' && (runner.os != 'Linux' || steps.native_credentials.outcome == 'success') && (!inputs.windows_arm64_history_replay || steps.history_replay_bytes.outcome == 'success') }}
        shell: bash
        env:
          CLI_SHA: ${{ inputs.cli_sha }}
          GH_TOKEN: ${{ github.token }}
          HISTORY_SOURCES: ${{ inputs.history_sources }}
          RSRS_DEV_SERVER_ADDR: ${{ vars.RESPIRE_DEV_SERVER_ADDR }}
          RSRS_DEV_SERVER_SHA: ${{ vars.RESPIRE_DEV_SERVER_SHA }}
        run: |
          set -euo pipefail
          py=python3
          binary=validated-cli/rsrs
          if [ "$RUNNER_OS" = Windows ]; then
            python -m venv "$RUNNER_TEMP/history-python"
            py="$RUNNER_TEMP/history-python/Scripts/python.exe"
            binary="$binary.exe"
            "$py" -m pip install --only-binary=:all: pip==26.2.2 setuptools==84.2.1 wheel==0.48.0
            "$py" scripts/native-psutil-wheel-cache.py build --directory "$RUNNER_TEMP/history-psutil"
            "$py" scripts/native-psutil-wheel-cache.py install --directory "$RUNNER_TEMP/history-psutil"
          fi
          "$py" -m pip install --only-binary=:all: cryptography==46.0.3
          binary="$(realpath "$binary")"
          checksum="$(sha256sum "$binary" | cut -d ' ' -f 1)"
          mkdir -p "$RUNNER_TEMP/dev-supplements"
          if [ -n "$HISTORY_SOURCES" ]; then
            if [ "$RUNNER_OS" != Windows ]; then
              "$py" -m pip install --only-binary=:all: psutil==7.1.0
            fi
            "$py" - "$binary" <<'PY'
          import importlib.util, os, pathlib, sys
          from types import SimpleNamespace
          sys.path.insert(0, 'scripts')
          spec = importlib.util.spec_from_file_location('history_model', 'scripts/dev-legacy-vault-smoke.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          args = SimpleNamespace(binary=pathlib.Path(sys.argv[1]), root=pathlib.Path(os.environ['RUNNER_TEMP'])/'historical-model',
              source_sha=os.environ['CLI_SHA'], version=os.environ['CLI_VERSION'], binary_sha256=module.digest(pathlib.Path(sys.argv[1])))
          smoke = module.Smoke(args)
          env = smoke.env('install')
          smoke.cli(env, 'model', 'install-m3', timeout=900)
          module.share_cpu_container(smoke.root, env, smoke.model)
          PY
            model="$RUNNER_TEMP/historical-model/models/bge-m3"
            mkdir -p "$RUNNER_TEMP/native-legacy-model/onnx"
            cp "$model/tokenizer.json" "$RUNNER_TEMP/native-legacy-model/tokenizer.json"
            cp "$model/onnx/model_quantized.onnx" "$RUNNER_TEMP/native-legacy-model/onnx/model_quantized.onnx"
            cp "$model/onnx/model_quantized.cpu-v1.ort" "$RUNNER_TEMP/native-legacy-model/onnx/model_quantized.cpu-v1.ort"
            curl --fail --location --connect-timeout 20 --max-time 1200 'https://huggingface.co/Xenova/bge-m3/resolve/4de13258303883538bd53b696b452bf8099f0858/onnx/model_fp16.onnx' --output "$RUNNER_TEMP/native-legacy-model/onnx/model_fp16.onnx"
            sources=()
            IFS=',' read -ra tags <<< "$HISTORY_SOURCES"
            for tag in "${tags[@]}"; do sources+=(--source "$tag"); done
            "$py" scripts/native-model-cache.py verify --model-dir "$model" --legacy-dir "$RUNNER_TEMP/native-legacy-model"
            "$py" scripts/test-published-upgrades.py --binary "$binary" --target "$RSRS_RUNTIME_TRIPLE" \
              --runtime-binary "$NATIVE_RUNTIME_BIN" --runtime-sha256 "$NATIVE_RUNTIME_SHA256" --runtime-version "$NATIVE_RUNTIME_VERSION" \
              --model-dir "$model" --legacy-model-dir "$RUNNER_TEMP/native-legacy-model" \
              --output-dir "$RUNNER_TEMP/dev-supplements/historical-database" "${sources[@]}"
          else
            dbus-run-session -- env RSRS_SS_FIXTURE_BUS=private python3 scripts/dev-legacy-vault-smoke.py --binary "$binary" --binary-sha256 "$checksum" --version "$CLI_VERSION" --source-sha "$CLI_SHA" --root "$RUNNER_TEMP/dev-supplements/legacy-vault"
          fi
      - name: Diagnose runtime contracts without a full release claim
        if: ${{ !cancelled() && inputs.local_api_only && steps.supplement_python.outcome == 'success' && steps.standalone_runtime.outcome == 'success' && (runner.os != 'Linux' || steps.native_credentials.outcome == 'success') }}
        shell: bash
        env:
          CLI_SHA: ${{ inputs.cli_sha }}
          RSRS_DEV_SERVER_ADDR: ${{ vars.RESPIRE_DEV_SERVER_ADDR }}
          RSRS_DEV_SERVER_SHA: ${{ vars.RESPIRE_DEV_SERVER_SHA }}
        run: |
          set -euo pipefail
          binary="$(realpath validated-cli/rsrs)"
          checksum="$(sha256sum "$binary" | cut -d ' ' -f 1)"
          dbus-run-session -- env RSRS_SS_FIXTURE_BUS=private python3 scripts/dev-secret-service-keyring-selftest.py --root "$RUNNER_TEMP/runtime-diagnostic-credentials" --timeout 1500 -- python3 scripts/dev-runtime-smoke.py --binary "$binary" --binary-sha256 "$checksum" --version "$CLI_VERSION" --source-sha "$CLI_SHA" --root "$RUNNER_TEMP/runtime-diagnostics" --report "$RUNNER_TEMP/dev-supplements/runtime-coverage.json"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: sweep-report-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/om-sweep/report.md
            ${{ runner.temp }}/om-sweep/coverage.json
            ${{ runner.temp }}/base-sweep-credentials/business-keyring-selftest.json
            ${{ runner.temp }}/supplement-credentials/business-keyring-selftest.json
            ${{ runner.temp }}/standalone-diagnostic-identity.json
            ${{ runner.temp }}/gnu-login-interruption/interruption-coverage.json
            ${{ runner.temp }}/dev-supplements/suite-results.json
            ${{ runner.temp }}/dev-supplements/combined-coverage.json
            ${{ runner.temp }}/dev-supplements/outbox/outbox-coverage.json
            ${{ runner.temp }}/dev-supplements/ai-inject/ai-inject-coverage.json
            ${{ runner.temp }}/dev-supplements/runtime-coverage.json
            ${{ runner.temp }}/dev-supplements/historical-database/published-upgrades.json
            ${{ runner.temp }}/dev-supplements/historical-database/**/real-account-return-verification.json
            ${{ runner.temp }}/dev-supplements/legacy-vault/legacy-vault-coverage.json
            ${{ runner.temp }}/dev-supplements/profile-migration/migration-coverage.json
            ${{ runner.temp }}/dev-supplements/login-interruption/interruption-coverage.json
            ${{ runner.temp }}/dev-supplements/migration-platform-gate.json
            ${{ runner.temp }}/secret-service-profile-migration/migration-coverage.json
            ${{ runner.temp }}/secret-service-profile-migration/migration-platform-gate.json
          if-no-files-found: error

  api-smoke:
    if: ${{ !inputs.x64_gnu_history_replay && !inputs.arm64_gnu_only && !inputs.windows_arm64_history_replay && !inputs.database_sync_only && !inputs.business_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: respire-dev-mailbox-fixture
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check all baseline CLI API contracts and GitHub transport
        env:
          RSRS_DEV_MAIL_ADDRESS: ${{ vars.RESPIRE_DEV_MAIL_ADDRESS }}
          RSRS_DEV_IMAP_HOST: ${{ vars.RESPIRE_DEV_IMAP_HOST }}
          RSRS_DEV_IMAP_USERNAME: ${{ secrets.RESPIRE_DEV_IMAP_USERNAME }}
          RSRS_DEV_IMAP_PASSWORD: ${{ secrets.RESPIRE_DEV_IMAP_PASSWORD }}
          RSRS_DEV_SERVER_ADDR: ${{ vars.RESPIRE_DEV_SERVER_ADDR }}
          RSRS_DEV_API_ADMIN_APPROVED: ${{ vars.RESPIRE_DEV_API_ADMIN_APPROVED }}
          RSRS_DEV_ADMIN_TOKEN: ${{ secrets.RESPIRE_DEV_ADMIN_TOKEN }}
          RSRS_DEV_SERVER_SHA: ${{ vars.RESPIRE_DEV_SERVER_SHA }}
        run: |
          sleep 61
          python3 scripts/dev-api-smoke.py --report "$RUNNER_TEMP/dev-api-coverage.json" --scope all
          python3 scripts/dev-github-api-smoke.py --report "$RUNNER_TEMP/dev-github-api-coverage.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: 1
          name: dev-api-coverage
          path: |
            ${{ runner.temp }}/dev-api-coverage.json
            ${{ runner.temp }}/dev-github-api-coverage.json
          if-no-files-found: error
