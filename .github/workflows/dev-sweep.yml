name: One ARM64 GNU AI diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  ai-once:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      RSRS_DEV_SERVER_ADDR: ${{ vars.RESPIRE_DEV_SERVER_ADDR }}
      RSRS_DEV_SERVER_SHA: ${{ vars.RESPIRE_DEV_SERVER_SHA }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require real native ARM64 and approved DEV endpoint
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/require-native-linux-arm64.sh aarch64-unknown-linux-gnu
          test "$RSRS_DEV_SERVER_ADDR" = https://api-dev.rsrs.rs
          echo "DIAGNOSTIC_ROOT=$RUNNER_TEMP/arm64-ai-once" >> "$GITHUB_ENV"
      - name: Verify fixed original producer, ZIP, binary and diagnostic-only projection
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/arm64-ai-native-diagnostic.py prepare "$DIAGNOSTIC_ROOT"
      - name: Strictly consume the original CLI and fixed public Runtime24
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/arm64-ai-native-consume.mjs "$DIAGNOSTIC_ROOT"
      - name: Prepare private native credentials
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci-apt-get.sh update
          bash scripts/ci-apt-get.sh install -y --no-install-recommends dbus-x11 gnome-keyring
          python3 -m pip install --only-binary=:all: SecretStorage==3.3.3 jeepney==0.9.0 cryptography==46.0.3 psutil==7.1.0
      - name: Run exactly one original AI supplement with PR418 diagnostics
        run: python3 scripts/arm64-ai-native-diagnostic.py execute "$DIAGNOSTIC_ROOT"
      - name: Collect only fixed diagnostics, provenance and cleanup
        if: always()
        run: python3 scripts/arm64-ai-native-diagnostic.py collect "$DIAGNOSTIC_ROOT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arm64-ai-once-safe-report
          path: ${{ runner.temp }}/arm64-ai-once/safe-report/*.json
          retention-days: 3
          if-no-files-found: error
