name: Sealed Runtime Windows migration
run-name: Sealed Windows migration / ${{ inputs.runtime_run_id }}
on:
  workflow_dispatch:
    inputs:
      runtime_run_id:
        description: Unpublished Runtime release producer run ID (attempt 1)
        required: true
        type: string
      runtime_sha:
        description: Exact Runtime product commit, as recorded inside the artifact
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  encrypted-migration:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CLI_TARGET: x86_64-pc-windows-msvc
      CLI_SHA: 0acf92481b29b69e6bf9536dc6a13b2c569c5abd
      CLI_VERSION: 2.0.0-dev.20
      CLI_PRODUCER_RUN_ID: '44362424899'
      CLI_PRODUCER_ATTEMPT: '1'
      RSRS_RUNTIME_TRIPLE: x86_64-pc-windows-msvc
      RSRS_PUBLISHED_RUNTIME_VERSION: 2.0.0-dev.25
      RSRS_DEV_SERVER_ADDR: ${{ vars.RESPIRE_DEV_SERVER_ADDR }}
      RSRS_DEV_SERVER_SHA: ${{ vars.RESPIRE_DEV_SERVER_SHA }}
      # The existing fixture's offline installer verifies adjacent schema-2
      # metadata and the managed image. It never contacts a release endpoint.
      RSRS_ARTIFACT_SOURCE: published-assets
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify producer jobs and the exact artifact bytes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_RUN: ${{ inputs.runtime_run_id }}
          RUNTIME_SHA: ${{ inputs.runtime_sha }}
        run: |
          @'
          import hashlib, json, os, re, shutil, stat, subprocess, zipfile
          from pathlib import Path

          def require(condition, field):
              if not condition:
                  raise ValueError(field)

          def api(path):
              return json.loads(subprocess.check_output(["gh", "api", path]))

          def digest(path):
              with path.open("rb") as stream:
                  return hashlib.file_digest(stream, "sha256").hexdigest()

          scratch = Path(os.environ["RUNNER_TEMP"]) / "sealed-migration"
          scratch.mkdir()
          target = os.environ["CLI_TARGET"]
          cli_run = os.environ["CLI_PRODUCER_RUN_ID"]
          runtime_run = os.environ["RUNTIME_RUN"]
          runtime_sha = os.environ["RUNTIME_SHA"]
          require(re.fullmatch(r"[1-9][0-9]*", runtime_run), "Runtime run ID invalid")
          require(re.fullmatch(r"[a-f0-9]{40}", runtime_sha), "Runtime product SHA invalid")

          def consume(project, run_id, label, filenames):
              root = f"repos/risense-ai/respire-{project}/actions"
              run = api(f"{root}/runs/{run_id}")
              require(run["path"] == ".github/workflows/release.yml"
                      and run["event"] == "workflow_dispatch"
                      and run["head_branch"] == "main" and run["run_attempt"] == 1,
                      f"{project} release producer identity mismatch")
              if project == "cli":
                  require(run["head_sha"] == os.environ["CLI_SHA"], "CLI source mismatch")
              jobs = api(f"{root}/runs/{run_id}/attempts/1/jobs?per_page=100")
              require(jobs["total_count"] == len(jobs["jobs"]), f"{project} job listing incomplete")
              matches = [j for j in jobs["jobs"] if j["name"].split(" / ")[-1] == f"Release ({target})"]
              require(len(matches) == 1 and matches[0]["conclusion"] == "success",
                      f"{project} producer Windows build did not pass")
              inventory = api(f"{root}/runs/{run_id}/artifacts?per_page=100")
              require(inventory["total_count"] == len(inventory["artifacts"]), "Artifact inventory incomplete")
              rows = [a for a in inventory["artifacts"] if a["name"] == label and not a["expired"]]
              require(len(rows) == 1 and re.fullmatch(r"sha256:[a-f0-9]{64}", rows[0]["digest"]),
                      f"{project} unique artifact digest unavailable")
              artifact = rows[0]
              archive = scratch / f"{label}.zip"
              job = matches[0]
              require(artifact["workflow_run"]["id"] == int(run_id)
                      and job["started_at"] <= artifact["created_at"] <= artifact["updated_at"] <= job["completed_at"],
                      f"{project} artifact was not produced by the selected job")
              with archive.open("xb") as out:
                  subprocess.run(["gh", "api", f"{root}/artifacts/{artifact['id']}/zip"],
                                 stdout=out, check=True, timeout=120)
              require(archive.stat().st_size == artifact["size_in_bytes"]
                      and "sha256:" + digest(archive) == artifact["digest"], f"{project} artifact ZIP hash mismatch")
              destination = scratch / label
              destination.mkdir()
              with zipfile.ZipFile(archive) as bundle:
                  require(sorted(bundle.namelist()) == sorted(filenames),
                          f"{project} artifact file inventory mismatch")
                  for entry in bundle.infolist():
                      limit = 1024**2 if entry.filename.endswith(".json") else 256*1024**2
                      require(stat.S_IFMT(entry.external_attr >> 16) in (0, stat.S_IFREG)
                              and 0 < entry.file_size <= limit, "Unexpected artifact entry type or size")
                      with bundle.open(entry) as source, (destination / entry.filename).open("xb") as out:
                          shutil.copyfileobj(source, out)
              return destination, {k: artifact[k] for k in ("id", "name", "digest")}

          _, cli_artifact = consume("cli", cli_run, f"cli-release-{target}",
                                    [f"cli-build-{target}.json", f"rsrs-{target}.exe"])
          runtime_name = f"rsrs-runtime-{target}"
          metadata_name = f"runtime-build-{target}.json"
          runtime, runtime_artifact = consume("runtime", runtime_run, f"runtime-release-{target}",
                                              [metadata_name, runtime_name + ".tar.gz"])
          runtime_raw, runtime_raw_artifact = consume("runtime", runtime_run, f"runtime-release-binary-{target}",
                                                      [runtime_name + ".exe"])
          metadata_path = runtime / metadata_name
          archive = runtime / (runtime_name + ".tar.gz")
          metadata = json.loads(metadata_path.read_bytes())
          version = os.environ["RSRS_PUBLISHED_RUNTIME_VERSION"]
          require(metadata["schema_version"] == 2 and metadata["source_commit"] == runtime_sha
                  and metadata["tag"] == f"v{version}" and metadata["channel"] == "dev"
                  and metadata["runtime_version"] == version and metadata["target_triple"] == target
                  and metadata["binary_file"] == runtime_name + ".exe"
                  and metadata["archive_file"] == archive.name, "Runtime product identity mismatch")
          require(digest(archive) == metadata["archive_sha256"]
                  and digest(runtime_raw / metadata["binary_file"]) == metadata["binary_sha256"],
                  "Runtime release asset hash mismatch")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              for key, value in {
                  "RSRS_PUBLISHED_RUNTIME_ARCHIVE": archive,
                  "RSRS_PUBLISHED_RUNTIME_METADATA": metadata_path,
                  "RSRS_PUBLISHED_RUNTIME_METADATA_SHA256": digest(metadata_path),
                  "RSRS_PUBLISHED_BUNDLE_SHA256": metadata["archive_sha256"],
                  "RSRS_PUBLISHED_RUNTIME_SHA256": metadata["binary_sha256"],
              }.items():
                  print(f"{key}={value}", file=env)
          proof = {"runtime": runtime_artifact, "runtime_raw": runtime_raw_artifact,
                   "cli": cli_artifact, "runtime_sha": runtime_sha,
                   "runtime_run_id": runtime_run, "run_attempt": 1, "cli_run_id": cli_run,
                   "archive_sha256": metadata["archive_sha256"], "binary_sha256": metadata["binary_sha256"],
                   "metadata_sha256": digest(metadata_path)}
          (scratch / "input-proof.json").write_text(json.dumps(proof, indent=2), encoding="utf-8")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Producer evidence verification failed' }
      - name: Run the complete encrypted migration fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scratch = Join-Path $env:RUNNER_TEMP 'sealed-migration'
          node npm/scripts/set-build-version.mjs $env:CLI_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'CLI build version validation failed' }
          node npm/scripts/extract-artifact.mjs (Join-Path $scratch "cli-release-$env:CLI_TARGET") (Join-Path $scratch 'verified-cli')
          if ($LASTEXITCODE -ne 0) { throw 'CLI build extraction failed' }
          python -m pip install --only-binary=:all: cryptography==46.0.3
          if ($LASTEXITCODE -ne 0) { throw 'Native migration fixture dependencies failed' }
          $binary = Join-Path $scratch 'verified-cli/rsrs.exe'
          $checksum = (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant()
          python scripts/dev-profile-migration-smoke.py --binary $binary --binary-sha256 $checksum --version $env:CLI_VERSION --source-sha $env:CLI_SHA --root (Join-Path $scratch 'profile-migration')
          if ($LASTEXITCODE -ne 0) { throw 'Native encrypted migration failed' }
          $report = Get-Content -Raw -LiteralPath (Join-Path $scratch 'profile-migration/migration-coverage.json') | ConvertFrom-Json
          if ($report.passed -ne $true -or $report.cases.onememory_multiaccount_wal_migrated.profiles -ne 2 -or
              $report.cases.onememory_multiaccount_wal_migrated.deleted_payloads_reencrypted -lt 2) {
              throw 'Complete Windows multi-account migration evidence missing'
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sealed-windows-migration-evidence-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/sealed-migration/input-proof.json
            ${{ runner.temp }}/sealed-migration/profile-migration/migration-coverage.json
          if-no-files-found: error
