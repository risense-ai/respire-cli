name: Client2 launcher compatibility prototype

on:
  pull_request:
    paths:
      - 'cli/**'
      - 'spawn/**'
      - 'crates/commands/src/net_rpc.rs'
      - 'scripts/test-client2-launcher-compat.py'
      - 'scripts/fixtures/client2-v0256-probe/**'
      - '.github/workflows/client2-launcher-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-host:
    name: Unchanged Client2 host (${{ matrix.target }} prototype)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            exe: ''
          - os: macos-latest
            target: aarch64-apple-darwin
            exe: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: '.exe'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: risense-ai/respire-client2
          ref: 57bc070826949994c3f7ce9a64277160704bdfe5
          path: .client2-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: risense-ai/respire-magpie
          ref: a3ae9b3035d02b181ba7a8ddae251495d092dd63
          path: .magpie-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: false
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Compile the opt-in transport prototype
        run: cargo build --locked -p respire --features client2-host-prototype
      - name: Download and verify official pinned Runtime bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/client2-runtime"
          version="$(python3 -c 'import json; print(json.load(open("runtime-pin.json"))["required"])')"
          gh api "repos/risense-ai/respire-runtime/releases/tags/v$version" > "$RUNNER_TEMP/client2-runtime/release.json"
          gh release download "v$version" --repo risense-ai/respire-runtime \
            --pattern "rsrs-runtime-$RUNTIME_TARGET.tar.gz" \
            --pattern "runtime-build-$RUNTIME_TARGET.json" \
            --dir "$RUNNER_TEMP/client2-runtime"
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'client2-runtime'
          release = json.loads((root / 'release.json').read_text())
          assert not release['draft'] and release['prerelease']
          target = os.environ['RUNTIME_TARGET']
          for name in [f'rsrs-runtime-{target}.tar.gz', f'runtime-build-{target}.json']:
              asset, = [a for a in release['assets'] if a['name'] == name]
              data = (root / name).read_bytes()
              assert len(data) == asset['size'] and 'sha256:' + hashlib.sha256(data).hexdigest() == asset['digest'], name
          PY
      - name: Exercise original Client2 host and both startup orders
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-client2-launcher-compat.py \
            --cli target/debug/rsrs${{ matrix.exe }} \
            --runtime-archive "$RUNNER_TEMP/client2-runtime/rsrs-runtime-${{ matrix.target }}.tar.gz" \
            --runtime-version "$(python3 -c 'import json; print(json.load(open("runtime-pin.json"))["required"])')" \
            --client2-source .client2-source --go "$(python3 -c 'import shutil; print(shutil.which("go"))')" \
            --magpie-source .magpie-source --node "$(python3 -c 'import shutil; print(shutil.which("node"))')" \
            --report "$RUNNER_TEMP/client2-launcher-regression.json"
      - name: Preserve actual host results (not G1 evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client2-launcher-raw-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/client2-launcher-regression.json
          if-no-files-found: warn
          retention-days: 1
