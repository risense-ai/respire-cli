name: Diagnostic only Windows GUI recovery
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      ARTIFACT_SOURCE: build
      REQUEST_PUBLISH: 'false'
      CLI_TARGET: x86_64-pc-windows-msvc
      CLI_SHA: a8cd68c46eaad307d32cf48d2e4d82406d122581
      CLI_VERSION: 2.0.0-dev.19
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Authenticate original inputs and consume verified bytes without building
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $run = gh api repos/risense-ai/respire-cli/actions/runs/44098649710/attempts/1 | ConvertFrom-Json
          if ($LASTEXITCODE -or $run.head_sha -cne $env:CLI_SHA -or $run.run_attempt -ne 1 -or $run.repository.full_name -cne 'risense-ai/respire-cli') { throw 'Original run identity differs' }
          $job = gh api repos/risense-ai/respire-cli/actions/jobs/134099114118 | ConvertFrom-Json
          if ($LASTEXITCODE -or $job.run_id -ne 44098649710 -or $job.head_sha -cne $env:CLI_SHA -or $job.run_attempt -ne 1) { throw 'Original job identity differs' }
          $log = @(gh api --allow-escape-sequences repos/risense-ai/respire-cli/actions/jobs/134099114118/logs)
          if ($LASTEXITCODE) { throw 'Original input log unavailable' }
          $values = @($log | ForEach-Object { if ($_ -cmatch ' CANDIDATE_ASSETS: (\{.*\})$') { $Matches[1] } } | Select-Object -Unique)
          if ($values.Count -ne 1) { throw 'Require unique original candidate input' }
          $env:CANDIDATE_ASSETS = $values[0]
          "CANDIDATE_ASSETS=$env:CANDIDATE_ASSETS" >> $env:GITHUB_ENV
          $inventory = gh api --paginate --slurp repos/risense-ai/respire-cli/actions/runs/44098649710/artifacts | ConvertFrom-Json
          if ($LASTEXITCODE) { throw 'Artifact inventory failed' }
          $artifact = @($inventory.artifacts | Where-Object name -CEQ 'cli-release-x86_64-pc-windows-msvc')
          if ($artifact.Count -ne 1 -or $artifact[0].expired -or $artifact[0].workflow_run.head_sha -cne $env:CLI_SHA) { throw 'Original CLI artifact identity differs' }
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/original-cli" | Out-Null
          $download = [Diagnostics.ProcessStartInfo]::new('gh')
          $download.UseShellExecute = $false; $download.CreateNoWindow = $true; $download.RedirectStandardOutput = $true
          foreach ($arg in @('api','--allow-escape-sequences',"repos/risense-ai/respire-cli/actions/artifacts/$($artifact[0].id)/zip")) { [void]$download.ArgumentList.Add($arg) }
          $process = [Diagnostics.Process]::Start($download)
          $zip = [IO.File]::Create("$env:RUNNER_TEMP/original-cli.zip")
          try { $process.StandardOutput.BaseStream.CopyTo($zip) } finally { $zip.Dispose() }
          $process.WaitForExit()
          if ($process.ExitCode) { throw 'Original CLI artifact download failed' }
          if ('sha256:' + (Get-FileHash "$env:RUNNER_TEMP/original-cli.zip").Hash.ToLowerInvariant() -cne $artifact[0].digest) { throw 'Original artifact ZIP digest differs' }
          Expand-Archive -LiteralPath "$env:RUNNER_TEMP/original-cli.zip" -DestinationPath "$env:RUNNER_TEMP/original-cli"
          node npm/scripts/set-build-version.mjs 2.0.0-dev.19
          if ($LASTEXITCODE) { throw 'Manifest version preparation failed' }
          node npm/scripts/extract-artifact.mjs "$env:RUNNER_TEMP/original-cli" "$env:RUNNER_TEMP/diagnostic-cli"
          if ($LASTEXITCODE) { throw 'Original CLI schema2 verification failed' }
          node scripts/prepare-windows-recovery-diagnostic.mjs
          if ($LASTEXITCODE) { throw 'Diagnostic source and Runtime verification failed' }
      - name: Explicit official model install and real CPU inference
        shell: pwsh
        env:
          RSRS_ENGINE: cpu
          RSRS_NO_AUTOSYNC: '1'
          RSRS_UPDATE_CHECK: '0'
        run: |
          $ErrorActionPreference = 'Stop'
          $env:RSRS_DATA_DIR = "$env:RUNNER_TEMP/recovery-model-preparation"
          $env:HOME = "$env:RSRS_DATA_DIR/home"; $env:USERPROFILE = $env:HOME
          New-Item -ItemType Directory -Path $env:HOME | Out-Null
          $env:RSRS_M3_DIR = "$env:RSRS_DATA_DIR/models/bge-m3"
          $cli = "$env:RUNNER_TEMP/diagnostic-cli/rsrs.exe"
          & $cli --json runtime install --file $env:RSRS_PUBLISHED_RUNTIME_ARCHIVE --version 2.0.0-dev.24
          if ($LASTEXITCODE) { throw 'Model preparation Runtime installation failed' }
          $env:RSRS_RUNTIME_BIN = "$env:RSRS_DATA_DIR/bin/runtime/2.0.0-dev.24/rsrs-runtime.exe"
          $output = & $cli --direct model install-m3 --json
          if ($LASTEXITCODE) { throw 'Official model installation failed' }
          $model = $output | ConvertFrom-Json
          $proof = $model.details.backend_load.evidence
          if ($model.status -cne 'ok' -or -not $proof.ready -or -not $proof.inference_completed -or -not $proof.fresh_session -or $proof.dimensions -ne 1024 -or $proof.selected -cne 'CPU') { throw 'Real CPU inference proof differs' }
          $output | Set-Content "$env:RUNNER_TEMP/model-inference.json" -Encoding utf8NoBOM
          python -c "import importlib.util,os,pathlib; p=pathlib.Path('scripts/native-model-cache.py'); s=importlib.util.spec_from_file_location('models',p); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); [m.verify_file(pathlib.Path(os.environ['RSRS_M3_DIR'])/n,h) for n,h in m.FILES.items() if n != 'onnx/model_fp16.onnx']"
          if ($LASTEXITCODE) { throw 'Public model hash verification failed' }
          & $cli --runtime-internal --stop --json
          if ($LASTEXITCODE) { throw 'Model preparation stop failed' }
      - name: Run unchanged GUI phases with explicit diagnostic source separation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = [IO.File]::ReadAllText((Join-Path $PWD 'scripts/probe-client2-gui.ps1'))
          # Branch-only overlay: retain real harness SHA in consumer checks, but compare
          # CLI producer identity with its original run instead of this diagnostic run.
          $replacements = [ordered]@{
            '$candidate.source.sha -cne $env:GITHUB_SHA' = '$candidate.source.sha -cne ''a8cd68c46eaad307d32cf48d2e4d82406d122581'''
            '$candidate.source.run_id -ne [long]$env:GITHUB_RUN_ID' = '$candidate.source.run_id -ne 44098649710'
            '$candidate.source.run_attempt -ne [int]$env:GITHUB_RUN_ATTEMPT' = '$candidate.source.run_attempt -ne 1'
            "scope = 'protocol-compatible Client2 Windows GUI subset; not full GUI acceptance'" = "diagnostic_only = `$true; full_passed = `$false; harness_sha = `$env:GITHUB_SHA; scope = 'diagnostic only; original CLI bytes with repaired harness; not release evidence'"
          }
          foreach ($item in $replacements.GetEnumerator()) {
            if (($source.Split([string[]]@($item.Key),[StringSplitOptions]::None)).Count -ne 2) { throw 'Diagnostic overlay source changed' }
            $source = $source.Replace($item.Key,$item.Value)
          }
          $probe = Join-Path $PWD 'scripts/probe-client2-gui-diagnostic.ps1'
          [IO.File]::WriteAllText($probe,$source,[Text.UTF8Encoding]::new($false))
          & $probe -Cli "$env:RUNNER_TEMP/diagnostic-cli/rsrs.exe" -RuntimeArchive $env:RSRS_PUBLISHED_RUNTIME_ARCHIVE -RuntimeVersion 2.0.0-dev.24 -Client2Release v2.0.0-dev.15 -Client2Commit f3455ce639cc2ab9e35762c2668367fccb3d2ad5 -OutputDirectory "$env:RUNNER_TEMP/windows-recovery-diagnostic" -OfflineAcceptance -OfflineModelDirectory "$env:RUNNER_TEMP/recovery-model-preparation/models/bge-m3"
          if ($LASTEXITCODE) { throw 'Diagnostic GUI subset failed; inspect report' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-only-windows-recovery
          retention-days: 3
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/diagnostic-input-proof.json
            ${{ runner.temp }}/diagnostic-cli/*identity.json
            ${{ runner.temp }}/model-inference.json
            ${{ runner.temp }}/windows-recovery-diagnostic/report.json
            ${{ runner.temp }}/windows-recovery-diagnostic/native-gui.json
            ${{ runner.temp }}/windows-recovery-diagnostic/workspace.png
