name: Token-free native SDK source validation
on:
  workflow_call:
    inputs:
      source_sha: {required: true, type: string}
      target: {required: true, type: string}
      cache_key: {required: true, type: string}
      runner_os: {required: true, type: string}
      feedback_probe: {required: false, type: boolean, default: false}
      runtime_examples_sha: {required: false, type: string, default: ''}
    # Deliberately no secret declarations or inheritance.
permissions:
  contents: read
  actions: read
jobs:
  native-source:
    cache-mode: read
    name: Native SDK source validation
    runs-on: ${{ inputs.runner_os }}
    timeout-minutes: 90
    env:
      RSRS_ENGINE: cpu
      RUST_TEST_THREADS: '1'
      RUST_MIN_STACK: '16777216'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Require real native Linux ARM64 hardware
        shell: bash
        run: bash scripts/require-native-linux-arm64.sh '${{ inputs.target }}'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Require an exact reviewed Runtime example source
        id: runtime-source
        if: inputs.feedback_probe
        shell: bash
        env:
          RUNTIME_EXAMPLES_SHA: ${{ inputs.runtime_examples_sha }}
        run: |
          node scripts/fetch-runtime-test-bundle.mjs source
      - uses: actions/checkout@v5
        if: inputs.feedback_probe
        with:
          repository: risense-ai/respire-runtime
          ref: ${{ steps.runtime-source.outputs.sha }}
          path: .runtime-examples
          persist-credentials: false
      - name: Bind Runtime example source to the verified SDK lock
        if: inputs.feedback_probe
        shell: bash
        env:
          RUNTIME_EXAMPLES_SHA: ${{ steps.runtime-source.outputs.sha }}
          CLI_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$CLI_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CLI_SOURCE_SHA"
          test "$(git -C .runtime-examples rev-parse HEAD)" = "$RUNTIME_EXAMPLES_SHA"
          cmp <(git show HEAD:sdk/core-sdk.lock.json) <(git -C .runtime-examples show HEAD:sdk/core-sdk.lock.json)
          cmp <(git show HEAD:sdk/core-sdk.lock.json) <(git -C .runtime-examples show HEAD:crates/core-sdk/core-sdk.lock.json)
          test -f .runtime-examples/crates/commands/examples/feedback_contract_probe.rs
          test -f .runtime-examples/crates/commands/examples/ablation_bench.rs
          test -f .runtime-examples/crates/commands/examples/cli_business_tests.rs
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ inputs.target }}
      - name: Require a token-free process environment
        shell: bash
        run: test -z "${CORE_SDK_READ_TOKEN:-}"
      - name: Build native executable with the pinned SDK
        if: ${{ !contains(inputs.target, '-musl') }}
        shell: bash
        env:
          SDK_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          if [[ "$SDK_TARGET" == *windows-msvc ]]; then export RUSTFLAGS='-C target-feature=-crt-static'; fi
          cargo build --locked -p respire --bin rsrs --target "$SDK_TARGET" --target-dir target/ci
      - name: Build static musl executable
        if: contains(inputs.target, '-musl')
        shell: bash
        run: bash scripts/build-linux-musl.sh ${{ inputs.target }}
      - name: Actual CPU model installation and native inference
        shell: bash
        env:
          SDK_TARGET: ${{ inputs.target }}
          RSRS_RUNTIME_TRIPLE: ${{ inputs.target }}
          RSRS_DATA_DIR: ${{ runner.temp }}/private-sdk-probe
          RSRS_M3_DIR: ${{ runner.temp }}/private-sdk-probe/model
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN RSRS_RUNTIME_BIN
          profile=debug
          suffix=''
          if [[ "$SDK_TARGET" == *musl ]]; then profile=release; fi
          if [[ "$SDK_TARGET" == *windows-msvc ]]; then suffix=.exe; fi
          exe="target/ci/$SDK_TARGET/$profile/rsrs$suffix"
          "$exe" --version
          bash scripts/verify-linux-arm64-elf.sh "$SDK_TARGET" "$exe"
          "$exe" --json runtime install
          "$exe" --direct model install-m3 --json
          mkdir -p "$RSRS_DATA_DIR/bin"
          cp "$exe" "$RSRS_DATA_DIR/bin/rsrs$suffix"
          cmp "$exe" "$RSRS_DATA_DIR/bin/rsrs$suffix"
          "$exe" --direct model probe --model m3 --json
          CLI_FIXTURE_BINARY="$exe" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {appendFileSync, readFileSync, realpathSync, statSync} from 'node:fs';
          import {dirname, join} from 'node:path';
          import {spawnSync} from 'node:child_process';
          const root = realpathSync(process.env.RSRS_DATA_DIR);
          const pin = JSON.parse(readFileSync('runtime-pin.json', 'utf8'));
          const selected = JSON.parse(readFileSync(join(root, 'bin', 'runtime.json'), 'utf8'));
          assert.equal(selected.version, pin.required);
          assert.match(selected.sha256, /^[0-9a-f]{64}$/);
          assert.ok(selected.release, 'Official Runtime release proof is required');
          assert.equal(createHash('sha256').update(selected.release.metadata_json).digest('hex'), selected.release.metadata_sha256);
          const metadata = JSON.parse(selected.release.metadata_json);
          assert.equal(metadata.schema_version, 2);
          assert.equal(metadata.triple ?? metadata.target_triple, process.env.RSRS_RUNTIME_TRIPLE);
          assert.equal(metadata.runtime_version, pin.required);
          assert.equal(metadata.binary_sha256, selected.sha256);
          const runtime = realpathSync(join(root, 'bin', 'runtime', selected.version, process.platform === 'win32' ? 'rsrs-runtime.exe' : 'rsrs-runtime'));
          assert.ok(statSync(runtime).isFile());
          assert.notEqual(runtime, realpathSync(process.env.CLI_FIXTURE_BINARY));
          assert.equal(createHash('sha256').update(readFileSync(runtime)).digest('hex'), selected.sha256);
          const coreBytes = readFileSync(join(dirname(runtime), 'core-runtime.json'));
          assert.equal(createHash('sha256').update(coreBytes).digest('hex'),
            metadata.files.find(file => file.path === 'core-runtime.json')?.sha256);
          const core = JSON.parse(coreBytes);
          const sdk = JSON.parse(readFileSync('sdk/core-sdk.lock.json', 'utf8')).targets[process.env.SDK_TARGET];
          assert.ok(sdk, 'The native target must have a pinned SDK identity');
          assert.equal(core.target, process.env.SDK_TARGET);
          assert.equal(core.sdk_version, sdk.sdk_version);
          appendFileSync(process.env.GITHUB_ENV, `RSRS_RUNTIME_BIN=${runtime}\n`);
          const result = spawnSync('bash', ['scripts/probe-native-arm64-alpine.sh', process.env.RSRS_RUNTIME_TRIPLE,
            process.env.CLI_FIXTURE_BINARY, process.env.RSRS_M3_DIR, join(process.env.RUNNER_TEMP, 'arm-alpine-probe'),
            runtime, selected.sha256, selected.version], {env: process.env, stdio: 'inherit'});
          if (result.error) throw result.error;
          assert.equal(result.status, 0, 'Offline Alpine probe failed');
          NODE

      - name: Fetch reviewed precompiled Runtime tests and feedback examples
        if: inputs.feedback_probe && inputs.target != 'x86_64-apple-darwin'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SDK_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          node scripts/fetch-runtime-test-bundle.mjs fetch "$SDK_TARGET"
          node scripts/fetch-runtime-test-bundle.mjs verify "$SDK_TARGET" --list
      - name: Native snapshot lifecycle and precompiled feedback tests
        if: ${{ inputs.feedback_probe && inputs.target != 'x86_64-apple-darwin' && !contains(inputs.target, '-musl') }}
        shell: bash
        env:
          SDK_TARGET: ${{ inputs.target }}
          RSRS_CLI_SOURCE_SHA: ${{ inputs.source_sha }}
          RSRS_CORE_TEST_MODEL_DIR: ${{ runner.temp }}/private-sdk-probe/model
        run: |
          set -euo pipefail
          if [[ "$SDK_TARGET" == *windows-msvc ]]; then export RUSTFLAGS='-C target-feature=-crt-static'; fi
          test -f "$RSRS_RUNTIME_BIN"
          suffix=''; if [[ "$SDK_TARGET" == *windows-msvc ]]; then suffix=.exe; fi
          export RSRS_CLI_BIN="$(node -p 'require("node:path").resolve(process.argv[1])' "target/ci/$SDK_TARGET/debug/rsrs$suffix")"
          export RSRS_CLI_SOURCE_DIR="$(node -p 'process.cwd()')"
          unset GH_TOKEN GITHUB_TOKEN
          RSRS_CORE_TEST_MODE=1 "$RSRS_RUNTIME_APP_TESTS" snapshot::tests:: --test-threads=1
          RSRS_CORE_TEST_MODE=1 "$RSRS_RUNTIME_STORAGE_TESTS" transport::local::sync::diary_tests:: --test-threads=1
          RSRS_CORE_TEST_MODE=1 "$RSRS_RUNTIME_TEST_RUNNER" --test-threads=1
      - name: Static musl snapshot lifecycle and feedback probe build
        if: ${{ inputs.feedback_probe && inputs.target != 'x86_64-apple-darwin' && contains(inputs.target, '-musl') }}
        shell: bash
        env:
          SDK_TARGET: ${{ inputs.target }}
          RSRS_CLI_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test -f "$RSRS_RUNTIME_BIN"
          fixture_root="$(dirname "$(dirname "$(dirname "$(dirname "$RSRS_RUNTIME_BIN")")")")"
          fixture_binary="/runtime-fixture/bin/runtime/$(basename "$(dirname "$RSRS_RUNTIME_BIN")")/$(basename "$RSRS_RUNTIME_BIN")"
          unset GH_TOKEN GITHUB_TOKEN
          docker run --rm -v "$PWD:/workspace" -v "$fixture_root:/runtime-fixture:ro" -w /workspace -e TARGET="$SDK_TARGET" -e RSRS_RUNTIME_BIN="$fixture_binary" -e RSRS_CLI_BIN="/workspace/target/ci/$SDK_TARGET/release/rsrs" -e RSRS_CLI_SOURCE_DIR=/workspace -e RSRS_CLI_SOURCE_SHA="$RSRS_CLI_SOURCE_SHA" -e RSRS_CORE_TEST_MODEL_DIR=/runtime-fixture/model -e RSRS_RUNTIME_APP_TESTS="/workspace/${RSRS_RUNTIME_APP_TESTS#"$PWD/"}" -e RSRS_RUNTIME_STORAGE_TESTS="/workspace/${RSRS_RUNTIME_STORAGE_TESTS#"$PWD/"}" -e RSRS_RUNTIME_TEST_RUNNER="/workspace/${RSRS_RUNTIME_TEST_RUNNER#"$PWD/"}" rust:1.95.0-alpine3.23 sh -ec '
            echo "Checking minimal-musl ps syntax (diagnostic only):"
            if ps -p $$ -o pid= -o stat=; then echo "ps syntax available"; else echo "ps syntax unavailable; Linux lifecycle requires verified procfs"; fi
            RSRS_CORE_TEST_MODE=1 "$RSRS_RUNTIME_APP_TESTS" snapshot::tests:: --test-threads=1
            RSRS_CORE_TEST_MODE=1 "$RSRS_RUNTIME_STORAGE_TESTS" transport::local::sync::diary_tests:: --test-threads=1
            RSRS_CORE_TEST_MODE=1 "$RSRS_RUNTIME_TEST_RUNNER" --test-threads=1
          '
      - name: Actual model feedback across Core service runtime and both benchmarks
        if: inputs.feedback_probe && inputs.target != 'x86_64-apple-darwin'
        shell: bash
        env:
          SDK_TARGET: ${{ inputs.target }}
          RSRS_M3_DIR: ${{ runner.temp }}/private-sdk-probe/model
          RSRS_DATA_DIR: ${{ runner.temp }}/private-sdk-probe
        run: |
          set -euo pipefail
          test -z "${CORE_SDK_READ_TOKEN:-}"; test -z "${RSRS_CORE_TEST_MODE:-}"
          profile=debug; suffix=''
          if [[ "$SDK_TARGET" == *musl ]]; then profile=release; fi
          if [[ "$SDK_TARGET" == *windows-msvc ]]; then suffix=.exe; fi
          unset GH_TOKEN GITHUB_TOKEN
          export RSRS_CLI_BIN="$(node -p 'require("node:path").resolve(process.argv[1])' "target/ci/$SDK_TARGET/$profile/rsrs$suffix")"
          test -f "$RSRS_CLI_BIN"
          "$RSRS_RUNTIME_FEEDBACK_PROBE"

  source-coverage:
    if: inputs.target == 'x86_64-unknown-linux-gnu'
    cache-mode: read
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RSRS_ENGINE: cpu
      RUST_TEST_THREADS: '1'
      RUST_MIN_STACK: '16777216'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Resolve exact Runtime coverage source
        id: runtime-source
        shell: bash
        env:
          RUNTIME_EXAMPLES_SHA: ${{ inputs.runtime_examples_sha }}
        run: |
          node scripts/fetch-runtime-test-bundle.mjs source
      - uses: actions/checkout@v5
        with:
          repository: risense-ai/respire-runtime
          ref: ${{ steps.runtime-source.outputs.sha }}
          path: .runtime-examples
          persist-credentials: false
      - name: Bind coverage Runtime source and SDK identity
        shell: bash
        env:
          RUNTIME_EXAMPLES_SHA: ${{ steps.runtime-source.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git -C .runtime-examples rev-parse HEAD)" = "$RUNTIME_EXAMPLES_SHA"
          cmp <(git show HEAD:sdk/core-sdk.lock.json) <(git -C .runtime-examples show HEAD:sdk/core-sdk.lock.json)
          cmp <(git show HEAD:sdk/core-sdk.lock.json) <(git -C .runtime-examples show HEAD:crates/core-sdk/core-sdk.lock.json)
          test -f .runtime-examples/crates/commands/examples/cli_business_tests.rs
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ inputs.target }}
          components: llvm-tools-preview
      - name: Require a token-free coverage environment
        shell: bash
        run: test -z "${CORE_SDK_READ_TOKEN:-}"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare private business credential fixture for coverage
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(uname -m)" = x86_64 ] &&
             [ "$(dpkg --print-architecture)" = amd64 ] &&
             (. /etc/os-release; [ "${VERSION_CODENAME:-}" = noble ]) &&
             [ -f /etc/apt/apt-mirrors.txt ] &&
             [ -f /etc/apt/sources.list.d/ubuntu.sources ] &&
             [ -s /usr/share/keyrings/ubuntu-archive-keyring.gpg ] &&
             awk '
               BEGIN { RS = "\n[ \t\r]*\n"; FS = "\n" }
               {
                 uri = key = disabled = 0
                 for (i = 1; i <= NF; i++) {
                   if ($i ~ /^URIs:[[:space:]]+mirror\+file:\/etc\/apt\/apt-mirrors\.txt[[:space:]]*$/) uri = 1
                   if ($i ~ /^Signed-By:[[:space:]]+\/usr\/share\/keyrings\/ubuntu-archive-keyring\.gpg[[:space:]]*$/) key = 1
                   if (tolower($i) ~ /^enabled:[[:space:]]*no[[:space:]]*$/) disabled = 1
                 }
                 if (uri && key && !disabled) found = 1
               }
               END { exit !found }
             ' /etc/apt/sources.list.d/ubuntu.sources; then
            sudo sed -i '\|^[[:space:]]*https\?://azure\.archive\.ubuntu\.com/|d' /etc/apt/apt-mirrors.txt
            apt_mirror=$'https://mirror.us.leaseweb.net/ubuntu/\tpriority:0'
            if ! grep -Fxq "$apt_mirror" /etc/apt/apt-mirrors.txt; then
              printf '%s\n' "$apt_mirror" | sudo tee -a /etc/apt/apt-mirrors.txt >/dev/null
            fi
          fi
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install -y dbus gnome-keyring
          python -m pip install --only-binary=:all: SecretStorage==3.3.3 jeepney==0.9.0 cryptography==46.0.3
          python -B scripts/dev-secret-service-keyring-selftest.py --self-test
      - name: Prepare official Runtime and real model for migrated coverage tests
        shell: bash
        env:
          RSRS_DATA_DIR: ${{ runner.temp }}/coverage-runtime-fixture
          RSRS_M3_DIR: ${{ runner.temp }}/coverage-runtime-fixture/model
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN RSRS_RUNTIME_BIN RSRS_CORE_TEST_MODE
          cargo build --locked -p respire --bin rsrs
          target/debug/rsrs --json runtime install
          target/debug/rsrs --json model install-m3
          python - <<'PY'
          import os, sys
          sys.path.insert(0, 'scripts')
          from dev_model_fixture import share_cpu_container
          share_cpu_container(os.environ['RUNNER_TEMP'], os.environ, os.environ['RSRS_M3_DIR'])
          PY
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {appendFileSync, readFileSync, realpathSync, statSync} from 'node:fs';
          import {join} from 'node:path';
          const root = realpathSync(process.env.RSRS_DATA_DIR);
          const pin = JSON.parse(readFileSync('runtime-pin.json', 'utf8'));
          const selected = JSON.parse(readFileSync(join(root, 'bin', 'runtime.json'), 'utf8'));
          assert.equal(selected.version, pin.required);
          assert.ok(selected.release);
          assert.equal(createHash('sha256').update(selected.release.metadata_json).digest('hex'), selected.release.metadata_sha256);
          const metadata = JSON.parse(selected.release.metadata_json);
          assert.equal(metadata.runtime_version, pin.required);
          assert.equal(metadata.binary_sha256, selected.sha256);
          const runtime = realpathSync(join(root, 'bin', 'runtime', selected.version, 'rsrs-runtime'));
          assert.ok(statSync(runtime).isFile());
          assert.notEqual(runtime, realpathSync('target/debug/rsrs'));
          assert.equal(createHash('sha256').update(readFileSync(runtime)).digest('hex'), selected.sha256);
          appendFileSync(process.env.GITHUB_ENV, `RSRS_RUNTIME_BIN=${runtime}\nRSRS_CORE_TEST_MODEL_DIR=${process.env.RSRS_M3_DIR}\n`);
          NODE
      - name: Fetch precompiled Runtime business harness for source coverage
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/fetch-runtime-test-bundle.mjs fetch x86_64-unknown-linux-gnu
          node scripts/fetch-runtime-test-bundle.mjs verify x86_64-unknown-linux-gnu --list
      - name: Complete GNU source tests and existing coverage gate
        env:
          RSRS_CORE_TEST_MODE: '1'
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p respire_spawn -p respire_protocol -p respire_client_host -p respire_commands -p respire_logging
          cargo llvm-cov --locked -p respire --no-report
          (
            CARGO_LLVM_COV_TARGET_DIR="$PWD/target/llvm-cov-target" cargo llvm-cov show-env --sh > "$RUNNER_TEMP/cli-coverage.env"
            source "$RUNNER_TEMP/cli-coverage.env"
            # cargo-llvm-cov 0.9 uses a rustc wrapper instead of public RUSTFLAGS.
            if [[ "${RUSTFLAGS:-}${CARGO_ENCODED_RUSTFLAGS:-}" != *instrument-coverage* ]]; then
              if [[ "${__CARGO_LLVM_COV_RUSTC_WRAPPER:-}" != 1 || -z "${RUSTC_WRAPPER:-}" || "${__CARGO_LLVM_COV_RUSTC_WRAPPER_RUSTFLAGS:-}" != *instrument-coverage* ]]; then
                printf '::error::Coverage instrumentation is missing from both direct flags and the active rustc wrapper\n' >&2
                exit 1
              fi
            fi
            [[ "$LLVM_PROFILE_FILE" == "$PWD/target/llvm-cov-target/"* ]]
            export RSRS_CLI_BIN="$PWD/target/llvm-cov-target/debug/rsrs"
            export RSRS_CLI_SOURCE_DIR="$PWD"
            export RSRS_CLI_SOURCE_SHA="$(git rev-parse HEAD)"
            test -x "$RSRS_CLI_BIN"
            original_cli="$(sha256sum "$RSRS_CLI_BIN")"
            unset GH_TOKEN GITHUB_TOKEN
            env -u DBUS_SESSION_BUS_ADDRESS -u DBUS_SESSION_BUS_PID \
              -u DBUS_STARTER_ADDRESS -u DBUS_STARTER_BUS_TYPE \
              -u GNOME_KEYRING_CONTROL -u GNOME_KEYRING_PID -u SSH_AUTH_SOCK \
              dbus-run-session -- env RSRS_SS_FIXTURE_BUS=private \
              python -B scripts/dev-secret-service-keyring-selftest.py \
              --root "$RUNNER_TEMP/trusted-coverage-secret-service" -- \
              "$RSRS_RUNTIME_TEST_RUNNER" --test-threads=1
            test "$(sha256sum "$RSRS_CLI_BIN")" = "$original_cli"
          )
          node scripts/check-cli-coverage.mjs '(main\.rs|(^|/)cli/src/frontend\.rs$|web\.rs|rpc\.rs|runtime_(policy|error|http|fetch)\.rs|autostart/(supervise|manager)\.rs|login\.rs|extract_tui\.rs|inject_tui\.rs|shell\.rs|/shell/|/core/|model_(install|progress)\.rs|space\.rs|update_check\.rs|classify(_config)?\.rs|recall_select\.rs)'
