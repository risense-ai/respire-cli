name: Native migration credential fixture

# The temporary PR source-candidate trigger ended after Runtime dev.16 publication.
# Required CLI CI still runs the original three account cases against the official
# pinned Runtime, using the private Secret Service fixture and check-complete gate.
on:
  workflow_dispatch:
    inputs:
      runtime_candidate_sha:
        description: Optional exact unpublished Runtime source commit for the original account regression; CLI is this workflow commit
        required: false
        default: ''
        type: string
      cli_consumer:
        description: CLI consumer for source-candidate business tests; official-dev6 uses the unchanged published GNU binary and requires full mode
        required: false
        type: choice
        default: current-source
        options:
          - current-source
          - official-dev6
      business_suite:
        description: Original source cases; full requires every baseline case; diagnostic-failures runs four known failures without release acceptance
        required: false
        type: choice
        default: account
        options:
          - account
          - full
          - diagnostic-failures
      compatibility_host:
        description: Build the opt-in Client2 host and require its identity across account/space maintenance
        required: false
        type: boolean
        default: false
      require_native_stop:
        description: Require the real-process native stop case in full mode for new Runtime acceptance; false preserves old 30-case sources
        required: false
        type: boolean
        default: false
      release_run_id:
        description: Optional validated Release run for targeted native migration; blank runs credential fixtures only
        required: false
        default: ''
        type: string
      platform:
        description: Native migration diagnostic platform when release_run_id is set
        required: true
        default: both
        type: choice
        options:
          - both
          - linux-secret-service
          - macos
          - windows

permissions:
  contents: read
  actions: read

jobs:
  native-fixture:
    if: github.event_name == 'workflow_dispatch'
    name: Native credentials (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact disposable native credentials
        shell: bash
        run: python scripts/dev-migration-keyring-selftest.py --root "$RUNNER_TEMP/native-migration-keyring"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: 1
          name: native-migration-keyring-${{ runner.os }}
          path: ${{ runner.temp }}/native-migration-keyring/keyring-selftest.json
          if-no-files-found: error

  secret-service-fixture:
    if: github.event_name == 'workflow_dispatch'
    name: Isolated Secret Service credentials
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated credential fixture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus gnome-keyring
          python -m pip install --only-binary=:all: SecretStorage==3.3.3 jeepney==0.9.0 cryptography==46.0.3
      - name: Verify private Secret Service credential roundtrips
        run: dbus-run-session -- env RSRS_SS_FIXTURE_BUS=private python scripts/dev-secret-service-keyring-selftest.py --root "$RUNNER_TEMP/secret-service-keyring"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: 1
          name: isolated-secret-service-keyring-Linux
          path: ${{ runner.temp }}/secret-service-keyring/keyring-selftest.json
          if-no-files-found: error

  targeted-native-migration:
    if: github.event_name == 'workflow_dispatch' && inputs.release_run_id != ''
    name: Targeted migration (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platform == 'linux-secret-service' && '[{"os":"ubuntu-latest","target":"x86_64-unknown-linux-musl"}]' || inputs.platform == 'macos' && '[{"os":"macos-latest","target":"aarch64-apple-darwin"}]' || inputs.platform == 'windows' && '[{"os":"windows-latest","target":"x86_64-pc-windows-msvc"}]' || '[{"os":"ubuntu-latest","target":"x86_64-unknown-linux-musl"},{"os":"macos-latest","target":"aarch64-apple-darwin"}]') }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the original seven-platform release build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CLI_RUN_ID: ${{ inputs.release_run_id }}
        run: |
          node - <<'NODE'
          const cp=require('child_process'),fs=require('fs'),m=require('./npm/artifact-manifest.json');
          const id=process.env.CLI_RUN_ID,repo=process.env.GITHUB_REPOSITORY;
          if(repo!=='risense-ai/respire-cli'||!/^\d+$/.test(id)) throw new Error('Pass an exact Release run ID from risense-ai/respire-cli');
          const api=path=>JSON.parse(cp.execFileSync('gh',['api',`repos/${repo}/${path}`],{encoding:'utf8'}));
          const run=api(`actions/runs/${id}`),sha=run.head_sha;
          if(!/^[a-f0-9]{40}$/.test(sha)||!['.github/workflows/release.yml','.github/workflows/release-validation.yml'].includes(run.path)) throw new Error('Unexpected release source or workflow');
          const jobs=JSON.parse(cp.execFileSync('gh',['api','--paginate','--slurp',`repos/${repo}/actions/runs/${id}/jobs?per_page=10`],{encoding:'utf8'})).flatMap(page=>page.jobs);
          for(const name of [...m.targets.map(t=>`Release (${t.triple})`),'npm-dry-run']) {
            if(!jobs.some(j=>(j.name===name||j.name.endsWith(` / ${name}`))&&j.conclusion==='success')) throw new Error(`Original validation failed: ${name}`);
          }
          fs.appendFileSync(process.env.GITHUB_ENV,`CLI_SHA=${sha}\n`);
          NODE
      - uses: actions/download-artifact@v4
        with:
          name: cli-release-${{ matrix.target }}
          path: original-artifact
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ github.token }}
      - name: Verify and extract the exact original artifact
        id: verified_artifact
        shell: bash
        env:
          CLI_TARGET: ${{ matrix.target }}
          CLI_RUN_ID: ${{ inputs.release_run_id }}
        run: |
          node - <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const metadata=JSON.parse(fs.readFileSync(`original-artifact/cli-build-${process.env.CLI_TARGET}.json`,'utf8'));
          cp.execFileSync(process.execPath,['npm/scripts/set-build-version.mjs',metadata.version],{stdio:'inherit'});
          cp.execFileSync(process.execPath,['npm/scripts/extract-artifact.mjs','original-artifact','validated-cli'],{env:{...process.env,CLI_VERSION:metadata.version},stdio:'inherit'});
          fs.appendFileSync(process.env.GITHUB_ENV,`CLI_VERSION=${metadata.version}\nCLI_BINARY_SHA256=${metadata.binary_sha256}\n`);
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/targeted-migration-identity.json`,JSON.stringify({fixture_source_sha:process.env.GITHUB_SHA,binary_source_sha:process.env.CLI_SHA,binary_sha256:metadata.binary_sha256,version:metadata.version,target:process.env.CLI_TARGET,release_run_id:process.env.CLI_RUN_ID,repository:'risense-ai/respire-cli'},null,2)+'\n');
          NODE
      - name: Verify isolated Secret Service migration
        if: runner.os == 'Linux'
        shell: bash
        env:
          RSRS_DEV_SERVER_ADDR: ${{ vars.RESPIRE_DEV_SERVER_ADDR }}
          RSRS_DEV_SERVER_SHA: ${{ vars.RESPIRE_DEV_SERVER_SHA }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y dbus gnome-keyring
          python -m pip install --only-binary=:all: SecretStorage==3.3.3 jeepney==0.9.0 cryptography==46.0.3
          binary="$(realpath validated-cli/rsrs)"
          root="$RUNNER_TEMP/targeted-native-migration"
          fixture_status=0
          dbus-run-session -- env RSRS_SS_FIXTURE_BUS=private python scripts/dev-secret-service-migration-smoke.py --binary "$binary" --binary-sha256 "$CLI_BINARY_SHA256" --version "$CLI_VERSION" --source-sha "$CLI_SHA" --root "$root" || fixture_status=$?
          python scripts/dev-secret-service-migration-gate.py --migration-report "$root/migration-coverage.json" --report "$root/migration-platform-gate.json" --binary-sha256 "$CLI_BINARY_SHA256" --version "$CLI_VERSION" --source-sha "$CLI_SHA"
          test "$fixture_status" -eq 0
      - name: Verify native encrypted profile migration
        if: runner.os != 'Linux'
        shell: bash
        env:
          RSRS_DEV_SERVER_ADDR: ${{ vars.RESPIRE_DEV_SERVER_ADDR }}
          RSRS_DEV_SERVER_SHA: ${{ vars.RESPIRE_DEV_SERVER_SHA }}
        run: |
          set -euo pipefail
          python -m pip install --only-binary=:all: cryptography==46.0.3
          binary="$(python -c 'from pathlib import Path; import sys; print(Path("validated-cli/rsrs.exe" if sys.platform == "win32" else "validated-cli/rsrs").resolve())')"
          root="$RUNNER_TEMP/targeted-native-migration"
          fixture_status=0
          python scripts/dev-profile-migration-smoke.py --binary "$binary" --binary-sha256 "$CLI_BINARY_SHA256" --version "$CLI_VERSION" --source-sha "$CLI_SHA" --root "$root" || fixture_status=$?
          python - <<'PY'
          import importlib.util,json,os
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('native_contract','scripts/dev-secret-service-migration-gate.py')
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          report=json.loads((Path(os.environ['RUNNER_TEMP'])/'targeted-native-migration/migration-coverage.json').read_text())
          required=module.REQUIRED-{'secret_service_legacy_fields_and_aliases'}
          module.require(all(report.get(k)==os.environ[v] for k,v in [('source_sha','CLI_SHA'),('version','CLI_VERSION'),('binary_sha256','CLI_BINARY_SHA256')]),'migration_artifact_identity_mismatch')
          platform, backend = ('win32','windows-credential-manager') if os.environ['RUNNER_OS']=='Windows' else ('darwin','macos-keychain-synthetic-acl')
          module.require(report.get('platform')==platform and report.get('keyring_backend')==backend,'migration_native_backend_mismatch')
          module.require(set(report.get('required_cases',[]))==required and report.get('passed') is True and not report.get('missing_cases') and all(report.get('cases',{}).get(case,{}).get('passed') is True for case in required),'migration_incomplete')
          for key,remaining in [('cloud_cleanup','remaining_users'),('keyring_cleanup','remaining_entries')]:
              module.require(report.get(key,{}).get('passed') is True and not report.get(key,{}).get(remaining),'migration_cleanup_incomplete')
          PY
          test "$fixture_status" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: 1
          name: targeted-native-migration-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/targeted-migration-identity.json
            ${{ runner.temp }}/targeted-native-migration/migration-coverage.json
            ${{ runner.temp }}/targeted-native-migration/migration-platform-gate.json
          if-no-files-found: error

  source-account-regression:
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.runtime_candidate_sha != '' || inputs.cli_consumer == 'official-dev6')) ||
      (github.event_name == 'pull_request' && github.repository == 'risense-ai/respire-cli' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'integrate/shared-host-frontend-20261107')
    name: ${{ inputs.cli_consumer == 'official-dev6' && 'Official dev.6 CLI + candidate Runtime business' || 'Original account regression (source candidate)' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CLI_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      RUNTIME_SHA: ${{ github.event_name == 'pull_request' && '387ed1c560fd3bf336400f29119b6a577fa3f3d9' || inputs.runtime_candidate_sha }}
      COMPATIBILITY_HOST: ${{ inputs.compatibility_host && 'true' || 'false' }}
      CLI_CONSUMER: ${{ inputs.cli_consumer || 'current-source' }}
      CANDIDATE_CASE_NAME: ${{ inputs.cli_consumer == 'official-dev6' && 'official-dev6-business-regression' || 'source-account-regression' }}
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      RSRS_ENGINE: cpu
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.CLI_SHA }}
          persist-credentials: false
      - name: Require exact candidate source identities
        env:
          CLI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CLI_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          CLI_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = risense-ai/respire-cli
          [[ "$RUNTIME_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$CLI_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CLI_SHA"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            test "$CLI_SHA" = "$CLI_HEAD_SHA"
            test "$CLI_HEAD_REPOSITORY" = "$GITHUB_REPOSITORY"
            test "$CLI_HEAD_REF" = integrate/shared-host-frontend-20261107
            test "$RUNTIME_SHA" = 387ed1c560fd3bf336400f29119b6a577fa3f3d9
          fi
          test "$RUNNER_ARCH" = X64
          test "$(uname -m)" = x86_64
          case "$CLI_CONSUMER" in
            current-source) ;;
            official-dev6)
              test "$GITHUB_EVENT_NAME" = workflow_dispatch
              test '${{ inputs.business_suite }}' = full
              test "$COMPATIBILITY_HOST" = false
              ;;
            *) echo 'Unknown CLI consumer' >&2; exit 1 ;;
          esac
      - uses: actions/checkout@v5
        if: env.CLI_CONSUMER == 'official-dev6'
        with:
          ref: 425f397db2a64347d3d27fa93db630fad6b9b520
          path: .account-cli-dev6
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: risense-ai/respire-runtime
          ref: ${{ env.RUNTIME_SHA }}
          path: .account-runtime
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and verify the unchanged official dev.6 CLI
        if: env.CLI_CONSUMER == 'official-dev6'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git -C .account-cli-dev6 rev-parse HEAD)" = 425f397db2a64347d3d27fa93db630fad6b9b520
          test -z "$(git -C .account-cli-dev6 status --porcelain)"
          mkdir -p "$RUNNER_TEMP/official-dev6-cli"
          gh api repos/risense-ai/respire-cli/releases/tags/v1.0.21-dev.6 > "$RUNNER_TEMP/official-dev6-cli/release.json"
          gh release download v1.0.21-dev.6 --repo risense-ai/respire-cli \
            --pattern rsrs-x86_64-unknown-linux-gnu \
            --pattern cli-build-x86_64-unknown-linux-gnu.json \
            --dir "$RUNNER_TEMP/official-dev6-cli"
          python - <<'PY'
          import hashlib, json, os, pathlib, tomllib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'official-dev6-cli'
          source = pathlib.Path('.account-cli-dev6')
          version = '1.0.21-dev.6'
          source_sha = '425f397db2a64347d3d27fa93db630fad6b9b520'
          binary_name = 'rsrs-x86_64-unknown-linux-gnu'
          metadata_name = 'cli-build-x86_64-unknown-linux-gnu.json'
          binary_hash = 'f82eef533b906dd5ed5e96ebe17321571084ff138c29acdc92f55ebb8a8ecf2e'
          metadata_hash = '243a679da8b9436b7a6e5e09a5e4f113ad09e4d64e9166f50e6a10105c45619b'
          release = json.loads((root / 'release.json').read_text())
          assert release['tag_name'] == 'v' + version and release['prerelease'] and not release['draft']
          for name, size, digest in [(binary_name, 14133456, binary_hash), (metadata_name, 427, metadata_hash)]:
              asset, = [asset for asset in release['assets'] if asset['name'] == name]
              data = (root / name).read_bytes()
              assert len(data) == asset['size'] == size, name
              assert 'sha256:' + hashlib.sha256(data).hexdigest() == asset['digest'] == 'sha256:' + digest, name
          metadata = json.loads((root / metadata_name).read_text())
          expected = {'schema_version': 2, 'artifact_layout': 'cli-frontend-v2',
              'git_sha': source_sha, 'version': version, 'target': 'x86_64-unknown-linux-gnu',
              'binary_file': binary_name, 'binary_size': 14133456, 'binary_sha256': binary_hash}
          assert all(metadata[key] == value for key, value in expected.items())
          # The release workflow applies dev.6 only to its temporary build tree.
          assert tomllib.loads((source / 'cli/Cargo.toml').read_text())['package']['version'] == '1.0.21-dev.5'
          assert (source / 'sdk/core-sdk.lock.json').read_bytes() == pathlib.Path('sdk/core-sdk.lock.json').read_bytes()
          (root / binary_name).chmod(0o700)
          PY
      - name: Bind the candidate Runtime and SDK locks
        run: |
          set -euo pipefail
          test "$(git -C .account-runtime rev-parse HEAD)" = "$RUNTIME_SHA"
          cmp sdk/core-sdk.lock.json .account-runtime/sdk/core-sdk.lock.json
          cmp sdk/core-sdk.lock.json .account-runtime/crates/core-sdk/core-sdk.lock.json
          test "$(rustc -Vv | sed -n 's/^host: //p')" = x86_64-unknown-linux-gnu
          python -B scripts/test-native-account-candidate.py
          python -B scripts/dev-secret-service-keyring-selftest.py --self-test
      - name: Resolve the existing pinned SDK cache
        id: account-sdk
        run: echo "key=$(node scripts/sdk-ci-cache.mjs key x86_64-unknown-linux-gnu)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: account-sdk-restore
        with:
          path: .sdk/x86_64-unknown-linux-gnu
          key: ${{ steps.account-sdk.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Verify the exact SDK cache and bytes without a private token
        env:
          EXPECTED_KEY: ${{ steps.account-sdk.outputs.key }}
          MATCHED_KEY: ${{ steps.account-sdk-restore.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_KEY" && test "$MATCHED_KEY" = "$EXPECTED_KEY"
          node scripts/fetch-core-sdk.mjs x86_64-unknown-linux-gnu
      - name: Build the exact CLI, Runtime and original business harness
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN CORE_SDK_READ_TOKEN
          export RSRS_CORE_SDK_DIR="$PWD/.sdk/x86_64-unknown-linux-gnu"
          if [ "$CLI_CONSUMER" = current-source ]; then
            cli_features=()
            if [ "$COMPATIBILITY_HOST" = true ]; then cli_features=(--features client2-host-prototype); fi
            cargo build --locked -p respire --bin rsrs "${cli_features[@]}" --target-dir "$RUNNER_TEMP/account-cli-target"
          fi
          cargo build --locked --manifest-path .account-runtime/Cargo.toml -p respire_runtime --bin rsrs-runtime --target-dir "$RUNNER_TEMP/account-runtime-target"
          cargo test --locked --manifest-path .account-runtime/Cargo.toml -p respire_commands --features respire_app/cpu-owned-ort-experiment --example cli_business_tests --no-run --message-format=json --target-dir "$RUNNER_TEMP/account-runtime-target" > "$RUNNER_TEMP/account-harness-build.jsonl" || { cat "$RUNNER_TEMP/account-harness-build.jsonl"; exit 1; }
          node .account-runtime/scripts/stage-core-runtime.mjs "$RUNNER_TEMP/account-runtime-target/debug"
          node .account-runtime/scripts/stage-core-runtime.mjs "$RUNNER_TEMP/account-runtime-target/debug/examples"
          python - <<'PY'
          import json, os
          from pathlib import Path
          records = [json.loads(line) for line in (Path(os.environ['RUNNER_TEMP']) / 'account-harness-build.jsonl').read_text().splitlines()]
          binaries = [row['executable'] for row in records if row.get('reason') == 'compiler-artifact' and row.get('target', {}).get('name') == 'cli_business_tests' and row.get('profile', {}).get('test') and row.get('executable')]
          assert len(binaries) == 1, 'Require the actual original account harness'
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'ACCOUNT_HARNESS={Path(binaries[0]).resolve()}\n')
          PY
      - name: Install the existing private credential fixture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus gnome-keyring
          python -m pip install --only-binary=:all: SecretStorage==3.3.3 jeepney==0.9.0 cryptography==46.0.3
      - name: Execute the original account regression with the offline candidate
        run: |
          set -euo pipefail
          host_args=()
          if [ "$COMPATIBILITY_HOST" = true ]; then host_args=(--compatibility-host); fi
          if [ '${{ inputs.require_native_stop }}' = true ]; then host_args+=(--require-native-stop); fi
          consumer_source="$PWD"
          consumer_sha="$CLI_SHA"
          consumer_binary="$RUNNER_TEMP/account-cli-target/debug/rsrs"
          if [ "$CLI_CONSUMER" = official-dev6 ]; then
            consumer_source="$PWD/.account-cli-dev6"
            consumer_sha=425f397db2a64347d3d27fa93db630fad6b9b520
            consumer_binary="$RUNNER_TEMP/official-dev6-cli/rsrs-x86_64-unknown-linux-gnu"
            host_args+=(--official-cli-metadata "$RUNNER_TEMP/official-dev6-cli/cli-build-x86_64-unknown-linux-gnu.json")
          fi
          python -B scripts/native-account-candidate.py "${host_args[@]}" \
            --root "$RUNNER_TEMP/$CANDIDATE_CASE_NAME" \
            --cli-source "$consumer_source" --cli-sha "$consumer_sha" \
            --runtime-source "$PWD/.account-runtime" --runtime-sha "$RUNTIME_SHA" \
            --suite '${{ inputs.business_suite || 'account' }}' \
            --cli "$consumer_binary" \
            --runtime "$RUNNER_TEMP/account-runtime-target/debug/rsrs-runtime" \
            --harness "$ACCOUNT_HARNESS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.cli_consumer == 'official-dev6' && 'official-dev6-business-regression' || 'source-account-regression' }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          path: ${{ runner.temp }}/${{ env.CANDIDATE_CASE_NAME }}/result.json
          if-no-files-found: error
