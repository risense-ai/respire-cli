name: Native migration credential fixture

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-fixture:
    name: Native credentials (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact disposable native credentials
        shell: bash
        run: python scripts/dev-migration-keyring-selftest.py --root "$RUNNER_TEMP/native-migration-keyring"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-migration-keyring-${{ runner.os }}
          path: ${{ runner.temp }}/native-migration-keyring/keyring-selftest.json
          if-no-files-found: error
