name: Published performance comparison
on:
  workflow_dispatch:
    inputs:
      comparison_mode:
        description: Candidate-only cold/warm consistency with normal heat updates
        type: choice
        default: candidate-only
        options:
          - candidate-only
      release_inventory:
        description: Official published-assets schema 2 JSON (schema/cli/runtime), seven CLI and seven Runtime targets with exact release IDs, sources, metadata producers and asset IDs/sizes/SHA256
        type: string
        required: true
      release_inventory_sha256:
        description: SHA256 of the exact reviewed release_inventory UTF-8 bytes
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/performance-model
          key: performance-m3-quantized-0826f8c1-${{ runner.os }}
      - name: Install benchmark dependencies
        run: python -m pip install cryptography==46.0.3 psutil==7.1.0
      - name: Compare immutable published binaries on the same runner
        env:
          GH_TOKEN: ${{ github.token }}
          PERF_COMPARISON_MODE: ${{ inputs.comparison_mode }}
          PERF_RELEASE_INVENTORY: ${{ inputs.release_inventory }}
          PERF_RELEASE_INVENTORY_SHA256: ${{ inputs.release_inventory_sha256 }}
          PERF_TARGET: ${{ matrix.target }}
          PERF_ROOT: ${{ runner.temp }}/comparison
          PERF_MODEL: ${{ runner.temp }}/performance-model
        run: python scripts/compare-published-performance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: 1
          name: performance-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/comparison/report.json
            ${{ runner.temp }}/comparison/published-assets-receipt.json
          if-no-files-found: error
