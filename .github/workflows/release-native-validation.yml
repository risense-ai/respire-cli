name: Native release regression

on:
  workflow_call:
    inputs:
      artifact_source:
        default: build
        type: string
      published_assets:
        default: ''
        type: string
      published_assets_sha256:
        default: ''
        type: string
      candidate_assets:
        default: ''
        type: string
      ref:
        required: true
        type: string
      version:
        required: true
        type: string

      validation_profile:
        default: full
        type: string
      producer_prefix:
        default: ''
        type: string
      recovery_run:
        description: Original frozen producer; selects only the complete Windows x64 native scope
        default: ''
        type: string
      recovery_attempt:
        default: ''
        type: string
      recovery_matrix:
        default: ''
        type: string
      recovery_suffix:
        default: ''
        type: string
      musl_source_recovery:
        description: Fixed CLI3930 continuation; only v1.0.8 and missing resident
        default: false
        type: boolean
      musl_fixture_commit:
        default: ''
        type: string
      client2_release:
        description: Explicit public Client2 tag for product upgrade acceptance; empty selects CI candidate evidence
        default: ''
        type: string
      client2_commit:
        description: Protocol-compatible Client2 source commit, independent of CLI and Runtime versions
        default: 6ffa187685734873721ab51f3a54d8b2c29cd269
        type: string
      client2_candidate_run_id:
        description: Authenticated Desktop candidate for CLI acceptance before Client2 publication
        default: '43721147038'
        type: string

permissions:
  contents: read

env:
  CANDIDATE_ASSETS: ${{ inputs.candidate_assets }}
  ARTIFACT_SOURCE: ${{ inputs.artifact_source || 'build' }}
  PUBLISHED_ASSETS: ${{ inputs.published_assets }}
  PUBLISHED_ASSETS_SHA256: ${{ inputs.published_assets_sha256 }}
  REQUEST_PUBLISH: 'false'
  VALIDATION_PROFILE: full
  RELEASE_REF: ${{ inputs.ref }}
  CLI_PRODUCER_RUN_ID: ${{ inputs.recovery_run }}
  CLI_PRODUCER_ATTEMPT: ${{ inputs.recovery_attempt }}
  CLI_VERSION: ${{ inputs.version }}

jobs:
  native:
    name: Native (${{ matrix.target }})
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.recovery_matrix || '[{"os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu"},{"os":"ubuntu-latest","target":"x86_64-unknown-linux-musl"},{"os":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-gnu"},{"os":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-musl"},{"os":"macos-15-intel","target":"x86_64-apple-darwin"},{"os":"macos-15","target":"aarch64-apple-darwin"},{"os":"windows-latest","target":"x86_64-pc-windows-msvc","rustflags":"-C target-feature=-crt-static"},{"os":"windows-11-arm","target":"aarch64-pc-windows-msvc","rustflags":"-C target-feature=-crt-static"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require native Windows ARM64 hardware
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          if ($env:RUNNER_ARCH -ne 'ARM64' -or [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'Arm64') {
            throw 'Windows ARM64 acceptance requires native ARM64 hardware'
          }
      - name: Require real native Linux ARM64 hardware
        shell: bash
        run: bash scripts/require-native-linux-arm64.sh '${{ matrix.target }}'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate the selected native profile
        env:
          VALIDATION_PROFILE: ${{ inputs.validation_profile }}
        run: node -e "if(!['critical','full'].includes(process.env.VALIDATION_PROFILE))throw Error('Unknown native validation profile')"
      - name: Prepare ephemeral build version
        if: inputs.artifact_source != 'published-assets'
        run: node npm/scripts/set-build-version.mjs ${{ inputs.version }}
      - name: Wait only for this target's successful producer and unique artifact
        id: artifact
        if: inputs.validation_profile == 'critical'
        timeout-minutes: 46
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CLI_TARGET: ${{ matrix.target }}
          PRODUCER_PREFIX: ${{ inputs.producer_prefix }}
        run: |
          node - <<'NODE'
          const cp=require('child_process'),fs=require('fs');
          const repo=process.env.GITHUB_REPOSITORY,run=process.env.GITHUB_RUN_ID,attempt=Number(process.env.GITHUB_RUN_ATTEMPT);
          const name='cli-release-'+process.env.CLI_TARGET,producer=process.env.PRODUCER_PREFIX+'Release ('+process.env.CLI_TARGET+')';
          const read=path=>JSON.parse(cp.execFileSync('gh',['api','repos/'+repo+'/actions/runs/'+run+path],{encoding:'utf8',timeout:30000}));
          async function wait(){
            const deadline=Date.now()+45*60*1000;
            while(Date.now()<deadline){
              const current=read('');
              if(current.id!==Number(run))throw Error('Native producer run ID mismatch: expected '+run+', got '+current.id);
              if(current.run_attempt!==attempt)throw Error('Native producer run attempt mismatch: expected '+attempt+', got '+current.run_attempt);
              if(current.head_sha!==process.env.GITHUB_SHA)throw Error('Native producer workflow SHA mismatch: expected '+process.env.GITHUB_SHA+', got '+current.head_sha);
              if(current.status==='queued'){
                console.log('Native producer run is queued; waiting before reading producer jobs or artifacts');
                await new Promise(resolve=>setTimeout(resolve,10000));continue;
              }
              if(current.status!=='in_progress')throw Error('Native producer run status refused: '+current.status);
              const page=read('/attempts/'+attempt+'/jobs?per_page=100');
              if(page.total_count!==page.jobs.length)throw Error('Incomplete producer job inventory');
              const jobs=page.jobs.filter(j=>j.name===producer);
              if(jobs.length>1)throw Error('Duplicate target producer');
              const job=jobs[0];
              if(job){
                if(!Number.isSafeInteger(job.id)||job.id<=0)throw Error('Target producer job ID is invalid');
                if(job.run_id!==Number(run))throw Error('Target producer run ID mismatch: expected '+run+', got '+job.run_id);
                if(job.run_attempt!==attempt)throw Error('Target producer attempt mismatch: expected '+attempt+', got '+job.run_attempt);
                if(job.head_sha!==current.head_sha)throw Error('Target producer workflow SHA mismatch: expected '+current.head_sha+', got '+job.head_sha);
              }
              if(job?.status==='completed'&&job.conclusion!=='success')throw Error('Target producer concluded '+job.conclusion);
              if(job?.status==='completed'&&job.conclusion==='success'){
                const inventory=read('/artifacts?per_page=100');
                if(inventory.total_count!==inventory.artifacts.length)throw Error('Incomplete target artifact inventory');
                const artifacts=inventory.artifacts.filter(a=>a.name===name);
                if(artifacts.length>1)throw Error('Duplicate target artifact');
                if(artifacts.length===1){
                  const a=artifacts[0];
                  if(a.expired!==false||!Number.isSafeInteger(a.id)||a.id<=0||a.size_in_bytes<=0||!/^sha256:[a-f0-9]{64}$/.test(a.digest)||a.workflow_run?.id!==Number(run)||a.workflow_run.head_sha!==current.head_sha)throw Error('Target artifact identity differs');
                  fs.appendFileSync(process.env.GITHUB_OUTPUT,'artifact_id='+a.id+'\n');return;
                }
              }
              console.log('Waiting only for '+producer);
              await new Promise(resolve=>setTimeout(resolve,10000));
            }
            throw Error('Target producer/artifact unavailable within 45 minutes');
          }
          wait().catch(error=>{console.error(error.message);process.exit(1)});
          NODE
      - uses: actions/download-artifact@v4
        if: inputs.validation_profile == 'critical'
        with:
          artifact-ids: ${{ steps.artifact.outputs.artifact_id }}
          path: validated-cli
          merge-multiple: true
      - uses: actions/download-artifact@v4
        if: inputs.validation_profile == 'full' && inputs.artifact_source != 'published-assets' && inputs.recovery_run == ''
        with:
          name: cli-release-${{ matrix.target }}
          path: validated-cli
      - uses: actions/checkout@v5
        if: inputs.recovery_run != ''
        with:
          ref: ${{ github.sha }}
          path: .recovery-harness
          fetch-depth: 0
          persist-credentials: false
      - name: Load reviewed orchestration without changing product or business fixtures
        if: inputs.recovery_run != ''
        shell: bash
        run: cp .recovery-harness/npm/scripts/{release-recovery3930,release-recovery-sources,release-preparation,candidate-artifact,extract-artifact,publication-acceptance,release-publication}.mjs npm/scripts/
      - name: Load fixed musl continuation and bind the reviewed fixture revision
        if: inputs.musl_source_recovery
        shell: bash
        env:
          MUSL_FIXTURE_COMMIT: ${{ inputs.musl_fixture_commit }}
          CLI_TARGET: ${{ matrix.target }}
        run: |
          cp .recovery-harness/npm/scripts/release-musl3930.mjs npm/scripts/
          node npm/scripts/release-musl3930.mjs fixtures '${{ runner.temp }}/musl-fixture-identity.json'
      - name: Verify original producer job, ZIP and metadata without replacing its identity
        if: inputs.recovery_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CLI_PRODUCER_RUN_ID: ${{ inputs.recovery_run }}
          CLI_TARGET: ${{ matrix.target }}
          MUSL_FIXTURE_COMMIT: ${{ inputs.musl_fixture_commit }}
        run: node npm/scripts/${{ inputs.musl_source_recovery && 'release-musl3930' || 'release-recovery3930' }}.mjs native validated-cli
      - uses: actions/download-artifact@v4
        if: inputs.artifact_source == 'published-assets'
        with:
          name: published-assets-verification-${{ matrix.target }}
          path: validated-cli
      - name: Verify and extract the release binary
        env:
          GH_TOKEN: ${{ github.token }}
          CLI_TARGET: ${{ matrix.target }}
          CLI_SHA: ${{ inputs.artifact_source == 'published-assets' && fromJSON(inputs.published_assets).cli.source_sha || inputs.ref }}
          CLI_VERSION: ${{ inputs.version }}
        run: node npm/scripts/extract-artifact.mjs validated-cli target/ci/${{ matrix.target }}/release
      - name: Prepare isolated upgrade Python and the fixed Windows wheel key
        id: wheel-key
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/upgrade-python"
          py="$RUNNER_TEMP/upgrade-python/bin/python"
          if [ "$RUNNER_OS" = Windows ]; then py="$RUNNER_TEMP/upgrade-python/Scripts/python.exe"; fi
          if [ "$RUNNER_OS" = Windows ]; then
            "$py" -m pip install --only-binary=:all: pip==26.2.2 setuptools==84.2.1 wheel==0.48.0
          fi
          "$py" -m pip install --only-binary=:all: cryptography==46.0.3
          if [ "$RUNNER_OS" = Linux ]; then
            bash scripts/ci-apt-get.sh update
            bash scripts/ci-apt-get.sh install -y --no-install-recommends dbus-x11 gnome-keyring
            "$py" -m pip install --only-binary=:all: SecretStorage==3.3.3 jeepney==0.9.0
          fi
          if [ "$RUNNER_OS" = Windows ]; then
            key="$("$py" scripts/native-psutil-wheel-cache.py key)"
            echo "key=$key" >> "$GITHUB_OUTPUT"
          fi
      - name: Install and verify the official pinned standalone Runtime
        if: inputs.artifact_source != 'published-assets'
        id: pinned-runtime
        shell: bash
        env:
          CLI_TARGET: ${{ matrix.target }}
          RUNTIME_FIXTURE_HOSTED: ${{ runner.environment == 'github-hosted' }}
          RSRS_DATA_DIR: ${{ runner.temp }}/release-probe
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {appendFileSync, mkdirSync, readFileSync, realpathSync, statSync} from 'node:fs';
          import {join, resolve} from 'node:path';
          import {spawnSync} from 'node:child_process';
          assert.equal(process.env.GITHUB_ACTIONS, 'true');
          assert.equal(process.env.RUNTIME_FIXTURE_HOSTED, 'true');
          const extension = process.platform === 'win32' ? '.exe' : '';
          const cli = resolve('target/ci', process.env.CLI_TARGET, 'release', 'rsrs' + extension);
          // Model maintenance verifies the managed installation in the probe's data root.
          // A binary override from another root cannot replace that installation proof.
          const root = resolve(process.env.RSRS_DATA_DIR); mkdirSync(root);
          const home = join(root, 'home'); mkdirSync(home);
          const env = {...process.env, RSRS_DATA_DIR: root, HOME: home, USERPROFILE: home, RSRS_RUNTIME_TRIPLE: process.env.CLI_TARGET,
            RSRS_UPDATE_CHECK: '0', RSRS_NO_AUTOSYNC: '1'};
          for (const key of ['GH_TOKEN', 'GITHUB_TOKEN', 'RSRS_CORE_TEST_MODE', 'RSRS_RUNTIME_BIN']) delete env[key];
          const {installPinnedRuntime} = await import('./scripts/ci-install-pinned-runtime.mjs');
          const result = await installPinnedRuntime(cli, {env}, process.env.CLI_TARGET);
          if (result.error) throw result.error;
          assert.equal(result.status, 0, 'Official pinned Runtime installation failed');
          const pin = JSON.parse(readFileSync('runtime-pin.json', 'utf8'));
          const selected = JSON.parse(readFileSync(join(root, 'bin', 'runtime.json'), 'utf8'));
          assert.equal(selected.version, pin.required);
          assert.match(selected.sha256, /^[0-9a-f]{64}$/);
          assert.ok(selected.release, 'Official Runtime release proof is required');
          assert.equal(createHash('sha256').update(selected.release.metadata_json).digest('hex'), selected.release.metadata_sha256);
          const metadata = JSON.parse(selected.release.metadata_json);
          assert.equal(metadata.triple ?? metadata.target_triple, process.env.CLI_TARGET);
          assert.equal(metadata.runtime_version, pin.required);
          const runtime = realpathSync(join(root, 'bin', 'runtime', pin.required, 'rsrs-runtime' + extension));
          assert.ok(statSync(runtime).isFile());
          assert.notEqual(runtime, realpathSync(cli), 'CLI cannot substitute for standalone Runtime');
          assert.equal(createHash('sha256').update(readFileSync(runtime)).digest('hex'), selected.sha256);
          if (process.env.CANDIDATE_ASSETS) {
            assert.equal(selected.sha256, process.env.RSRS_PUBLISHED_RUNTIME_SHA256);
            assert.equal(selected.release.metadata_sha256, process.env.RSRS_PUBLISHED_RUNTIME_METADATA_SHA256);
          }
          for (const [key, value] of Object.entries({path: runtime, sha256: selected.sha256, version: selected.version})) {
            assert.ok(!/[\r\n]/.test(value));
            appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value}\n`);
          }
          NODE
      - name: Prepare hosted Linux user systemd for OS autostart
        if: runner.os == 'Linux' && inputs.validation_profile == 'full'
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          uid="$(id -u)"
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$uid.service"
          sudo systemctl is-active --quiet "user@$uid.service"
          export XDG_RUNTIME_DIR="/run/user/$uid"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          test ! -L "$XDG_RUNTIME_DIR"
          test "$(stat -c '%u:%a' "$XDG_RUNTIME_DIR")" = "$uid:700"
          test ! -L "$XDG_RUNTIME_DIR/bus"
          test -S "$XDG_RUNTIME_DIR/bus"
          test "$(stat -c '%u' "$XDG_RUNTIME_DIR/bus")" = "$uid"
          # user@ readiness covers basic.target, not the socket-activated API bus.
          systemctl --user start dbus.service
          systemctl --user is-active --quiet dbus.socket dbus.service
          test "$(busctl --user call org.freedesktop.DBus /org/freedesktop/DBus org.freedesktop.DBus NameHasOwner s org.freedesktop.systemd1)" = 'b true'
          test "$(busctl --user call org.freedesktop.DBus /org/freedesktop/DBus org.freedesktop.DBus GetConnectionUnixUser s org.freedesktop.systemd1)" = "u $uid"
          printf 'XDG_RUNTIME_DIR=%s\nDBUS_SESSION_BUS_ADDRESS=%s\n' "$XDG_RUNTIME_DIR" "$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
      - name: Verify OS autostart registration from verified release bytes
        if: inputs.validation_profile == 'full' && !inputs.musl_source_recovery
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN RSRS_RUNTIME_BIN
          : "${RSRS_PUBLISHED_RUNTIME_ARCHIVE:?Verified published Runtime archive required}"
          : "${RSRS_PUBLISHED_RUNTIME_VERSION:?Verified published Runtime version required}"
          exe="target/ci/${{ matrix.target }}/release/rsrs"
          py="$RUNNER_TEMP/upgrade-python/bin/python"
          if [ "$RUNNER_OS" = Windows ]; then
            exe="$exe.exe"
            py="$RUNNER_TEMP/upgrade-python/Scripts/python.exe"
          fi
          "$py" scripts/test-runtime-autostart.py --binary "$exe" --register \
            --runtime-archive "$RSRS_PUBLISHED_RUNTIME_ARCHIVE" --runtime-version "$RSRS_PUBLISHED_RUNTIME_VERSION"
      - uses: actions/upload-artifact@v4
        if: inputs.artifact_source != 'published-assets' && inputs.validation_profile == 'full'
        with:
          name: candidate-assets-${{ matrix.target }}${{ inputs.recovery_suffix }}
          path: target/ci/${{ matrix.target }}/release/candidate-assets-receipt.json
          if-no-files-found: error
          retention-days: 1
      - name: Key the four fixed public model inputs
        id: model-key
        shell: bash
        run: |
          set -euo pipefail
          key="$(python scripts/native-model-cache.py key)"
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: model-cache
        with:
          path: .native-model-cache
          key: ${{ steps.model-key.outputs.key }}
          enableCrossOsArchive: true
      - name: Require an exact cache and verify every public model byte before restoring
        if: steps.model-cache.outputs.cache-matched-key != ''
        shell: bash
        env:
          EXPECTED_KEY: ${{ steps.model-key.outputs.key }}
          MATCHED_KEY: ${{ steps.model-cache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          test "$MATCHED_KEY" = "$EXPECTED_KEY"
          python scripts/native-model-cache.py restore --model-dir "$RUNNER_TEMP/release-probe/models/bge-m3" --legacy-dir native-legacy-model
      - name: Install and probe BGE CPU inference
        id: bge-probe
        shell: bash
        env:
          RSRS_ENGINE: cpu
          RSRS_DATA_DIR: ${{ runner.temp }}/release-probe
          RSRS_M3_DIR: ${{ runner.temp }}/release-probe/models/bge-m3
          RSRS_NO_AUTOSYNC: '1'
          RSRS_UPDATE_CHECK: '0'
          RSRS_RUNTIME_TRIPLE: ${{ matrix.target }}
          NATIVE_RUNTIME_BIN: ${{ inputs.artifact_source == 'published-assets' && env.RSRS_RUNTIME_BIN || steps.pinned-runtime.outputs.path }}
          NATIVE_RUNTIME_SHA256: ${{ inputs.artifact_source == 'published-assets' && env.RSRS_PUBLISHED_RUNTIME_SHA256 || steps.pinned-runtime.outputs.sha256 }}
          NATIVE_RUNTIME_VERSION: ${{ inputs.artifact_source == 'published-assets' && env.RSRS_PUBLISHED_RUNTIME_VERSION || steps.pinned-runtime.outputs.version }}
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN
          test -n "$NATIVE_RUNTIME_BIN" && test -n "$NATIVE_RUNTIME_SHA256" && test -n "$NATIVE_RUNTIME_VERSION"
          export RSRS_RUNTIME_BIN="$NATIVE_RUNTIME_BIN"
          exe=target/ci/${{ matrix.target }}/release/rsrs
          if [ "$RUNNER_OS" = Windows ]; then exe="$exe.exe"; fi
          RSRS_RUNTIME_BIN="$(python scripts/native_fixture_process.py --install-published "$exe")"
          export RSRS_RUNTIME_BIN
          "$exe" --version
          bash scripts/verify-linux-arm64-elf.sh '${{ matrix.target }}' "$exe"
          "$exe" --direct model install-m3 --json > "$RUNNER_TEMP/native-model-inference.json"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const result = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/native-model-inference.json`, 'utf8'));
          assert.equal(result.status, 'ok');
          const proof = result.details.backend_load.evidence;
          assert.equal(proof.ready, true);
          assert.equal(proof.inference_completed, true);
          assert.equal(proof.fresh_session, true);
          assert.equal(proof.dimensions, 1024);
          assert.equal(proof.selected, 'CPU');
          NODE
          bash scripts/probe-native-arm64-alpine.sh '${{ matrix.target }}' "$exe" "$RSRS_M3_DIR" "$RUNNER_TEMP/arm-alpine-probe" "$RSRS_RUNTIME_BIN" "$NATIVE_RUNTIME_SHA256" "$NATIVE_RUNTIME_VERSION"
          "$exe" --runtime-internal --stop --json
      - name: Check out the trusted Client2 seal verifier
        if: inputs.validation_profile == 'full' && matrix.target == 'x86_64-pc-windows-msvc' && fromJSON(inputs.candidate_assets || '{}').client2.sealed
        uses: actions/checkout@v5
        with:
          repository: risense-ai/respire-client2
          ref: 343a7dca5c488f6c3186363fdb81dbfd76dc1e41
          path: .client2-seal-verifier
          persist-credentials: false
      - name: Verify selected Client2 installation and the existing GUI subset
        if: inputs.validation_profile == 'full' && matrix.target == 'x86_64-pc-windows-msvc'
        timeout-minutes: 35
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CLIENT2_RELEASE: ${{ inputs.client2_release }}
          CLIENT2_COMMIT: ${{ inputs.client2_commit }}
          CLIENT2_CANDIDATE_RUN_ID: ${{ inputs.client2_candidate_run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          # CLI precedes Client2 publication; candidate evidence cannot claim a public product upgrade.
          $client2 = if ($env:CLIENT2_RELEASE) {
            @{Client2Release=$env:CLIENT2_RELEASE; Client2Commit=$env:CLIENT2_COMMIT}
          } else {
            if (-not $env:CLIENT2_CANDIDATE_RUN_ID) { throw 'Select an authenticated Client2 candidate or an explicit new public release' }
            @{Client2CandidateRunId=$env:CLIENT2_CANDIDATE_RUN_ID; Client2Commit=$env:CLIENT2_COMMIT}
          }
          ./scripts/probe-client2-gui.ps1 `
            @client2 `
            -Cli "$PWD/target/ci/x86_64-pc-windows-msvc/release/rsrs.exe" `
            -RuntimeArchive $env:RSRS_PUBLISHED_RUNTIME_ARCHIVE `
            -RuntimeVersion $env:RSRS_PUBLISHED_RUNTIME_VERSION `
            -OutputDirectory "$env:RUNNER_TEMP/published-client2-gui" `
            -OfflineAcceptance -OfflineModelDirectory "$env:RUNNER_TEMP/release-probe/models/bge-m3"
      - uses: actions/upload-artifact@v4
        if: always() && inputs.validation_profile == 'full' && matrix.target == 'x86_64-pc-windows-msvc'
        with:
          retention-days: 1
          name: client2-published-online-${{ matrix.target }}${{ inputs.recovery_suffix }}
          path: |
            ${{ runner.temp }}/published-client2-gui/report.json
            ${{ runner.temp }}/published-client2-gui/native-gui.json
            ${{ runner.temp }}/published-client2-gui/workspace.png
            ${{ runner.temp }}/published-client2-gui/online-*
          if-no-files-found: error
      - uses: actions/cache/restore@v4
        id: wheel-cache
        if: runner.os == 'Windows'
        with:
          path: .native-psutil-wheels
          key: ${{ steps.wheel-key.outputs.key }}
          enableCrossOsArchive: false
      - name: Verify or build the exact Windows wheel and install it offline
        if: runner.os == 'Windows'
        shell: bash
        env:
          EXPECTED_KEY: ${{ steps.wheel-key.outputs.key }}
          MATCHED_KEY: ${{ steps.wheel-cache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          py="$RUNNER_TEMP/upgrade-python/Scripts/python.exe"
          if [ -n "$MATCHED_KEY" ]; then
            test "$MATCHED_KEY" = "$EXPECTED_KEY"
          else
            "$py" scripts/native-psutil-wheel-cache.py build --directory .native-psutil-wheels
          fi
          "$py" scripts/native-psutil-wheel-cache.py validate --directory .native-psutil-wheels
          "$py" scripts/native-psutil-wheel-cache.py install --directory .native-psutil-wheels
      - name: Verify selected formal release and database DEV upgrades
        shell: bash
        env:
          UPGRADE_PROFILE: ${{ inputs.validation_profile }}
          MUSL_SOURCE_RECOVERY: ${{ inputs.musl_source_recovery }}
          GH_TOKEN: ${{ github.token }}
          CLI_SHA: ${{ inputs.ref }}
          CLI_VERSION: ${{ inputs.version }}
          RSRS_DEV_SERVER_ADDR: ${{ vars.RESPIRE_DEV_SERVER_ADDR }}
          RSRS_DEV_SERVER_SHA: ${{ vars.RESPIRE_DEV_SERVER_SHA }}
          MODEL_CACHE_HIT: ${{ steps.model-cache.outputs.cache-hit }}
          RSRS_RUNTIME_TRIPLE: ${{ matrix.target }}
          NATIVE_RUNTIME_BIN: ${{ inputs.artifact_source == 'published-assets' && env.RSRS_RUNTIME_BIN || steps.pinned-runtime.outputs.path }}
          NATIVE_RUNTIME_SHA256: ${{ inputs.artifact_source == 'published-assets' && env.RSRS_PUBLISHED_RUNTIME_SHA256 || steps.pinned-runtime.outputs.sha256 }}
          NATIVE_RUNTIME_VERSION: ${{ inputs.artifact_source == 'published-assets' && env.RSRS_PUBLISHED_RUNTIME_VERSION || steps.pinned-runtime.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$NATIVE_RUNTIME_BIN" && test -n "$NATIVE_RUNTIME_SHA256" && test -n "$NATIVE_RUNTIME_VERSION"
          py="$RUNNER_TEMP/upgrade-python/bin/python"
          exe="target/ci/${{ matrix.target }}/release/rsrs"
          if [ "$RUNNER_OS" = Windows ]; then
            py="$RUNNER_TEMP/upgrade-python/Scripts/python.exe"
            exe="$exe.exe"
          fi
          if [ "$RUNNER_OS" != Windows ]; then
            "$py" -m pip install --only-binary=:all: psutil==7.1.0
          fi
          # Historical sources use FP16; newer stable sources also need the prepared CPU container.
          mkdir -p native-legacy-model/onnx
          cp "$RUNNER_TEMP/release-probe/models/bge-m3/tokenizer.json" native-legacy-model/tokenizer.json
          cp "$RUNNER_TEMP/release-probe/models/bge-m3/onnx/model_quantized.onnx" native-legacy-model/onnx/model_quantized.onnx
          cp "$RUNNER_TEMP/release-probe/models/bge-m3/onnx/model_quantized.cpu-v1.ort" native-legacy-model/onnx/model_quantized.cpu-v1.ort
          if [ "$MODEL_CACHE_HIT" != true ]; then
            curl --fail --location --retry 1 --connect-timeout 20 --max-time 1200 \
              'https://huggingface.co/Xenova/bge-m3/resolve/4de13258303883538bd53b696b452bf8099f0858/onnx/model_fp16.onnx' \
              --output native-legacy-model/onnx/model_fp16.onnx
          fi
          "$py" scripts/native-model-cache.py verify --model-dir "$RUNNER_TEMP/release-probe/models/bge-m3" --legacy-dir native-legacy-model
          upgrade_args=(--binary "$exe")
          if [ "$MUSL_SOURCE_RECOVERY" = true ]; then upgrade_args+=(--source v1.0.8); fi
          if [ "${{ matrix.target }}" = x86_64-pc-windows-msvc ] && [ "$UPGRADE_PROFILE" = full ]; then
            upgrade_args+=(--client2-gui-report "$RUNNER_TEMP/published-client2-gui/report.json")
          fi
          "$py" scripts/test-published-upgrades.py "${upgrade_args[@]}" --target '${{ matrix.target }}' \
            --runtime-binary "$NATIVE_RUNTIME_BIN" --runtime-sha256 "$NATIVE_RUNTIME_SHA256" --runtime-version "$NATIVE_RUNTIME_VERSION" \
            --model-dir "$RUNNER_TEMP/release-probe/models/bge-m3" \
            --legacy-model-dir native-legacy-model \
            --output-dir "$RUNNER_TEMP/published-upgrades" --profile "$UPGRADE_PROFILE"
      - name: Verify resident foreground and background inference under concurrent CLI load
        if: ${{ !cancelled() && inputs.validation_profile == 'full' && ((!inputs.musl_source_recovery && success()) || (inputs.musl_source_recovery && steps.bge-probe.outcome == 'success')) }}
        shell: bash
        env:
          RSRS_RUNTIME_TRIPLE: ${{ matrix.target }}
          NATIVE_RUNTIME_BIN: ${{ inputs.artifact_source == 'published-assets' && env.RSRS_RUNTIME_BIN || steps.pinned-runtime.outputs.path }}
          NATIVE_RUNTIME_SHA256: ${{ inputs.artifact_source == 'published-assets' && env.RSRS_PUBLISHED_RUNTIME_SHA256 || steps.pinned-runtime.outputs.sha256 }}
          NATIVE_RUNTIME_VERSION: ${{ inputs.artifact_source == 'published-assets' && env.RSRS_PUBLISHED_RUNTIME_VERSION || steps.pinned-runtime.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$NATIVE_RUNTIME_BIN" && test -n "$NATIVE_RUNTIME_SHA256" && test -n "$NATIVE_RUNTIME_VERSION"
          py="$RUNNER_TEMP/upgrade-python/bin/python"
          exe="target/ci/${{ matrix.target }}/release/rsrs"
          if [ "$RUNNER_OS" = Windows ]; then
            py="$RUNNER_TEMP/upgrade-python/Scripts/python.exe"
            exe="$exe.exe"
          fi
          "$py" scripts/test-native-fixture-process.py --output-dir "$RUNNER_TEMP/native-fixture-bounds"
          RSRS_INTRA_THREADS=2 "$py" scripts/test-real-m3-account-switch.py --binary "$exe" \
            --runtime-binary "$NATIVE_RUNTIME_BIN" --runtime-sha256 "$NATIVE_RUNTIME_SHA256" --runtime-version "$NATIVE_RUNTIME_VERSION" \
            --model-dir "$RUNNER_TEMP/release-probe/models/bge-m3" \
            --output-dir "$RUNNER_TEMP/resident-concurrency" --expect-supervised-worker --resident-stress --expect-background-threads 2
      - uses: actions/upload-artifact@v4
        if: always() && inputs.validation_profile == 'full'
        with:
          retention-days: 1
          name: resident-concurrency-${{ matrix.target }}${{ inputs.recovery_suffix }}
          path: |
            ${{ runner.temp }}/musl-fixture-identity.json
            ${{ runner.temp }}/resident-concurrency/real-account-return-verification.json
            ${{ runner.temp }}/resident-concurrency/resident-stress-metrics.json
            ${{ runner.temp }}/resident-concurrency/fixture-dependencies.json
            ${{ runner.temp }}/resident-concurrency/**/boundary-inspector/inspector.log
            ${{ runner.temp }}/resident-concurrency/**/boundary-inspector/inspection-failure.json
            ${{ runner.temp }}/native-fixture-bounds/fixture-process-verification.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: 1
          name: published-upgrades-${{ matrix.target }}${{ inputs.recovery_suffix }}
          path: |
            ${{ runner.temp }}/published-upgrades/published-upgrades.json
            ${{ runner.temp }}/published-upgrades/**/results/real-account-return-verification.json
            ${{ runner.temp }}/published-upgrades/**/results/**/boundary-inspector/inspector.log
            ${{ runner.temp }}/published-upgrades/**/results/**/boundary-inspector/inspection-failure.json
          if-no-files-found: error
      - name: Verify GNU login interruption recovery with this release binary
        if: inputs.validation_profile == 'full' && matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        env:
          NATIVE_RUNTIME_BIN: ${{ inputs.artifact_source == 'published-assets' && env.RSRS_RUNTIME_BIN || steps.pinned-runtime.outputs.path }}
          NATIVE_RUNTIME_SHA256: ${{ inputs.artifact_source == 'published-assets' && env.RSRS_PUBLISHED_RUNTIME_SHA256 || steps.pinned-runtime.outputs.sha256 }}
          NATIVE_RUNTIME_VERSION: ${{ inputs.artifact_source == 'published-assets' && env.RSRS_PUBLISHED_RUNTIME_VERSION || steps.pinned-runtime.outputs.version }}
          RSRS_RUNTIME_TRIPLE: ${{ matrix.target }}
        run: |
          set -euo pipefail
          binary="$(realpath target/ci/${{ matrix.target }}/release/rsrs)"
          checksum="$(sha256sum "$binary" | cut -d ' ' -f 1)"
          dbus-run-session -- env RSRS_SS_FIXTURE_BUS=private "$RUNNER_TEMP/upgrade-python/bin/python" scripts/dev-login-interruption-smoke.py --native-credentials --binary "$binary" --binary-sha256 "$checksum" --version '${{ inputs.version }}' --source-sha '${{ inputs.artifact_source == 'published-assets' && fromJSON(inputs.published_assets).cli.source_sha || inputs.ref }}' --root "$RUNNER_TEMP/gnu-login-interruption" --model-dir "$RUNNER_TEMP/release-probe/models/bge-m3"
      - uses: actions/upload-artifact@v4
        if: always() && inputs.validation_profile == 'full' && matrix.target == 'x86_64-unknown-linux-gnu'
        with:
          retention-days: 1
          name: gnu-login-interruption${{ inputs.recovery_suffix }}
          path: ${{ runner.temp }}/gnu-login-interruption/interruption-coverage.json
          if-no-files-found: error
      - name: Allow public input cache saves only for trusted sources
        id: cache-write
        shell: bash
        env:
          TRUSTED_SOURCE: ${{ inputs.artifact_source != 'published-assets' && github.repository == 'risense-ai/respire-cli' && github.ref == 'refs/heads/main' && inputs.ref == github.sha && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        run: |
          set -euo pipefail
          # Cache actions enforce cache-mode; shell steps may not receive ACTIONS_CACHE_MODE.
          if [ "$TRUSTED_SOURCE" = true ]; then
            echo 'may_save=true' >> "$GITHUB_OUTPUT"
          else
            echo 'may_save=false' >> "$GITHUB_OUTPUT"
            echo 'Public input cache saves are disabled for this untrusted source'
          fi
      - name: Stage only verified public model inputs for the next run
        id: model-cache-stage
        continue-on-error: true
        if: ${{ inputs.artifact_source != 'published-assets' && steps.cache-write.outputs.may_save == 'true' && github.repository == 'risense-ai/respire-cli' && github.ref == 'refs/heads/main' && inputs.ref == github.sha && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.model-cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: python scripts/native-model-cache.py stage --model-dir "$RUNNER_TEMP/release-probe/models/bge-m3" --legacy-dir native-legacy-model
      - uses: actions/cache/save@v4
        continue-on-error: true
        if: ${{ inputs.artifact_source != 'published-assets' && steps.cache-write.outputs.may_save == 'true' && github.repository == 'risense-ai/respire-cli' && github.ref == 'refs/heads/main' && inputs.ref == github.sha && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.model-cache-stage.outcome == 'success' }}
        with:
          path: .native-model-cache
          key: ${{ steps.model-key.outputs.key }}
          enableCrossOsArchive: true
      - uses: actions/cache/save@v4
        continue-on-error: true
        if: ${{ inputs.artifact_source != 'published-assets' && steps.cache-write.outputs.may_save == 'true' && runner.os == 'Windows' && github.repository == 'risense-ai/respire-cli' && github.ref == 'refs/heads/main' && inputs.ref == github.sha && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.wheel-cache.outputs.cache-hit != 'true' }}
        with:
          path: .native-psutil-wheels
          key: ${{ steps.wheel-key.outputs.key }}
          enableCrossOsArchive: false
