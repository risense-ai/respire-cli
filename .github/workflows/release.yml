name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: CLI branch, commit or stable vX.Y.Z tag
        default: main
        required: true
        type: string
      publish:
        description: Publish after all binary, package and development-server checks
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: cli-release-publication
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      channel: ${{ steps.plan.outputs.channel }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
          fetch-depth: 0
      - id: plan
        env:
          RELEASE_REF: ${{ inputs.ref || github.ref }}
          RELEASE_PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node - <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const cargo=fs.readFileSync('cli/Cargo.toml','utf8').match(/^version\s*=\s*"([^"]+)"/m)?.[1];
          const manifest=require('./npm/artifact-manifest.json');
          if(!cargo||manifest.cliVersion!==cargo) throw new Error('CLI Cargo/npm versions differ');
          const ref=process.env.RELEASE_REF.replace(/^refs\/tags\//,'');
          const tagEvent=process.env.RELEASE_REF.startsWith('refs/tags/')||/^v\d+\./.test(ref);
          let channel,version;
          if(tagEvent){
            if(!/^v\d+\.\d+\.\d+$/.test(ref)) throw new Error('Stable publication accepts only vX.Y.Z tags, never dev tags');
            version=ref.slice(1);channel='latest';
            if(cargo!==version) throw new Error(`Stable tag ${ref} must equal CLI Cargo/npm version ${cargo}`);
            cp.execFileSync('git',['merge-base','--is-ancestor','HEAD','origin/main']);
          }else{
            channel='dev';
            version=cp.execFileSync('node',['npm/scripts/next-dev-version.mjs'],{encoding:'utf8'}).trim();
          }
          const sha=cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`sha=${sha}\nversion=${version}\ntag=v${version}\nchannel=${channel}\npublish=${process.env.RELEASE_PUBLISH}\n`);
          NODE

  validate:
    needs: plan
    uses: ./.github/workflows/release-validation.yml
    with:
      ref: ${{ needs.plan.outputs.sha }}
      version: ${{ needs.plan.outputs.version }}

  cloud-sweep:
    needs: [plan, validate]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require the approved development server
        env:
          RESPIRE_DEV_SERVER_ADDR: ${{ vars.RESPIRE_DEV_SERVER_ADDR }}
        run: |
          node -e 'const value=process.env.RESPIRE_DEV_SERVER_ADDR; if(!value) throw new Error("Configure RESPIRE_DEV_SERVER_ADDR before testing"); const u=new URL(value); if(u.origin!=="https://dev.rsrs.rs"||u.pathname!=="/"||u.search||u.hash||u.username||u.password) throw new Error("Release smoke requires https://dev.rsrs.rs")'
      - name: Prepare ephemeral build version
        run: node npm/scripts/set-build-version.mjs ${{ needs.plan.outputs.version }}
      - uses: actions/download-artifact@v4
        with:
          name: cli-release-${{ matrix.target }}
          path: validated-cli
      - name: Verify and extract this platform's artifacts
        id: verified_artifact
        env:
          CLI_TARGET: ${{ matrix.target }}
          CLI_SHA: ${{ needs.plan.outputs.sha }}
          CLI_VERSION: ${{ needs.plan.outputs.version }}
        run: node npm/scripts/extract-artifact.mjs validated-cli cli
      - name: Install PowerShell
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if command -v pwsh >/dev/null 2>&1; then exit 0; fi
          if [ "$RUNNER_OS" = macOS ]; then brew install powershell; else
            . /etc/os-release
            curl -fsSL "https://packages.microsoft.com/config/ubuntu/${VERSION_ID}/packages-microsoft-prod.deb" -o /tmp/packages-microsoft-prod.deb
            sudo dpkg -i /tmp/packages-microsoft-prod.deb
            sudo apt-get update
            sudo apt-get install -y powershell
          fi
      - name: Sweep the approved development server
        shell: pwsh
        env:
          RESPIRE_DEV_SERVER_ADDR: ${{ vars.RESPIRE_DEV_SERVER_ADDR }}
          CLI_SHA: ${{ needs.plan.outputs.sha }}
          ONEMEMORY_ENGINE: cpu
          ONEMEMORY_MODEL_DIR: ${{ runner.temp }}/sweep-model/bge-base-zh-v1.5
          ONEMEMORY_M3_DIR: ${{ runner.temp }}/sweep-model/bge-m3
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path (Resolve-Path cli) $(if ($IsWindows) { 'rsrs.exe' } else { 'rsrs' })
          ./scripts/dev-release-sweep.ps1 -Exe $exe -ExpectVersion '${{ needs.plan.outputs.version }}' -Root (Join-Path $env:RUNNER_TEMP 'release-sweep') -DeferSupplemental
      - name: Upload base smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: base-release-sweep-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/release-sweep/report.md
            ${{ runner.temp }}/release-sweep/coverage.json
          if-no-files-found: warn
      - uses: actions/setup-python@v5
        id: supplement_python
        if: ${{ !cancelled() && steps.verified_artifact.outcome == 'success' }}
        with:
          python-version: '3.12'
      - name: Verify all supplementary CLI contracts
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.supplement_python.outcome == 'success' }}
        shell: bash
        env:
          RESPIRE_DEV_SERVER_ADDR: ${{ vars.RESPIRE_DEV_SERVER_ADDR }}
          RESPIRE_DEV_SERVER_SHA: ${{ vars.RESPIRE_DEV_SERVER_SHA }}
          CLI_VERSION: ${{ needs.plan.outputs.version }}
          CLI_SHA: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          python3 -m pip install --only-binary=:all: cryptography==46.0.3
          binary="$(realpath cli/rsrs)"
          checksum="$(sha256sum "$binary" | cut -d ' ' -f 1)"
          python3 scripts/dev-smoke-supplements.py --binary "$binary" --binary-sha256 "$checksum" --version "$CLI_VERSION" --source-sha "$CLI_SHA" --root "$RUNNER_TEMP/release-supplements" --cli-report "$RUNNER_TEMP/release-sweep/coverage.json"
      - name: Verify native Windows and macOS account migration
        if: ${{ !cancelled() && runner.os != 'Linux' && steps.supplement_python.outcome == 'success' }}
        shell: pwsh
        env:
          RESPIRE_DEV_SERVER_ADDR: ${{ vars.RESPIRE_DEV_SERVER_ADDR }}
          RESPIRE_DEV_SERVER_SHA: ${{ vars.RESPIRE_DEV_SERVER_SHA }}
          CLI_VERSION: ${{ needs.plan.outputs.version }}
          CLI_SHA: ${{ needs.plan.outputs.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($IsMacOS) {
            python -m pip install --only-binary=:all: cryptography==46.0.3
            if ($LASTEXITCODE -ne 0) { throw 'macOS migration fixture dependencies failed' }
          }
          $binary = (Resolve-Path (Join-Path cli $(if ($IsWindows) { 'rsrs.exe' } else { 'rsrs' }))).Path
          $checksum = (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant()
          $root = Join-Path $env:RUNNER_TEMP 'native-profile-migration'
          python scripts/dev-profile-migration-smoke.py --binary $binary --binary-sha256 $checksum --version $env:CLI_VERSION --source-sha $env:CLI_SHA --root $root
          $suiteExit = $LASTEXITCODE
          python scripts/dev-smoke-gate.py --migration-only --cli-report (Join-Path $env:RUNNER_TEMP 'release-sweep/coverage.json') --profile-migration (Join-Path $root 'migration-coverage.json') --report (Join-Path $root 'migration-platform-gate.json') --source-sha $env:CLI_SHA --version $env:CLI_VERSION --binary-sha256 $checksum
          if ($suiteExit -ne 0 -or $LASTEXITCODE -ne 0) { throw 'Native credential migration or its release gate failed' }
      - uses: actions/upload-artifact@v4
        if: ${{ always() && runner.os != 'Linux' }}
        with:
          name: native-profile-migration-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/native-profile-migration/migration-coverage.json
            ${{ runner.temp }}/native-profile-migration/migration-platform-gate.json
          if-no-files-found: error
      - name: Verify legacy Secret Service account migration
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.supplement_python.outcome == 'success' }}
        shell: bash
        env:
          RESPIRE_DEV_SERVER_ADDR: ${{ vars.RESPIRE_DEV_SERVER_ADDR }}
          RESPIRE_DEV_SERVER_SHA: ${{ vars.RESPIRE_DEV_SERVER_SHA }}
          CLI_VERSION: ${{ needs.plan.outputs.version }}
          CLI_SHA: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dbus-x11 gnome-keyring
          python3 -m pip install --only-binary=:all: SecretStorage==3.3.3 jeepney==0.9.0 cryptography==46.0.3
          binary="$(realpath cli/rsrs)"
          checksum="$(sha256sum "$binary" | cut -d ' ' -f 1)"
          root="$RUNNER_TEMP/secret-service-profile-migration"
          suite_exit=0
          dbus-run-session -- env RESPIRE_SS_FIXTURE_BUS=private python3 scripts/dev-secret-service-migration-smoke.py --binary "$binary" --binary-sha256 "$checksum" --version "$CLI_VERSION" --source-sha "$CLI_SHA" --root "$root" || suite_exit=$?
          gate_exit=0
          python3 scripts/dev-secret-service-migration-gate.py --migration-report "$root/migration-coverage.json" --report "$root/migration-platform-gate.json" --source-sha "$CLI_SHA" --version "$CLI_VERSION" --binary-sha256 "$checksum" || gate_exit=$?
          test "$suite_exit" -eq 0 && test "$gate_exit" -eq 0
      - uses: actions/upload-artifact@v4
        if: ${{ always() && runner.os == 'Linux' }}
        with:
          name: secret-service-profile-migration-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/secret-service-profile-migration/migration-coverage.json
            ${{ runner.temp }}/secret-service-profile-migration/migration-platform-gate.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-sweep-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/release-sweep/report.md
            ${{ runner.temp }}/release-sweep/coverage.json
            ${{ runner.temp }}/release-supplements/suite-results.json
            ${{ runner.temp }}/release-supplements/combined-coverage.json
            ${{ runner.temp }}/release-supplements/outbox/outbox-coverage.json
            ${{ runner.temp }}/release-supplements/ai-inject/ai-inject-coverage.json
            ${{ runner.temp }}/release-supplements/runtime-coverage.json
            ${{ runner.temp }}/release-supplements/legacy-vault/legacy-vault-coverage.json
            ${{ runner.temp }}/release-supplements/profile-migration/migration-coverage.json
          if-no-files-found: error

  api-smoke:
    needs: [plan, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check all development API contracts
        env:
          RESPIRE_DEV_MAIL_ADDRESS: ${{ vars.RESPIRE_DEV_MAIL_ADDRESS }}
          RESPIRE_DEV_IMAP_HOST: ${{ vars.RESPIRE_DEV_IMAP_HOST }}
          RESPIRE_DEV_IMAP_USERNAME: ${{ secrets.RESPIRE_DEV_IMAP_USERNAME }}
          RESPIRE_DEV_IMAP_PASSWORD: ${{ secrets.RESPIRE_DEV_IMAP_PASSWORD }}
          RESPIRE_DEV_SERVER_ADDR: ${{ vars.RESPIRE_DEV_SERVER_ADDR }}
          RESPIRE_DEV_API_ADMIN_APPROVED: ${{ vars.RESPIRE_DEV_API_ADMIN_APPROVED }}
          RESPIRE_DEV_ADMIN_TOKEN: ${{ secrets.RESPIRE_DEV_ADMIN_TOKEN }}
          RESPIRE_DEV_SERVER_SHA: ${{ vars.RESPIRE_DEV_SERVER_SHA }}
        run: python3 scripts/dev-api-smoke.py --report "$RUNNER_TEMP/dev-api-coverage.json" --scope all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dev-api-coverage
          path: ${{ runner.temp }}/dev-api-coverage.json
          if-no-files-found: error

  web-smoke:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require pinned frontend revisions
        env:
          CONSOLE_SHA: ${{ vars.RESPIRE_DEV_CONSOLE_SHA }}
          SITE_SHA: ${{ vars.RESPIRE_DEV_SITE_SHA }}
        run: |
          node -e 'for (const value of [process.env.CONSOLE_SHA,process.env.SITE_SHA]) if (!/^[0-9a-f]{40}$/.test(value || "")) throw new Error("Configure exact tested development frontend revisions")'
      - uses: actions/checkout@v5
        with:
          repository: risense-ai/respire-server
          ref: ${{ vars.RESPIRE_DEV_CONSOLE_SHA }}
          persist-credentials: false
      - name: Require successful frontend source CI
        env:
          GH_TOKEN: ${{ github.token }}
          CONSOLE_SHA: ${{ vars.RESPIRE_DEV_CONSOLE_SHA }}
          SITE_SHA: ${{ vars.RESPIRE_DEV_SITE_SHA }}
        run: |
          set -euo pipefail
          gh run list --repo risense-ai/respire-server --workflow ci.yml --commit "$CONSOLE_SHA" --branch main --event push --limit 20 --json status,conclusion | jq -e 'any(.[]; .status == "completed" and .conclusion == "success")' > /dev/null
          gh run list --repo risense-ai/respire-site --workflow ci.yml --commit "$SITE_SHA" --branch main --event push --limit 20 --json status,conclusion | jq -e 'any(.[]; .status == "completed" and .conclusion == "success")' > /dev/null
      - name: Prepare isolated browser test dependencies
        working-directory: admin-ui
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Verify real development website and account consoles
        working-directory: admin-ui
        env:
          RESPIRE_DEV_SERVER_ADDR: ${{ vars.RESPIRE_DEV_SERVER_ADDR }}
          RESPIRE_DEV_API_ADMIN_APPROVED: ${{ vars.RESPIRE_DEV_API_ADMIN_APPROVED }}
          RESPIRE_DEV_ADMIN_TOKEN: ${{ secrets.RESPIRE_DEV_ADMIN_TOKEN }}
          RESPIRE_DEV_SERVER_SHA: ${{ vars.RESPIRE_DEV_SERVER_SHA }}
          RESPIRE_DEV_CONSOLE_SHA: ${{ vars.RESPIRE_DEV_CONSOLE_SHA }}
          RESPIRE_DEV_SITE_SHA: ${{ vars.RESPIRE_DEV_SITE_SHA }}
          RESPIRE_WEB_SMOKE_OUTPUT: ${{ runner.temp }}/web-smoke
        run: npm run test:dev
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: development-web-smoke
          path: |
            ${{ runner.temp }}/web-smoke/*.json
            ${{ runner.temp }}/web-smoke/*.png
          if-no-files-found: error

  publish:
    needs: [plan, validate, cloud-sweep, api-smoke, web-smoke]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Require successful CLI CI for this exact source
        timeout-minutes: 21
        env:
          GH_TOKEN: ${{ github.token }}
          CLI_SHA: ${{ needs.plan.outputs.sha }}
        run: |
          node - <<'NODE'
          const cp=require('child_process');
          async function requireCi(){
            const sha=process.env.CLI_SHA,repo=process.env.GITHUB_REPOSITORY;
            if(!/^[a-f0-9]{40}$/.test(sha)) throw new Error('Invalid release source SHA');
            const deadline=Date.now()+20*60*1000;
            while(Date.now()<deadline){
              const result=JSON.parse(cp.execFileSync('gh',['api',`repos/${repo}/actions/workflows/ci.yml/runs?head_sha=${sha}&per_page=100`],{encoding:'utf8'}));
              const run=result.workflow_runs.filter(run=>run.head_sha===sha).sort((a,b)=>b.id-a.id)[0];
              if(run?.status==='completed'){
                if(run.conclusion!=='success') throw new Error(`Latest CLI CI ${run.id} for ${sha} concluded ${run.conclusion}; publication refused`);
                console.log(`Verified successful CLI CI ${run.id} for exact source ${sha}`);
                return;
              }
              console.log(`Waiting for latest CLI CI for ${sha}: ${run?`${run.id} ${run.status}`:'not yet available'}`);
              await new Promise(resolve=>setTimeout(resolve,15000));
            }
            throw new Error(`No successful latest CLI CI for ${sha} within 20 minutes; publication refused`);
          }
          requireCi().catch(error=>{console.error(error.message);process.exit(1)});
          NODE
      - run: npm install --global npm@11.5.1
      - name: Prepare ephemeral build version
        run: node npm/scripts/set-build-version.mjs ${{ needs.plan.outputs.version }}
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-release-*
          path: release-assets
          merge-multiple: true
      - name: Verify release artifacts and prepare all eight npm packages
        run: |
          node npm/scripts/verify-packages.mjs release-assets --assets-only
          node npm/scripts/assemble-artifacts.mjs release-assets target/ci
          node npm/scripts/pack.mjs --root target/ci
          node npm/scripts/verify-packages.mjs release-assets
      - name: Create a draft and upload every verified artifact
        env:
          GH_TOKEN: ${{ github.token }}
          CLI_TAG: ${{ needs.plan.outputs.tag }}
          CLI_SHA: ${{ needs.plan.outputs.sha }}
          CLI_CHANNEL: ${{ needs.plan.outputs.channel }}
        run: |
          set -euo pipefail
          if gh release view "$CLI_TAG" --json isDraft >/dev/null 2>&1; then
            test "$(gh release view "$CLI_TAG" --json isDraft --jq .isDraft)" = true || { echo 'Release is already public; use a new version'; exit 1; }
          elif [ "$CLI_CHANNEL" = dev ]; then
            gh release create "$CLI_TAG" --draft --prerelease --target "$CLI_SHA" --title "$CLI_TAG" --notes "Validated CLI source: $CLI_SHA"
          else
            gh release create "$CLI_TAG" --draft --target "$CLI_SHA" --title "$CLI_TAG" --notes "Validated CLI source: $CLI_SHA"
          fi
          gh release upload "$CLI_TAG" release-assets/* --clobber
          gh release view "$CLI_TAG" --json assets > "$RUNNER_TEMP/release-assets.json"
          node - <<'NODE'
          const fs=require('fs'),path=require('path');
          const expected=fs.readdirSync('release-assets').sort();
          const actual=JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP,'release-assets.json'),'utf8')).assets.map(asset=>asset.name).sort();
          if(expected.length!==21||JSON.stringify(actual)!==JSON.stringify(expected)) throw new Error('Draft release must contain exactly all 21 verified binary/runtime/metadata assets');
          NODE
      - name: Publish npm using Trusted Publishing
        env:
          CLI_CHANNEL: ${{ needs.plan.outputs.channel }}
        run: node npm/scripts/pack.mjs --root target/ci --publish --tag "$CLI_CHANNEL"
      - name: Make the complete release public
        env:
          GH_TOKEN: ${{ github.token }}
          CLI_TAG: ${{ needs.plan.outputs.tag }}
        run: gh release edit "$CLI_TAG" --draft=false
