name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: CLI branch, commit, vX.Y.Z or vX.Y.Z-dev.N tag
        default: main
        required: true
        type: string
      publish:
        description: Promote a completed full candidate without rebuilding or repacking
        default: false
        type: boolean
      full_regression_before_publish:
        description: Require full acceptance (publication always requires full preparation)
        default: false
        type: boolean
      validation_profile:
        description: critical for build checks only; full prepares an unpublished candidate
        default: full
        type: choice
        options: [critical, full]
      dev_version:
        description: Optional exact DEV version; only unpublished versions or empty DEV drafts can be used
        default: ''
        type: string
      prepared_run:
        description: Completed full candidate Release run to promote with identical bytes
        default: ''
        type: string
      artifact_source:
        description: Build a candidate or verify immutable published assets without publication
        default: build
        type: choice
        options: [build, published-assets]
      published_assets:
        description: Exact JSON inventory of approved CLI and Runtime release asset IDs and hashes
        default: ''
        type: string
      published_assets_sha256:
        description: SHA-256 of the exact published_assets input bytes
        default: ''
        type: string
      client2_release:
        description: Expected Client2 tag for the public release or sealed candidate
        default: ''
        type: string
      client2_commit:
        description: Exact source commit of the selected Client2 product
        default: ''
        type: string
      client2_sealed_run:
        description: Optional Client2 sealed Desktop candidate RUN_ID/ATTEMPT for unpublished full acceptance
        default: ''
        type: string
permissions:
  contents: read

env:
  ARTIFACT_SOURCE: ${{ inputs.artifact_source || 'build' }}
  PUBLISHED_ASSETS: ${{ inputs.published_assets }}
  PUBLISHED_ASSETS_SHA256: ${{ inputs.published_assets_sha256 }}
  REQUEST_PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
  VALIDATION_PROFILE: ${{ inputs.validation_profile || 'full' }}
  RELEASE_REF: ${{ inputs.ref || github.ref }}
  DEV_VERSION: ${{ inputs.dev_version }}
  PREPARED_RUN: ${{ inputs.prepared_run }}
  GH_TOKEN: ${{ github.token }}

jobs:
  artifact-inputs:
    outputs:
      sha: ${{ steps.validated.outputs.product_sha }}
      version: ${{ steps.validated.outputs.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ARTIFACT_SOURCE: ${{ inputs.artifact_source || 'build' }}
      PUBLISHED_ASSETS: ${{ inputs.published_assets }}
      PUBLISHED_ASSETS_SHA256: ${{ inputs.published_assets_sha256 }}
      REQUEST_PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
      VALIDATION_PROFILE: ${{ inputs.validation_profile || 'full' }}
      RELEASE_REF: ${{ inputs.ref || github.ref }}
      DEV_VERSION: ${{ inputs.dev_version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require full candidates before publication
        env:
          REQUIRE_FULL: ${{ inputs.full_regression_before_publish }}
          CLIENT2_RELEASE: ${{ inputs.client2_release }}
          CLIENT2_COMMIT: ${{ inputs.client2_commit }}
          CLIENT2_SEALED_RUN: ${{ inputs.client2_sealed_run }}
        run: |
          node - <<'NODE'
          const e=process.env;
          if(e.REQUEST_PUBLISH==='true'&&(e.ARTIFACT_SOURCE!=='build'||e.VALIDATION_PROFILE!=='full'||!e.PREPARED_RUN))throw Error('Publish requires full and a completed prepared_run; first run full with publish=false');
          if(e.PREPARED_RUN&&(e.REQUEST_PUBLISH!=='true'||!/^[1-9]\d*$/.test(e.PREPARED_RUN)||e.DEV_VERSION))throw Error('prepared_run requires publication and forbids version overrides');
          if(e.ARTIFACT_SOURCE==='build'&&(e.VALIDATION_PROFILE==='full'||e.REQUIRE_FULL==='true')&&(e.GITHUB_EVENT_NAME!=='workflow_dispatch'||e.GITHUB_REF!=='refs/heads/main'))throw Error('Full candidates require a trusted main dispatch');
          if(e.CLIENT2_SEALED_RUN&&(e.ARTIFACT_SOURCE!=='build'||e.VALIDATION_PROFILE!=='full'||e.REQUEST_PUBLISH==='true'||!/^[1-9]\d*\/[1-9]\d*$/.test(e.CLIENT2_SEALED_RUN)))throw Error('Sealed Client2 requires an unpublished full build and exact RUN_ID/ATTEMPT');
          if((e.CLIENT2_RELEASE||e.CLIENT2_COMMIT||e.CLIENT2_SEALED_RUN)&&(!/^v\d+\.\d+\.\d+(?:-[A-Za-z0-9.-]+)?$/.test(e.CLIENT2_RELEASE||'')||!/^[a-f0-9]{40}$/.test(e.CLIENT2_COMMIT||'')))throw Error('Client2 diagnostics require an explicit tag and source commit');
          NODE
      - name: Reject mixed publication and published-asset modes before planning
        id: validated
        run: node npm/scripts/extract-artifact.mjs --validate-published

  published-assets-verification:
    if: ${{ always() && needs.artifact-inputs.result == 'success' && inputs.artifact_source == 'published-assets' }}
    needs: artifact-inputs
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
          - os: ubuntu-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: aarch64-pc-windows-msvc
    env:
      ARTIFACT_SOURCE: ${{ inputs.artifact_source || 'build' }}
      PUBLISHED_ASSETS: ${{ inputs.published_assets }}
      PUBLISHED_ASSETS_SHA256: ${{ inputs.published_assets_sha256 }}
      REQUEST_PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
      VALIDATION_PROFILE: ${{ inputs.validation_profile || 'full' }}
      RELEASE_REF: ${{ inputs.ref || github.ref }}
      DEV_VERSION: ${{ inputs.dev_version }}
      CLI_TARGET: ${{ matrix.target }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download and verify only the approved public release bytes
        run: node npm/scripts/extract-artifact.mjs --verify-published "${{ runner.temp }}/published-assets-${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: 1
          name: published-assets-verification-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/published-assets-${{ matrix.target }}/published-assets-receipt.json
            ${{ runner.temp }}/published-assets-${{ matrix.target }}/cli/*
            ${{ runner.temp }}/published-assets-${{ matrix.target }}/runtime/*
          if-no-files-found: error

  published-full-complete:
    if: ${{ always() && inputs.artifact_source == 'published-assets' }}
    needs: [artifact-inputs, published-assets-verification, validate, native-regression, cloud-sweep, api-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require every existing full consumer to succeed
        env:
          FULL_NEEDS: ${{ toJSON(needs) }}
        run: node -e "const n=JSON.parse(process.env.FULL_NEEDS); if(Object.values(n).some(j=>j.result!=='success'))throw Error('Missing successful full consumer')"
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          path: full-reports
      - name: Join exact-attempt full reports and actual process image digests
        env:
          CLIENT2_RELEASE: ${{ inputs.client2_release }}
          CLIENT2_COMMIT: ${{ inputs.client2_commit }}
        run: node npm/scripts/extract-artifact.mjs --complete-published full-reports
      - uses: actions/upload-artifact@v4
        with:
          name: published-full-result
          path: full-reports/published-full-result.json
          if-no-files-found: error
          retention-days: 1

  plan:
    needs: artifact-inputs
    if: ${{ needs.artifact-inputs.result == 'success' && (inputs.artifact_source || 'build') == 'build' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    concurrency:
      group: cli-release-publication
      queue: max
      cancel-in-progress: false
    outputs:
      validation_profile: ${{ steps.validation.outputs.profile }}
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      channel: ${{ steps.plan.outputs.channel }}
      publish: ${{ steps.plan.outputs.publish }}
      candidate: ${{ steps.candidate.outputs.candidate }}
      prepared_attempt: ${{ steps.prepared.outputs.prepared_attempt }}
      prepared_artifact_id: ${{ steps.prepared.outputs.prepared_artifact_id }}
      prepared_artifact_digest: ${{ steps.prepared.outputs.prepared_artifact_digest }}
      prepared_receipt_sha256: ${{ steps.prepared.outputs.prepared_receipt_sha256 }}
      prepared_binary_artifact_ids: ${{ steps.prepared.outputs.prepared_binary_artifact_ids }}
      prepared_pack_artifact_ids: ${{ steps.prepared.outputs.prepared_pack_artifact_ids }}
      prepared_binary_run: ${{ steps.prepared.outputs.prepared_binary_run }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
          fetch-depth: 0
      - name: Select the mandatory synchronous validation profile
        id: validation
        env:
          REQUESTED_PROFILE: ${{ inputs.validation_profile || 'full' }}
          REQUIRE_FULL: ${{ inputs.full_regression_before_publish }}
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const requested=process.env.REQUESTED_PROFILE;
          if(!['critical','full'].includes(requested))throw Error('Unknown release validation profile');
          const profile=process.env.REQUIRE_FULL==='true'?'full':requested;
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'profile='+profile+'\n');
          console.log('Synchronous validation profile: '+profile);
          NODE
      - name: Select the exact completed full preparation
        if: inputs.prepared_run != ''
        id: prepared
        run: |
          # Use the current trusted reader while HEAD and product files remain the selected source.
          git archive "$GITHUB_SHA" npm/scripts/{release-recovery3930,release-recovery-sources,release-preparation,candidate-artifact,extract-artifact,publication-acceptance,release-publication,verified-receipt}.mjs | tar -x
          export CLI_SHA="$(git rev-parse HEAD)"
          node npm/scripts/release-preparation.mjs inspect
      - uses: actions/upload-artifact@v4
        if: inputs.prepared_run != ''
        with:
          name: prepared-consumer-${{ github.run_id }}-${{ github.run_attempt }}
          path: prepared-consumer.json
          if-no-files-found: error
          retention-days: 1
      - id: plan
        env:
          RELEASE_REF: ${{ inputs.ref || github.ref }}
          RELEASE_PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
          RELEASE_DEV_VERSION: ${{ steps.prepared.outputs.prepared_version || inputs.dev_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node - <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const cargo=fs.readFileSync('cli/Cargo.toml','utf8').match(/^version\s*=\s*"([^"]+)"/m)?.[1];
          const manifest=require('./npm/artifact-manifest.json');
          if(!cargo||manifest.cliVersion!==cargo) throw new Error('CLI Cargo/npm versions differ');
          const ref=process.env.RELEASE_REF.replace(/^refs\/tags\//,'');
          const tagEvent=process.env.RELEASE_REF.startsWith('refs/tags/')||/^v\d+\./.test(ref);
          let channel,version;
          if(tagEvent){
            if(process.env.RELEASE_DEV_VERSION) throw new Error('A release tag cannot be combined with an exact DEV override');
            if(!/^v\d+\.\d+\.\d+(?:-dev\.\d+)?$/.test(ref)) throw new Error('Release tags must use vX.Y.Z or vX.Y.Z-dev.N');
            version=ref.slice(1);channel=version.includes('-dev.')?'dev':'latest';
            if(channel==='latest'&&cargo!==version) throw new Error('Stable release tag must exactly match CLI source version');
            cp.execFileSync('git',['merge-base','--is-ancestor','HEAD','origin/main']);
          }else{
            if(process.env.RELEASE_PUBLISH==='true') cp.execFileSync('git',['merge-base','--is-ancestor','HEAD','origin/main']);
            channel='dev';
            version=cp.execFileSync('node',['npm/scripts/next-dev-version.mjs'],{encoding:'utf8'}).trim();
          }
          // Stable promotion stays closed until complete G1 verification is implemented and authorized.
          if(['latest','stable'].includes(channel)) throw new Error('Stable publication is disabled: complete G1 evidence is not verified');
          const sha=cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          // Drafts reserve DEV numbers; only planning/publication hold this lock.
          if(channel==='dev'&&process.env.RELEASE_PUBLISH==='true'){
            const reservedJson=cp.execFileSync('gh',['api',`repos/${process.env.GITHUB_REPOSITORY}/releases?per_page=100`,'--paginate','--jq',`.[] | select(.tag_name=="v${version}") | {draft,prerelease,asset_count:(.assets|length),body}`],{encoding:'utf8'}).trim();
            const reserved=reservedJson?JSON.parse(reservedJson):null;
            const notes=`Build and regression results pending.\nRelease workflow run: ${process.env.GITHUB_RUN_ID}`;
            if(reserved){
              cp.execFileSync('node',['npm/scripts/release-publication.mjs','guard-reservation-accepted'],{stdio:'inherit',env:{...process.env,CLI_VERSION:version,CLI_SHA:sha}});
              if((!process.env.RELEASE_DEV_VERSION&&!tagEvent)||!reserved.draft||!reserved.prerelease||reserved.asset_count!==0) throw new Error('Only an explicitly requested empty DEV draft can be resumed');
              const owner=reserved.body?.match(/Release workflow run: (\d+)/)?.[1];
              if(owner){
                const prior=JSON.parse(cp.execFileSync('gh',['api',`repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${owner}`],{encoding:'utf8'}));
                if(prior.status!=='completed'&&!(owner===process.env.GITHUB_RUN_ID&&Number(process.env.GITHUB_RUN_ATTEMPT)>1)) throw new Error('The prior release run is still active; draft resumption refused');
              }else{
                // Legacy drafts have no owner marker; do not infer their run from a source ref.
                const activeRuns=cp.execFileSync('gh',['api',`repos/${process.env.GITHUB_REPOSITORY}/actions/workflows/release.yml/runs?per_page=100`,'--paginate','--jq',`.workflow_runs[] | select(.id!=${process.env.GITHUB_RUN_ID} and .status!="completed") | .id`],{encoding:'utf8'}).trim();
                if(activeRuns) throw new Error('A legacy draft cannot resume while another Release run is active');
              }
              cp.execFileSync('gh',['release','edit',`v${version}`,'--target',sha,
                '--title',`v${version}`,'--notes',notes],{stdio:'inherit'});
            }else{
              cp.execFileSync('gh',['release','create',`v${version}`,'--draft','--prerelease',
                '--target',sha,'--title',`v${version}`,'--notes',notes],{stdio:'inherit'});
            }
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`sha=${sha}\nversion=${version}\ntag=v${version}\nchannel=${channel}\npublish=${process.env.RELEASE_PUBLISH}\n`);
          NODE
      - name: Freeze the official pinned Runtime inventory for every full consumer
        if: inputs.prepared_run == '' && steps.validation.outputs.profile == 'full'
        id: candidate
        env:
          CLI_SHA: ${{ steps.plan.outputs.sha }}
          CLI_VERSION: ${{ steps.plan.outputs.version }}
          CLIENT2_RELEASE: ${{ inputs.client2_release }}
          CLIENT2_COMMIT: ${{ inputs.client2_commit }}
          CLIENT2_SEALED_RUN: ${{ inputs.client2_sealed_run }}
        run: node npm/scripts/candidate-artifact.mjs resolve

  validate:
    if: ${{ always() && ((needs.plan.result == 'success' && inputs.prepared_run == '' && (inputs.artifact_source || 'build') == 'build') || (inputs.artifact_source == 'published-assets' && needs.artifact-inputs.result == 'success' && needs.published-assets-verification.result == 'success')) }}
    needs: [plan, artifact-inputs, published-assets-verification]
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release-validation.yml
    with:
      ref: ${{ inputs.artifact_source == 'published-assets' && github.sha || needs.plan.outputs.sha }}
      version: ${{ inputs.artifact_source == 'published-assets' && needs.artifact-inputs.outputs.version || needs.plan.outputs.version }}
      full_validation: false
      client2_release: ${{ inputs.client2_release }}
      client2_commit: ${{ inputs.client2_commit }}
      client2_candidate_run_id: ''

      artifact_source: ${{ inputs.artifact_source || 'build' }}
      published_assets: ${{ inputs.published_assets }}
      published_assets_sha256: ${{ inputs.published_assets_sha256 }}
  native-regression:
    cache-mode: read
    if: ${{ always() && ((inputs.artifact_source == 'published-assets' && needs.artifact-inputs.result == 'success' && needs.published-assets-verification.result == 'success') || ((inputs.artifact_source || 'build') == 'build' && inputs.prepared_run == '' && needs.plan.result == 'success' && needs.plan.outputs.validation_profile == 'full')) && needs.validate.result == 'success' }}
    needs: [plan, validate, artifact-inputs, published-assets-verification]
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release-native-validation.yml
    with:
      ref: ${{ inputs.artifact_source == 'published-assets' && github.sha || needs.plan.outputs.sha }}
      version: ${{ inputs.artifact_source == 'published-assets' && needs.artifact-inputs.outputs.version || needs.plan.outputs.version }}
      candidate_assets: ${{ needs.plan.outputs.candidate }}
      validation_profile: full
      client2_release: ${{ inputs.client2_release }}
      client2_commit: ${{ inputs.client2_commit }}
      client2_candidate_run_id: ''

      artifact_source: ${{ inputs.artifact_source || 'build' }}
      published_assets: ${{ inputs.published_assets }}
      published_assets_sha256: ${{ inputs.published_assets_sha256 }}
  cloud-sweep:
    env:
      CANDIDATE_ASSETS: ${{ needs.plan.outputs.candidate }}
      VALIDATION_PROFILE: full
      RSRS_RUNTIME_TRIPLE: ${{ matrix.target }}
    if: ${{ always() && ((inputs.artifact_source == 'published-assets' && needs.artifact-inputs.result == 'success' && needs.published-assets-verification.result == 'success') || ((inputs.artifact_source || 'build') == 'build' && inputs.prepared_run == '' && needs.plan.result == 'success' && needs.plan.outputs.validation_profile == 'full')) && needs.validate.result == 'success' }}
    needs: [plan, validate, artifact-inputs, published-assets-verification]
    permissions:
      contents: read
      actions: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.artifact_source == 'published-assets' && github.sha || needs.plan.outputs.sha }}
          persist-credentials: false
      - name: Require native Windows ARM64 hardware
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          if ($env:RUNNER_ARCH -ne 'ARM64' -or [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'Arm64') {
            throw 'Windows ARM64 acceptance requires native ARM64 hardware'
          }
      - name: Require real native Linux ARM64 hardware
        shell: bash
        run: bash scripts/require-native-linux-arm64.sh '${{ matrix.target }}'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require the approved development server
        env:
          RSRS_DEV_SERVER_ADDR: ${{ vars.RESPIRE_DEV_SERVER_ADDR }}
        run: |
          node -e 'const value=process.env.RSRS_DEV_SERVER_ADDR; if(!value) throw new Error("Configure RSRS_DEV_SERVER_ADDR before testing"); const u=new URL(value); if(u.origin!=="https://api-dev.rsrs.rs"||u.pathname!=="/"||u.search||u.hash||u.username||u.password) throw new Error("Release smoke requires https://api-dev.rsrs.rs")'
      - name: Prepare ephemeral build version
        if: inputs.artifact_source != 'published-assets'
        run: node npm/scripts/set-build-version.mjs ${{ inputs.artifact_source == 'published-assets' && needs.artifact-inputs.outputs.version || needs.plan.outputs.version }}
      - name: Wait for this platform's build artifact
        if: inputs.artifact_source != 'published-assets'
        timeout-minutes: 46
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CLI_TARGET: ${{ matrix.target }}
        run: |
          node - <<'NODE'
          const cp=require('child_process');
          const repo=process.env.GITHUB_REPOSITORY,run=process.env.GITHUB_RUN_ID,target=process.env.CLI_TARGET;
          const name=`cli-release-${target}`,deadline=Date.now()+45*60*1000;
          const read=path=>JSON.parse(cp.execFileSync('gh',['api',`repos/${repo}/actions/runs/${run}/${path}`],{encoding:'utf8',timeout:30000}));
          async function wait(){
            let statusFailures=0;
            while(Date.now()<deadline){
              if(read('artifacts?per_page=100').artifacts.some(a=>a.name===name&&!a.expired)){
                console.log(`Build artifact ready: ${name}`);return;
              }
              let job;
              try {
                job=JSON.parse(cp.execFileSync('gh',['api','--paginate','--slurp',`repos/${repo}/actions/runs/${run}/jobs?per_page=10`],{encoding:'utf8',timeout:30000})).flatMap(page=>page.jobs).find(j=>j.name.endsWith(`Release (${target})`));
                statusFailures=0;
              } catch(error) {
                if(!/HTTP 50[0-9]/.test(String(error.stderr))||++statusFailures>=2) throw error;
                console.warn('GitHub job status temporarily unavailable; retrying this read once');
                await new Promise(resolve=>setTimeout(resolve,30000));continue;
              }
              if(job?.status==='completed'&&job.conclusion!=='success') throw new Error(`Build ${job.name} concluded ${job.conclusion}`);
              console.log(`Waiting for ${name}; other platform tests run independently`);
              await new Promise(resolve=>setTimeout(resolve,30000));
            }
            throw new Error(`Build artifact ${name} unavailable within 45 minutes`);
          }
          wait().catch(error=>{console.error(error.message);process.exit(1)});
          NODE
      - uses: actions/download-artifact@v4
        if: inputs.artifact_source != 'published-assets'
        with:
          name: cli-release-${{ matrix.target }}
          path: validated-cli
      - uses: actions/download-artifact@v4
        if: inputs.artifact_source == 'published-assets'
        with:
          name: published-assets-verification-${{ matrix.target }}
          path: validated-cli
      - name: Verify and extract this platform's artifacts
        id: verified_artifact
        env:
          CLI_TARGET: ${{ matrix.target }}
          CLI_SHA: ${{ inputs.artifact_source == 'published-assets' && needs.artifact-inputs.outputs.sha || needs.plan.outputs.sha }}
          CLI_VERSION: ${{ inputs.artifact_source == 'published-assets' && needs.artifact-inputs.outputs.version || needs.plan.outputs.version }}
        run: node npm/scripts/extract-artifact.mjs validated-cli cli
      - name: Bind fixtures to an independent official pinned Runtime
        if: inputs.artifact_source != 'published-assets'
        shell: bash
        env:
          RSRS_DATA_DIR: ${{ runner.temp }}/full-runtime-proof
        run: |
          set -euo pipefail
          exe=cli/rsrs
          if [ "$RUNNER_OS" = Windows ]; then exe="$exe.exe"; fi
          node scripts/ci-install-pinned-runtime.mjs "$exe"
      - name: Install PowerShell
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if command -v pwsh >/dev/null 2>&1; then exit 0; fi
          if [ "$RUNNER_OS" = macOS ]; then brew install powershell; else
            . /etc/os-release
            curl -fsSL "https://packages.microsoft.com/config/ubuntu/${VERSION_ID}/packages-microsoft-prod.deb" -o /tmp/packages-microsoft-prod.deb
            sudo dpkg -i /tmp/packages-microsoft-prod.deb
            bash scripts/ci-apt-get.sh update
            bash scripts/ci-apt-get.sh install -y powershell
          fi
      - uses: actions/setup-python@v5
        id: supplement_python
        if: ${{ !cancelled() && steps.verified_artifact.outcome == 'success' && (runner.os == 'Linux' || inputs.artifact_source == 'published-assets') }}
        with:
          python-version: '3.12'
      - name: Prepare persistent native credentials for the Linux sweep
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci-apt-get.sh update
          bash scripts/ci-apt-get.sh install -y --no-install-recommends dbus-x11 gnome-keyring
          python3 -m pip install --only-binary=:all: SecretStorage==3.3.3 jeepney==0.9.0 cryptography==46.0.3
      - name: Sweep the approved development server
        shell: pwsh
        env:
          RSRS_DEV_SERVER_ADDR: ${{ vars.RESPIRE_DEV_SERVER_ADDR }}
          CLI_SHA: ${{ inputs.artifact_source == 'published-assets' && needs.artifact-inputs.outputs.sha || needs.plan.outputs.sha }}
          RSRS_ENGINE: cpu
          RSRS_M3_DIR: ${{ runner.temp }}/sweep-model/bge-m3
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path (Resolve-Path cli) $(if ($IsWindows) { 'rsrs.exe' } else { 'rsrs' })
          if ($IsLinux) {
            & dbus-run-session -- env RSRS_SS_FIXTURE_BUS=private python3 scripts/dev-secret-service-keyring-selftest.py --root (Join-Path $env:RUNNER_TEMP 'base-sweep-credentials') --timeout 6600 -- pwsh -NoProfile -File scripts/dev-release-sweep.ps1 -Exe $exe -ExpectVersion '${{ inputs.artifact_source == 'published-assets' && needs.artifact-inputs.outputs.version || needs.plan.outputs.version }}' -Root (Join-Path $env:RUNNER_TEMP 'release-sweep') -DeferSupplemental
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            ./scripts/dev-release-sweep.ps1 -Exe $exe -ExpectVersion '${{ inputs.artifact_source == 'published-assets' && needs.artifact-inputs.outputs.version || needs.plan.outputs.version }}' -Root (Join-Path $env:RUNNER_TEMP 'release-sweep') -DeferSupplemental
          }
      - name: Upload base smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: base-release-sweep-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/release-sweep/report.md
            ${{ runner.temp }}/release-sweep/coverage.json
            ${{ runner.temp }}/base-sweep-credentials/business-keyring-selftest.json
          if-no-files-found: warn
      - name: Verify all supplementary CLI contracts
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.supplement_python.outcome == 'success' }}
        shell: bash
        env:
          RSRS_DEV_SERVER_ADDR: ${{ vars.RESPIRE_DEV_SERVER_ADDR }}
          RSRS_DEV_SERVER_SHA: ${{ vars.RESPIRE_DEV_SERVER_SHA }}
          CLI_VERSION: ${{ inputs.artifact_source == 'published-assets' && needs.artifact-inputs.outputs.version || needs.plan.outputs.version }}
          CLI_SHA: ${{ inputs.artifact_source == 'published-assets' && needs.artifact-inputs.outputs.sha || needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          python3 -m pip install --only-binary=:all: cryptography==46.0.3 psutil==7.1.0
          binary="$(realpath cli/rsrs)"
          checksum="$(sha256sum "$binary" | cut -d ' ' -f 1)"
          dbus-run-session -- env RSRS_SS_FIXTURE_BUS=private python3 scripts/dev-secret-service-keyring-selftest.py --root "$RUNNER_TEMP/supplement-credentials" --timeout 6600 -- python3 scripts/dev-smoke-supplements.py --binary "$binary" --binary-sha256 "$checksum" --version "$CLI_VERSION" --source-sha "$CLI_SHA" --root "$RUNNER_TEMP/release-supplements" --cli-report "$RUNNER_TEMP/release-sweep/coverage.json"
      - name: Verify independent native Secret Service login and key continuation
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.supplement_python.outcome == 'success' }}
        shell: bash
        env:
          RSRS_DEV_SERVER_ADDR: ${{ vars.RESPIRE_DEV_SERVER_ADDR }}
          RSRS_DEV_SERVER_SHA: ${{ vars.RESPIRE_DEV_SERVER_SHA }}
          CLI_VERSION: ${{ inputs.artifact_source == 'published-assets' && needs.artifact-inputs.outputs.version || needs.plan.outputs.version }}
          CLI_SHA: ${{ inputs.artifact_source == 'published-assets' && needs.artifact-inputs.outputs.sha || needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          binary="$(realpath cli/rsrs)"
          checksum="$(sha256sum "$binary" | cut -d ' ' -f 1)"
          dbus-run-session -- env RSRS_SS_FIXTURE_BUS=private python3 scripts/dev-login-interruption-smoke.py --native-credentials --binary "$binary" --binary-sha256 "$checksum" --version "$CLI_VERSION" --source-sha "$CLI_SHA" --root "$RUNNER_TEMP/native-login-interruption" --model-dir "$RUNNER_TEMP/release-supplements/outbox/models"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && runner.os == 'Linux' }}
        with:
          retention-days: 1
          name: secret-service-profile-migration-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/native-login-interruption/interruption-coverage.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: 1
          name: release-sweep-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/release-sweep/report.md
            ${{ runner.temp }}/release-sweep/coverage.json
            ${{ runner.temp }}/supplement-credentials/business-keyring-selftest.json
            ${{ runner.temp }}/release-supplements/suite-results.json
            ${{ runner.temp }}/release-supplements/combined-coverage.json
            ${{ runner.temp }}/release-supplements/outbox/outbox-coverage.json
            ${{ runner.temp }}/release-supplements/ai-inject/ai-inject-coverage.json
            ${{ runner.temp }}/release-supplements/ai-credentials/business-keyring-selftest.json
            ${{ runner.temp }}/release-supplements/runtime-credentials/business-keyring-selftest.json
            ${{ runner.temp }}/release-supplements/runtime-coverage.json
            ${{ runner.temp }}/release-supplements/legacy-vault/legacy-vault-coverage.json
            ${{ runner.temp }}/release-supplements/login-interruption/interruption-coverage.json
          if-no-files-found: error

  api-smoke:
    if: ${{ always() && ((inputs.artifact_source == 'published-assets' && needs.artifact-inputs.result == 'success' && needs.published-assets-verification.result == 'success') || ((inputs.artifact_source || 'build') == 'build' && inputs.prepared_run == '' && needs.plan.result == 'success' && needs.plan.outputs.validation_profile == 'full')) }}
    needs: [plan, artifact-inputs, published-assets-verification]
    env:
      CANDIDATE_ASSETS: ${{ needs.plan.outputs.candidate }}
      VALIDATION_PROFILE: full
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: respire-dev-mailbox-fixture
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.artifact_source == 'published-assets' && github.sha || needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check all baseline CLI API contracts and GitHub transport
        env:
          RSRS_DEV_MAIL_ADDRESS: ${{ vars.RESPIRE_DEV_MAIL_ADDRESS }}
          RSRS_DEV_IMAP_HOST: ${{ vars.RESPIRE_DEV_IMAP_HOST }}
          RSRS_DEV_IMAP_USERNAME: ${{ secrets.RESPIRE_DEV_IMAP_USERNAME }}
          RSRS_DEV_IMAP_PASSWORD: ${{ secrets.RESPIRE_DEV_IMAP_PASSWORD }}
          RSRS_DEV_SERVER_ADDR: ${{ vars.RESPIRE_DEV_SERVER_ADDR }}
          RSRS_DEV_API_ADMIN_APPROVED: ${{ vars.RESPIRE_DEV_API_ADMIN_APPROVED }}
          RSRS_DEV_ADMIN_TOKEN: ${{ secrets.RESPIRE_DEV_ADMIN_TOKEN }}
          RSRS_DEV_SERVER_SHA: ${{ vars.RESPIRE_DEV_SERVER_SHA }}
        run: |
          sleep 61
          python3 scripts/dev-api-smoke.py --report "$RUNNER_TEMP/dev-api-coverage.json" --scope all
          python3 scripts/dev-github-api-smoke.py --report "$RUNNER_TEMP/dev-github-api-coverage.json"
          node - <<'NODE'
            const fs=require('fs'),path=require('path'),{createHash}=require('crypto');
            const reports=Object.fromEntries(['dev-api-coverage.json','dev-github-api-coverage.json'].map(name=>[name,createHash('sha256').update(fs.readFileSync(path.join(process.env.RUNNER_TEMP,name))).digest('hex')]));
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'published-api-identity.json'),JSON.stringify({harness_sha:process.env.GITHUB_SHA,manifest_sha256:process.env.ARTIFACT_SOURCE==='published-assets'?process.env.PUBLISHED_ASSETS_SHA256:createHash('sha256').update(process.env.CANDIDATE_ASSETS).digest('hex'),run_id:Number(process.env.GITHUB_RUN_ID),run_attempt:Number(process.env.GITHUB_RUN_ATTEMPT),reports}));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: 1
          name: dev-api-coverage
          path: |
            ${{ runner.temp }}/dev-api-coverage.json
            ${{ runner.temp }}/dev-github-api-coverage.json
            ${{ runner.temp }}/published-api-identity.json
          if-no-files-found: error

  preparation-receipt:
    if: ${{ always() && inputs.prepared_run == '' && needs.plan.result == 'success' && needs.plan.outputs.validation_profile == 'full' && (inputs.artifact_source || 'build') == 'build' }}
    needs: [plan, validate, native-regression, cloud-sweep, api-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      CLI_SHA: ${{ needs.plan.outputs.sha }}
      CLI_VERSION: ${{ needs.plan.outputs.version }}
      VALIDATION_PROFILE: full
      CANDIDATE_ASSETS: ${{ needs.plan.outputs.candidate }}
    steps:
      - name: Require all full consumers including GUI and historical DB
        env:
          FULL_NEEDS: ${{ toJSON(needs) }}
        run: node -e "if(Object.values(JSON.parse(process.env.FULL_NEEDS)).some(j=>j.result!=='success'))throw Error('Missing successful full candidate consumer')"
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          path: full-reports
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-release-*
          path: release-assets
          merge-multiple: true
      - name: Attest actual full reports and frozen CLI and npm bytes
        run: node npm/scripts/release-preparation.mjs attest release-assets full-reports/npm-release-packages release-prepared.json full-reports
      - uses: actions/upload-artifact@v4
        with:
          name: release-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-prepared.json
          if-no-files-found: error
          retention-days: 1

  prepared-import:
    if: ${{ !cancelled() && needs.plan.result == 'success' && inputs.prepared_run != '' && (inputs.artifact_source || 'build') == 'build' }}
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      CLI_SHA: ${{ needs.plan.outputs.sha }}
      CLI_VERSION: ${{ needs.plan.outputs.version }}
      VALIDATION_PROFILE: full
      PREPARED_ATTEMPT: ${{ needs.plan.outputs.prepared_attempt }}
      PREPARED_ARTIFACT_ID: ${{ needs.plan.outputs.prepared_artifact_id }}
      PREPARED_ARTIFACT_DIGEST: ${{ needs.plan.outputs.prepared_artifact_digest }}
      PREPARED_RECEIPT_SHA256: ${{ needs.plan.outputs.prepared_receipt_sha256 }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Load the current trusted preparation reader for frozen product bytes
        run: git archive "$GITHUB_SHA" npm/scripts/{release-recovery3930,release-recovery-sources,release-preparation,candidate-artifact,extract-artifact,publication-acceptance,release-publication,verified-receipt}.mjs | tar -x
      - run: node npm/scripts/prepared-import.mjs consumer
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.plan.outputs.prepared_binary_artifact_ids }}
          run-id: ${{ needs.plan.outputs.prepared_binary_run }}
          github-token: ${{ github.token }}
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.plan.outputs.prepared_pack_artifact_ids }}
          run-id: ${{ needs.plan.outputs.prepared_binary_run }}
          github-token: ${{ github.token }}
          path: npm/release-packages
          merge-multiple: true
      - run: node npm/scripts/prepared-import.mjs record release-assets npm/release-packages prepared-import.json
      - uses: actions/upload-artifact@v4
        with:
          name: imported-release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: imported-npm-packages
          path: npm/release-packages/*
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-import-${{ github.run_id }}-${{ github.run_attempt }}
          path: prepared-import.json
          if-no-files-found: error
          retention-days: 1

  publication-ready:
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.prepared-import.result == 'success' && needs.plan.outputs.publish == 'true' && (inputs.artifact_source || 'build') == 'build' }}
    needs: [plan, prepared-import]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      imported_artifact_id: ${{ steps.ready.outputs.imported_artifact_id }}
      imported_artifact_digest: ${{ steps.ready.outputs.imported_artifact_digest }}
      imported_receipt_sha256: ${{ steps.ready.outputs.imported_receipt_sha256 }}
    env:
      CLI_SHA: ${{ needs.plan.outputs.sha }}
      CLI_VERSION: ${{ needs.plan.outputs.version }}
      VALIDATION_PROFILE: full
      PREPARED_ATTEMPT: ${{ needs.plan.outputs.prepared_attempt }}
      PREPARED_ARTIFACT_ID: ${{ needs.plan.outputs.prepared_artifact_id }}
      PREPARED_ARTIFACT_DIGEST: ${{ needs.plan.outputs.prepared_artifact_digest }}
      PREPARED_RECEIPT_SHA256: ${{ needs.plan.outputs.prepared_receipt_sha256 }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Load the current trusted preparation reader for frozen product bytes
        run: git archive "$GITHUB_SHA" npm/scripts/{release-recovery3930,release-recovery-sources,release-preparation,candidate-artifact,extract-artifact,publication-acceptance,release-publication,verified-receipt}.mjs | tar -x
      - id: ready
        run: node npm/scripts/prepared-import.mjs readiness

  publish:
    # Publication requires fresh exact-source validation and current-run readiness.
    needs: [artifact-inputs, plan, prepared-import, publication-ready]
    if: ${{ !cancelled() && needs.artifact-inputs.result == 'success' && needs.plan.result == 'success' && needs.prepared-import.result == 'success' && needs.publication-ready.result == 'success' && needs.plan.outputs.publish == 'true' && (inputs.artifact_source || 'build') == 'build' }}
    runs-on: ubuntu-latest
    concurrency:
      group: cli-release-publication
      queue: max
      cancel-in-progress: false
    env:
      VALIDATION_PROFILE: ${{ needs.plan.outputs.validation_profile }}
      PREPARED_ATTEMPT: ${{ needs.plan.outputs.prepared_attempt }}
      PREPARED_ARTIFACT_ID: ${{ needs.plan.outputs.prepared_artifact_id }}
      PREPARED_ARTIFACT_DIGEST: ${{ needs.plan.outputs.prepared_artifact_digest }}
      PREPARED_RECEIPT_SHA256: ${{ needs.plan.outputs.prepared_receipt_sha256 }}
      IMPORTED_ARTIFACT_ID: ${{ needs.publication-ready.outputs.imported_artifact_id }}
      IMPORTED_ARTIFACT_DIGEST: ${{ needs.publication-ready.outputs.imported_artifact_digest }}
      IMPORTED_RECEIPT_SHA256: ${{ needs.publication-ready.outputs.imported_receipt_sha256 }}
    permissions:
      contents: write
      actions: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Require publication barrier support before any npm write
        run: |
          git archive "$GITHUB_SHA" npm/scripts/{release-recovery3930,release-recovery-sources,release-preparation,candidate-artifact,extract-artifact,publication-acceptance,release-publication,verified-receipt}.mjs | tar -x
          # Old refs lacking the protocol must fail before scoped publication.
          test "$(node npm/scripts/release-publication.mjs protocol)" = 2
          node --input-type=module -e "import fs from 'node:fs'; if (JSON.parse(fs.readFileSync('npm/artifact-manifest.json')).npmScope !== 'rsrs-cli') throw Error('New publication requires the direct rsrs-cli launcher')"
      - name: Reject previously fenced version owners before npm or asset mutation
        env:
          GH_TOKEN: ${{ github.token }}
          CLI_SHA: ${{ needs.plan.outputs.sha }}
          CLI_VERSION: ${{ needs.plan.outputs.version }}
        run: node npm/scripts/release-publication.mjs check-fence-accepted
      - run: npm install --global npm@11.5.1
      - name: Prepare ephemeral build version
        run: node npm/scripts/set-build-version.mjs ${{ needs.plan.outputs.version }}
      - uses: actions/download-artifact@v4
        with:
          name: imported-release-assets
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: imported-npm-packages
          path: npm/release-packages
      - name: Verify release artifacts and prepare every scoped npm package
        env:
          GH_TOKEN: ${{ github.token }}
          CLI_SHA: ${{ needs.plan.outputs.sha }}
        run: |
          git archive "$GITHUB_SHA" npm/scripts/verify-packages.mjs | tar -x
          node npm/scripts/verify-packages.mjs release-assets --assets-only
          node npm/scripts/assemble-artifacts.mjs release-assets target/ci
          node npm/scripts/pack.mjs --root target/ci
          node npm/scripts/verify-packages.mjs release-assets --reuse-packs npm/release-packages --export-packs npm/publication-packages
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: npm-publication-packages-${{ github.run_id }}-${{ github.run_attempt }}
          path: npm/publication-packages/*
          if-no-files-found: error
      - name: Generate release descriptions and the complete commit list
        env:
          GH_TOKEN: ${{ github.token }}
          CLI_TAG: ${{ needs.plan.outputs.tag }}
          CLI_SHA: ${{ needs.plan.outputs.sha }}
          CLI_CHANNEL: ${{ needs.plan.outputs.channel }}
        run: node npm/scripts/release-notes.mjs "$RUNNER_TEMP/release-notes.md"
      - name: Preserve durable version ownership in the generated Release notes
        env:
          GH_TOKEN: ${{ github.token }}
          CLI_SHA: ${{ needs.plan.outputs.sha }}
          CLI_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: node npm/scripts/release-publication.mjs bind-fence-notes-accepted
      - name: Create a draft and upload every verified artifact
        env:
          GH_TOKEN: ${{ github.token }}
          CLI_TAG: ${{ needs.plan.outputs.tag }}
          CLI_SHA: ${{ needs.plan.outputs.sha }}
          CLI_CHANNEL: ${{ needs.plan.outputs.channel }}
        run: |
          set -euo pipefail
          if gh release view "$CLI_TAG" --json isDraft >/dev/null 2>&1; then
            test "$(gh release view "$CLI_TAG" --json isDraft --jq .isDraft)" = true || { echo 'Release is already public; use a new version'; exit 1; }
            CLI_SHA="${{ needs.plan.outputs.sha }}" CLI_VERSION="${{ needs.plan.outputs.version }}" node npm/scripts/release-publication.mjs check-fence-accepted
            gh release edit "$CLI_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          elif [ "$CLI_CHANNEL" = dev ]; then
            gh release create "$CLI_TAG" --draft --prerelease --target "$CLI_SHA" --title "$CLI_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$CLI_TAG" --draft --target "$CLI_SHA" --title "$CLI_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$CLI_TAG" release-assets/* --clobber
          gh release view "$CLI_TAG" --json assets > "$RUNNER_TEMP/release-assets.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {releaseAssetNames} from './npm/scripts/verify-binary.mjs';
          const expected=fs.readdirSync('release-assets').sort();
          const actual=JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP,'release-assets.json'),'utf8')).assets.map(asset=>asset.name).sort();
          const m=JSON.parse(fs.readFileSync('npm/artifact-manifest.json','utf8'));
          const required=m.targets.flatMap(target=>releaseAssetNames(m,target.triple)).sort();
          if(JSON.stringify(expected)!==JSON.stringify(required)||JSON.stringify(actual)!==JSON.stringify(required)) throw new Error('Draft release must contain every exact-source asset required by the manifest layout');
          NODE
      - name: Reconcile any interrupted previous-attempt npm submission
        env:
          GH_TOKEN: ${{ github.token }}
          CLI_SHA: ${{ needs.plan.outputs.sha }}
          CLI_VERSION: ${{ needs.plan.outputs.version }}
          CLI_CHANNEL: ${{ needs.plan.outputs.channel }}
        run: node npm/scripts/release-publication.mjs guard-accepted
      - name: Publish npm using Trusted Publishing
        env:
          GH_TOKEN: ${{ github.token }}
          CLI_SHA: ${{ needs.plan.outputs.sha }}
          CLI_CHANNEL: ${{ needs.plan.outputs.channel }}
        run: |
          node npm/scripts/pack.mjs --root target/ci --publish --accepted-only --verified-packs npm/publication-packages --tag "$CLI_CHANNEL"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: 1
          name: npm-submissions-${{ github.run_id }}-${{ github.run_attempt }}
          path: scoped-submissions.json
          if-no-files-found: ignore
      - name: Bind successful scoped npm submissions to the draft
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
          CLI_SHA: ${{ needs.plan.outputs.sha }}
          CLI_VERSION: ${{ needs.plan.outputs.version }}
          CLI_CHANNEL: ${{ needs.plan.outputs.channel }}
        run: node npm/scripts/release-publication.mjs scoped-accepted
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: scoped-accepted-${{ github.run_id }}-${{ github.run_attempt }}
          path: scoped-accepted.json
          if-no-files-found: error
      - name: Start the matching short-package publisher after scoped acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run npm-alias.yml --ref '${{ github.ref_name }}' -f release_run='${{ github.run_id }}' -f release_attempt='${{ github.run_attempt }}'
      - name: Require every matching npm submission acceptance
        timeout-minutes: 21
        env:
          GH_TOKEN: ${{ github.token }}
        run: node npm/scripts/release-publication.mjs await-alias-accepted
      - name: Make the complete release public
        env:
          GH_TOKEN: ${{ github.token }}
          CLI_TAG: ${{ needs.plan.outputs.tag }}
          FULL_REGRESSION_REQUIRED: ${{ needs.plan.outputs.validation_profile == 'full' }}
        run: node npm/scripts/release-publication.mjs finalize-accepted
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: publication-accepted-${{ github.run_id }}-${{ github.run_attempt }}
          path: publication-accepted.json
          if-no-files-found: error
