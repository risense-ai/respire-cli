name: Opt-in user runtime supervision validation
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native autostart diagnostic target; no release acceptance
        type: choice
        default: all
        options: [all, windows-latest, macos-15-intel, ubuntu-latest]
      runtime_source_sha:
        description: Exact reviewed source of the compatible newly published Runtime; update runtime-pin.json before product validation
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  source-checks:
    name: Offline fixture preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify fixture installation and explicit Runtime provenance contract
        run: python scripts/test-native-runtime-install.py
      - name: Record source-only validation scope
        run: echo 'Source and fixture checks only. Native product validation follows on explicit dispatch.' >> "$GITHUB_STEP_SUMMARY"

  user-runtime:
    name: Published Runtime supervision (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    needs: source-checks
    cache-mode: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platform == 'windows-latest' && '[{"os":"windows-latest","target":"x86_64-pc-windows-msvc","suffix":".exe"}]' || inputs.platform == 'macos-15-intel' && '[{"os":"macos-15-intel","target":"x86_64-apple-darwin","suffix":""}]' || inputs.platform == 'ubuntu-latest' && '[{"os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu","suffix":""}]' || '[{"os":"windows-latest","target":"x86_64-pc-windows-msvc","suffix":".exe"},{"os":"macos-15-intel","target":"x86_64-apple-darwin","suffix":""},{"os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu","suffix":""}]') }}
    env:
      RSRS_ENGINE: cpu
      RUST_TEST_THREADS: '1'
      RUST_MIN_STACK: '16777216'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare hosted Linux credentials and user systemd
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          bash scripts/ci-apt-get.sh update
          bash scripts/ci-apt-get.sh install -y --no-install-recommends dbus-x11 gnome-keyring
          python -m pip install --only-binary=:all: SecretStorage==3.3.3 jeepney==0.9.0 cryptography==46.0.3
          uid="$(id -u)"
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$uid.service"
          sudo systemctl is-active --quiet "user@$uid.service"
          export XDG_RUNTIME_DIR="/run/user/$uid"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          test ! -L "$XDG_RUNTIME_DIR"
          test "$(stat -c '%u:%a' "$XDG_RUNTIME_DIR")" = "$uid:700"
          test ! -L "$XDG_RUNTIME_DIR/bus"
          test -S "$XDG_RUNTIME_DIR/bus"
          test "$(stat -c '%u' "$XDG_RUNTIME_DIR/bus")" = "$uid"
          test "$(busctl --user call org.freedesktop.DBus /org/freedesktop/DBus org.freedesktop.DBus NameHasOwner s org.freedesktop.systemd1)" = 'b true'
          test "$(busctl --user call org.freedesktop.DBus /org/freedesktop/DBus org.freedesktop.DBus GetConnectionUnixUser s org.freedesktop.systemd1)" = "u $uid"
          printf '%s\n' "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}
      - name: Build the current native CLI for explicit product validation
        shell: bash
        env:
          SDK_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          test -z "${CORE_SDK_READ_TOKEN:-}"
          if [[ "$SDK_TARGET" == *windows-msvc ]]; then export RUSTFLAGS='-C target-feature=-crt-static'; fi
          cargo build --locked -p respire --bin rsrs --target "$SDK_TARGET" --target-dir target/autostart-validation
      - name: Prepare and authenticate the explicitly reviewed published Runtime
        shell: bash
        env:
          SDK_TARGET: ${{ matrix.target }}
          EXE_SUFFIX: ${{ matrix.suffix }}
          RUNTIME_FIXTURE_HOSTED: ${{ runner.environment == 'github-hosted' }}
          EXPECTED_RUNTIME_SOURCE_SHA: ${{ inputs.runtime_source_sha }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {appendFileSync, mkdtempSync, readFileSync, realpathSync, statSync} from 'node:fs';
          import {join, resolve} from 'node:path';
          import {spawnSync} from 'node:child_process';
          assert.equal(process.env.GITHUB_ACTIONS, 'true');
          assert.equal(process.env.RUNTIME_FIXTURE_HOSTED, 'true', 'Runtime fixtures require a dedicated GitHub-hosted runner');
          assert.match(process.env.EXPECTED_RUNTIME_SOURCE_SHA ?? '', /^[a-f0-9]{40}$/, 'Select the reviewed newly published Runtime source explicitly');
          const root = mkdtempSync(join(process.env.RUNNER_TEMP, 'official-runtime-'));
          const cli = resolve('target/autostart-validation', process.env.SDK_TARGET, 'debug', `rsrs${process.env.EXE_SUFFIX}`);
          const env = {...process.env, RSRS_DATA_DIR: root};
          // Keep the test environment intact; only the official installer may download.
          delete env.RSRS_CORE_TEST_MODE;
          const {installPinnedRuntime} = await import('./scripts/ci-install-pinned-runtime.mjs');
          const result = await installPinnedRuntime(cli, {env}, process.env.SDK_TARGET);
          if (result.error) throw result.error;
          assert.equal(result.status, 0, 'Official pinned Runtime installation failed');
          const pin = JSON.parse(readFileSync('runtime-pin.json', 'utf8'));
          const selected = JSON.parse(readFileSync(join(root, 'bin', 'runtime.json'), 'utf8'));
          const hash = bytes => createHash('sha256').update(bytes).digest('hex');
          assert.equal(selected.version, pin.required);
          assert.ok(selected.release?.metadata_json, 'Official Runtime release proof is required');
          assert.equal(hash(selected.release.metadata_json), selected.release.metadata_sha256);
          const metadata = JSON.parse(selected.release.metadata_json);
          assert.equal(metadata.schema_version, 2);
          assert.equal(metadata.runtime_version, pin.required);
          assert.equal(metadata.triple ?? metadata.target_triple, process.env.SDK_TARGET);
          assert.equal(metadata.source_commit, process.env.EXPECTED_RUNTIME_SOURCE_SHA);
          assert.equal(metadata.binary_sha256, selected.sha256);
          const runtime = join(root, 'bin', 'runtime', pin.required, `rsrs-runtime${process.env.EXE_SUFFIX}`);
          assert.ok(statSync(runtime).isFile());
          assert.notEqual(realpathSync(runtime), realpathSync(cli), 'CLI cannot be the Runtime fixture');
          assert.equal(hash(readFileSync(runtime)), selected.sha256);
          assert.equal(hash(readFileSync(join(root, 'bin', 'runtime', pin.required, 'core-runtime.json'))),
            metadata.files.find(file => file.path === 'core-runtime.json')?.sha256);
          appendFileSync(process.env.GITHUB_ENV, `RSRS_RUNTIME_BIN=${runtime}\n`);
          NODE
      - name: Foreground and actual isolated current-user service lifecycle
        shell: bash
        env:
          SDK_TARGET: ${{ matrix.target }}
          EXE_SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          python scripts/test-runtime-autostart.py --binary "target/autostart-validation/$SDK_TARGET/debug/rsrs$EXE_SUFFIX" --register
