name: Opt-in user runtime supervision validation
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native autostart diagnostic target; no release acceptance
        type: choice
        default: all
        options: [all, windows-latest, macos-15-intel, ubuntu-latest, ubuntu-24.04-arm]
      runtime_source_sha:
        description: Exact reviewed source of the compatible newly published Runtime; update .github/runtime-test-fixture.json before product validation
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  source-checks:
    name: Offline fixture preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify fixture installation and explicit Runtime provenance contract
        run: python scripts/test-native-runtime-install.py
      - name: Record source-only validation scope
        run: echo 'Source and fixture checks only. Native product validation follows on explicit dispatch.' >> "$GITHUB_STEP_SUMMARY"

  user-runtime:
    name: Published Runtime supervision (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    needs: source-checks
    cache-mode: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platform == 'ubuntu-24.04-arm' && '[{"os":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-musl","suffix":""}]' || inputs.platform == 'windows-latest' && '[{"os":"windows-latest","target":"x86_64-pc-windows-msvc","suffix":".exe"}]' || inputs.platform == 'macos-15-intel' && '[{"os":"macos-15-intel","target":"x86_64-apple-darwin","suffix":""}]' || inputs.platform == 'ubuntu-latest' && '[{"os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu","suffix":""}]' || '[{"os":"windows-latest","target":"x86_64-pc-windows-msvc","suffix":".exe"},{"os":"macos-15-intel","target":"x86_64-apple-darwin","suffix":""},{"os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu","suffix":""}]') }}
    env:
      RSRS_ENGINE: cpu
      RUST_TEST_THREADS: '1'
      RUST_MIN_STACK: '16777216'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare hosted Linux credentials and user systemd
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          bash scripts/ci-apt-get.sh update
          bash scripts/ci-apt-get.sh install -y --no-install-recommends dbus-user-session dbus-x11 gnome-keyring
          python -m pip install --only-binary=:all: SecretStorage==3.3.3 jeepney==0.9.0 cryptography==46.0.3
          # These preparation commands contain no credential material.
          set -x
          uid="$(id -u)"
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl restart "user@$uid.service"
          sudo systemctl is-active --quiet "user@$uid.service"
          export XDG_RUNTIME_DIR="/run/user/$uid"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          test ! -L "$XDG_RUNTIME_DIR"
          test "$(stat -c '%u:%a' "$XDG_RUNTIME_DIR")" = "$uid:700"
          test ! -L "$XDG_RUNTIME_DIR/bus"
          test -S "$XDG_RUNTIME_DIR/bus"
          test "$(stat -c '%u' "$XDG_RUNTIME_DIR/bus")" = "$uid"
          # user@ readiness covers basic.target, not the socket-activated API bus.
          systemctl --user show dbus.socket dbus.service -p Id -p ActiveState -p SubState -p MainPID -p Listen
          systemctl --user start dbus.service
          systemctl --user is-active --quiet dbus.socket dbus.service
          systemctl --user show dbus.socket dbus.service -p Id -p ActiveState -p SubState -p MainPID -p Listen
          sudo journalctl -b -u "user@$uid.service" --no-pager
          test "$(busctl --user call org.freedesktop.DBus /org/freedesktop/DBus org.freedesktop.DBus NameHasOwner s org.freedesktop.systemd1)" = 'b true'
          test "$(busctl --user call org.freedesktop.DBus /org/freedesktop/DBus org.freedesktop.DBus GetConnectionUnixUser s org.freedesktop.systemd1)" = "u $uid"
          printf '%s\n' "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.95.0
        if: matrix.os != 'ubuntu-24.04-arm'
        with:
          targets: ${{ matrix.target }}
      - name: Build the current native CLI for explicit product validation
        if: matrix.os != 'ubuntu-24.04-arm'
        shell: bash
        env:
          SDK_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          test -z "${CORE_SDK_READ_TOKEN:-}"
          if [[ "$SDK_TARGET" == *windows-msvc ]]; then export RUSTFLAGS='-C target-feature=-crt-static'; fi
          cargo build --locked -p respire --bin rsrs --target "$SDK_TARGET" --target-dir target/autostart-validation
      - name: Prepare and authenticate the explicitly reviewed published Runtime
        if: matrix.os != 'ubuntu-24.04-arm'
        shell: bash
        env:
          SDK_TARGET: ${{ matrix.target }}
          EXE_SUFFIX: ${{ matrix.suffix }}
          RUNTIME_FIXTURE_HOSTED: ${{ runner.environment == 'github-hosted' }}
          EXPECTED_RUNTIME_SOURCE_SHA: ${{ inputs.runtime_source_sha }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {appendFileSync, mkdtempSync, readFileSync, realpathSync, statSync} from 'node:fs';
          import {join, resolve} from 'node:path';
          import {spawnSync} from 'node:child_process';
          assert.equal(process.env.GITHUB_ACTIONS, 'true');
          assert.equal(process.env.RUNTIME_FIXTURE_HOSTED, 'true', 'Runtime fixtures require a dedicated GitHub-hosted runner');
          assert.match(process.env.EXPECTED_RUNTIME_SOURCE_SHA ?? '', /^[a-f0-9]{40}$/, 'Select the reviewed newly published Runtime source explicitly');
          const root = mkdtempSync(join(process.env.RUNNER_TEMP, 'official-runtime-'));
          const cli = resolve('target/autostart-validation', process.env.SDK_TARGET, 'debug', `rsrs${process.env.EXE_SUFFIX}`);
          const env = {...process.env, RSRS_DATA_DIR: root};
          // Keep the test environment intact; only the official installer may download.
          delete env.RSRS_CORE_TEST_MODE;
          delete env.RSRS_RUNTIME_TRIPLE;
          const runtimeTarget = process.env.SDK_TARGET.replace(/-unknown-linux-gnu$/, '-unknown-linux-musl');
          const {installPinnedRuntime} = await import('./scripts/ci-install-pinned-runtime.mjs');
          const result = await installPinnedRuntime(cli, {env}, runtimeTarget);
          if (result.error) throw result.error;
          assert.equal(result.status, 0, 'Official pinned Runtime installation failed');
          const pin = JSON.parse(readFileSync('.github/runtime-test-fixture.json', 'utf8'));
          const selected = JSON.parse(readFileSync(join(root, 'bin', 'runtime.json'), 'utf8'));
          const hash = bytes => createHash('sha256').update(bytes).digest('hex');
          assert.equal(selected.version, pin.required);
          assert.ok(selected.release?.metadata_json, 'Official Runtime release proof is required');
          assert.equal(hash(selected.release.metadata_json), selected.release.metadata_sha256);
          const metadata = JSON.parse(selected.release.metadata_json);
          assert.equal(metadata.schema_version, 2);
          assert.equal(metadata.runtime_version, pin.required);
          assert.equal(metadata.triple ?? metadata.target_triple, runtimeTarget);
          assert.equal(metadata.source_commit, process.env.EXPECTED_RUNTIME_SOURCE_SHA);
          assert.equal(metadata.binary_sha256, selected.sha256);
          const runtime = join(root, 'bin', 'runtime', pin.required, `rsrs-runtime${process.env.EXE_SUFFIX}`);
          assert.ok(statSync(runtime).isFile());
          assert.notEqual(realpathSync(runtime), realpathSync(cli), 'CLI cannot be the Runtime fixture');
          assert.equal(hash(readFileSync(runtime)), selected.sha256);
          assert.equal(hash(readFileSync(join(root, 'bin', 'runtime', pin.required, 'core-runtime.json'))),
            metadata.files.find(file => file.path === 'core-runtime.json')?.sha256);
          appendFileSync(process.env.GITHUB_ENV, `RSRS_RUNTIME_BIN=${runtime}\n`);
          NODE
      - name: Foreground and actual isolated current-user service lifecycle
        if: matrix.os != 'ubuntu-24.04-arm'
        shell: bash
        env:
          SDK_TARGET: ${{ matrix.target }}
          EXE_SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          python scripts/test-runtime-autostart.py --binary "target/autostart-validation/$SDK_TARGET/debug/rsrs$EXE_SUFFIX" --register
      - name: Verify exact ARM64 release inputs
        if: matrix.os == 'ubuntu-24.04-arm'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_SOURCE: ${{ inputs.runtime_source_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = codex/cli-arm64-autostart-replay-20261121
          bash scripts/require-native-linux-arm64.sh aarch64-unknown-linux-musl
          cli_zip="$RUNNER_TEMP/cli-autostart-replay.zip"
          gh api repos/risense-ai/respire-cli/actions/artifacts/14688604229/zip > "$cli_zip"
          printf '%s  %s\n' 58d7e61af99f83e6800007d99d809b92899fb8c17fa2646065163cc9479bc72f "$cli_zip" | sha256sum --check
          unzip -q "$cli_zip" -d "$RUNNER_TEMP/cli-autostart-artifact"
          node npm/scripts/set-build-version.mjs 2.0.0-dev.25
          env ARTIFACT_SOURCE=build VALIDATION_PROFILE=full CLI_TARGET=aarch64-unknown-linux-musl \
            CLI_VERSION=2.0.0-dev.25 CLI_SHA=51ac46442d58639f97a06679bad23b5d3ace0cc7 \
            CLI_PRODUCER_RUN_ID=44860343956 CLI_PRODUCER_ATTEMPT=1 \
            node npm/scripts/extract-artifact.mjs "$RUNNER_TEMP/cli-autostart-artifact" "$RUNNER_TEMP/cli-autostart"
          printf '%s  %s\n' 04cb60e9a9b9b4cc5cab34660c10840a7d6b5e06e30dffe81c46c3cafa918b74 "$RUNNER_TEMP/cli-autostart/rsrs" | sha256sum --check
          test "$RUNTIME_SOURCE" = "$(gh api repos/risense-ai/respire-runtime/commits/v2.0.0-dev.28 --jq .sha)"
          archive="$RUNNER_TEMP/rsrs-runtime-aarch64-unknown-linux-musl.tar.gz"
          gh release download v2.0.0-dev.28 -R risense-ai/respire-runtime -p "$(basename "$archive")" -O "$archive"
          metadata="$RUNNER_TEMP/runtime-build-aarch64-unknown-linux-musl.json"
          gh release download v2.0.0-dev.28 -R risense-ai/respire-runtime -p "$(basename "$metadata")" -O "$metadata"
          printf '%s  %s\n' 4852c47a54430c03aa90244f5b4dad8a748215260efeb60b56e17ce9b5c2c1b4 "$metadata" | sha256sum --check
          printf '%s  %s\n' d4f56d16a286ea34d4eb9dec6a4f36e1918dd5eaa09e80e8e4308bbf8b86c946 "$archive" | sha256sum --check
      - name: Replay the ARM64 current-user service lifecycle
        if: matrix.os == 'ubuntu-24.04-arm'
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN RSRS_RUNTIME_BIN
          python scripts/test-runtime-autostart.py --binary "$RUNNER_TEMP/cli-autostart/rsrs" --register \
            --runtime-archive "$RUNNER_TEMP/rsrs-runtime-aarch64-unknown-linux-musl.tar.gz" --runtime-version 2.0.0-dev.28
