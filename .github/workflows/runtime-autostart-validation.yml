name: CLI ARM64 candidate autostart diagnostic
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  autostart-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the failed release can be reproduced with its original CLI and Runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/candidate"
          mkdir -p "$dir"
          artifact="$(gh api 'repos/risense-ai/respire-cli/actions/runs/44362424899/artifacts?per_page=100' --jq '.artifacts[] | select(.name=="cli-release-aarch64-unknown-linux-gnu") | .id')"
          [[ "$artifact" =~ ^[0-9]+$ ]]
          gh api "repos/risense-ai/respire-cli/actions/artifacts/$artifact/zip" > "$dir/cli.zip"
          echo "156ce052e36aa4589ab84d0670a6abd5653942ead6d46d2c8fb01003340b2291  $dir/cli.zip" | sha256sum -c
          unzip -q "$dir/cli.zip" -d "$dir"
          python - "$dir" <<'PY'
          import hashlib, json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          meta = json.loads((root / "cli-build-aarch64-unknown-linux-gnu.json").read_text())
          assert meta["git_sha"] == "0acf92481b29b69e6bf9536dc6a13b2c569c5abd"
          assert meta["version"] == "2.0.0-dev.20"
          assert meta["producer"] == {"run_id": "44362424899", "run_attempt": 1}
          binary = root / "rsrs-aarch64-unknown-linux-gnu"
          assert hashlib.sha256(binary.read_bytes()).hexdigest() == meta["binary_sha256"]
          PY
          gh release download v2.0.0-dev.24 -R risense-ai/respire-runtime -D "$dir" \
            -p 'runtime-build-aarch64-unknown-linux-gnu.json' -p 'rsrs-runtime-aarch64-unknown-linux-gnu.tar.gz'
          echo "9ac1f2534d59e6910122db32e1cd1880e32e29aaf3a33b30e58e06ae6beac268  $dir/runtime-build-aarch64-unknown-linux-gnu.json" | sha256sum -c
          chmod +x "$dir/rsrs-aarch64-unknown-linux-gnu"
      - name: Prepare the hosted Linux credential provider and user systemd
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          bash scripts/ci-apt-get.sh update
          bash scripts/ci-apt-get.sh install -y --no-install-recommends dbus-user-session dbus-x11 gnome-keyring
          python -m pip install --only-binary=:all: SecretStorage==3.3.3 jeepney==0.9.0 cryptography==46.0.3 psutil==7.1.0
          uid="$(id -u)"
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$uid.service"
          sudo systemctl is-active --quiet "user@$uid.service"
          export XDG_RUNTIME_DIR="/run/user/$uid"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          test -S "$XDG_RUNTIME_DIR/bus"
          systemctl --user start dbus.service
          systemctl --user is-active --quiet dbus.socket dbus.service
          test "$(busctl --user call org.freedesktop.DBus /org/freedesktop/DBus org.freedesktop.DBus NameHasOwner s org.freedesktop.systemd1)" = 'b true'
          printf '%s\n' "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
      - name: Re-run the release autostart fixture with safe failure diagnostics
        env:
          RSRS_RUNTIME_TRIPLE: aarch64-unknown-linux-gnu
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN RSRS_RUNTIME_BIN
          dir="$RUNNER_TEMP/candidate"
          python scripts/test-runtime-autostart.py --binary "$dir/rsrs-aarch64-unknown-linux-gnu" --register \
            --runtime-archive "$dir/rsrs-runtime-aarch64-unknown-linux-gnu.tar.gz" --runtime-version 2.0.0-dev.24
