name: Final published release regression

on:
  workflow_dispatch:
    inputs:
      published_assets:
        description: Exact schema-2 inventory of final public CLI and Runtime asset IDs and hashes
        required: true
        type: string
      published_assets_sha256:
        description: SHA-256 of the exact published_assets input bytes
        required: true
        type: string
      client2_release:
        description: Optional public Client2 tag for GUI diagnostics
        required: false
        type: string
      client2_commit:
        description: Exact Client2 commit when requesting GUI diagnostics
        required: false
        type: string

permissions:
  contents: read
  actions: write

jobs:
  full-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Start one full acceptance against the final public product assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PUBLISHED_ASSETS: ${{ inputs.published_assets }}
          PUBLISHED_ASSETS_SHA256: ${{ inputs.published_assets_sha256 }}
          CLIENT2_RELEASE: ${{ inputs.client2_release }}
          CLIENT2_COMMIT: ${{ inputs.client2_commit }}
        run: |
          set -euo pipefail
          gh workflow run release.yml --repo "$REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f ref="$GITHUB_SHA" -f publish=false -f validation_profile=full \
            -f artifact_source=published-assets \
            -f published_assets="$PUBLISHED_ASSETS" -f published_assets_sha256="$PUBLISHED_ASSETS_SHA256" \
            -f client2_release="$CLIENT2_RELEASE" -f client2_commit="$CLIENT2_COMMIT"
          echo 'Dispatched final published-assets acceptance. This dispatch is not a validation result; require published-full-complete and published-full-result.json from the Release run.' >> "$GITHUB_STEP_SUMMARY"
