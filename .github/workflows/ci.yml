name: CLI CI
on:
  workflow_dispatch:
  push:
    branches: [main, 'fix/prompt-*']
  pull_request:
    branches: [main]
cache-mode: read
permissions:
  contents: read
concurrency:
  group: cli-ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  public-client2-dev23-recovery-replay:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'codex/client2-dev23-recovery-gui-replay-20261121'
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CLI_TARGET: x86_64-pc-windows-msvc
      CLI_VERSION: 2.0.0-dev.25
      CLI_SHA: 51ac46442d58639f97a06679bad23b5d3ace0cc7
      CLI_PRODUCER_RUN_ID: '44860343956'
      CLI_PRODUCER_ATTEMPT: '1'
      RSRS_RUNTIME_TRIPLE: x86_64-pc-windows-msvc
      ARTIFACT_SOURCE: build
      VALIDATION_PROFILE: full
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen CLI binary and official Runtime archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir verified-cli verified-runtime
          gh api repos/risense-ai/respire-cli/actions/artifacts/14689269245/zip > cli-candidate.zip
          printf '%s  %s\n' ff8744710380e045ae05073b77469e2e811f9587f3954d2fa1464b1f67373f57 cli-candidate.zip | sha256sum --check
          python -m zipfile -e cli-candidate.zip verified-cli
          node npm/scripts/set-build-version.mjs "$CLI_VERSION"
          node npm/scripts/extract-artifact.mjs verified-cli cli
          printf '%s  %s\n' fb169495380a2af9059b57b659e7a27793b0644590a1afa791e285c4b4aaa3c5 cli/rsrs.exe | sha256sum --check
          gh release download v2.0.0-dev.28 -R risense-ai/respire-runtime --dir verified-runtime \
            -p "rsrs-runtime-$CLI_TARGET.tar.gz" -p "runtime-build-$CLI_TARGET.json"
          printf '%s  %s\n' e91de7be8bc94e1f38f3601b69f0fb13612a89f11ee38934779813c1913d1dff "verified-runtime/rsrs-runtime-$CLI_TARGET.tar.gz" \
            742345f0b0b702ca2503ff9e4b7eaef22e6d959c77fdf663cccb88df2533d341 "verified-runtime/runtime-build-$CLI_TARGET.json" | sha256sum --check
      - name: Prepare verified Runtime and inference models
        shell: bash
        run: |
          set -euo pipefail
          export RSRS_DATA_DIR="$RUNNER_TEMP/windows-runtime-source"
          node scripts/ci-install-pinned-runtime.mjs cli/rsrs.exe
          printf '%s  %s\n' 6b18fd68618f1459b99c4ed8848b3e2144f95e69982572c606e013f91a653a14 \
            "$RSRS_DATA_DIR/bin/runtime/2.0.0-dev.28/rsrs-runtime.exe" | sha256sum --check
          export RSRS_M3_DIR="$RSRS_DATA_DIR/models/bge-m3"
          cli/rsrs.exe --direct model install-m3 --json
          curl --fail --location --retry 1 --connect-timeout 20 --max-time 1200 \
            'https://huggingface.co/Xenova/bge-m3/resolve/4de13258303883538bd53b696b452bf8099f0858/onnx/model_quantized.onnx' \
            --output "$RSRS_M3_DIR/onnx/model_quantized.onnx"
      - name: Run the isolated public dev.23 GUI diagnostic
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/probe-client2-gui.ps1 `
            -Client2Release v2.0.0-dev.23 -Client2Commit 401679b87f08b09ddf8764b4a07fa2a9e77b467a `
            -FixtureCli "$PWD/cli/rsrs.exe" `
            -RuntimeArchive "$PWD/verified-runtime/rsrs-runtime-x86_64-pc-windows-msvc.tar.gz" -RuntimeVersion 2.0.0-dev.28 `
            -OutputDirectory "$env:RUNNER_TEMP/dev23-gui" -OfflineAcceptance `
            -OfflineModelDirectory "$env:RUNNER_TEMP/windows-runtime-source/models/bge-m3"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-client2-dev23-recovery-replay
          path: |
            ${{ runner.temp }}/dev23-gui/report.json
            ${{ runner.temp }}/dev23-gui/native-gui.json
          retention-days: 1
          if-no-files-found: warn
  workspace-tests:
    outputs:
      rust_cache_key: ${{ steps.rust-key.outputs.key }}
      rust_cache_hit: ${{ steps.rust-build.outputs.cache-hit }}
    name: CLI source workspace
    runs-on: ubuntu-latest
    env:
      RSRS_ENGINE: cpu
      # Several existing tests change process-global data-dir/language variables.
      # Their own parallel-request checks still create concurrent client threads.
      RSRS_CORE_TEST_MODE: '1'
      RUST_TEST_THREADS: '1'
      RUST_MIN_STACK: '16777216'
      # Keep backtrace file:line, assertions and overflow checks; omit full
      # type/variable DWARF only. These source tests remain unoptimized.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_DEV_OVERFLOW_CHECKS: 'true'
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: 'true'
      CARGO_PROFILE_DEV_OPT_LEVEL: '0'
      CARGO_PROFILE_TEST_OPT_LEVEL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Verify source profile debug and overflow semantics
        run: python3 scripts/test-ci-source-profile.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Key ordinary Rust dependencies
        id: rust-key
        run: node scripts/rust-ci-cache.mjs key workspace
      - uses: actions/cache/restore@v4
        id: rust-build
        with:
          path: .rust-ci-cache
          key: ${{ steps.rust-key.outputs.key }}
      - name: Restore ordinary Rust dependencies
        run: node scripts/rust-ci-cache.mjs restore workspace
      - name: Reject frontend source paths into business crates
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path.cwd()
          forbidden = [(root / 'crates' / name).resolve() for name in ('core-sdk', 'app', 'app-domain', 'storage', 'crypto')]
          forbidden.append((root / 'runtime').resolve())
          pattern = re.compile(r'#\s*\[\s*(?:path\s*=|cfg_attr\b[^\]]*\bpath\s*=)\s*(?:r#*)?"([^"]+)"|\binclude\s*!\s*\(\s*(?:r#*)?"([^"]+)"')
          for source in sorted([*(root / 'crates/commands').rglob('*.rs'), *(root / 'cli').rglob('*.rs')]):
              text = source.read_text(encoding='utf-8')
              for match in pattern.finditer(text):
                  relative = match[1] or match[2]
                  target = (source.parent / relative.replace('\\', '/')).resolve()
                  if any(target.is_relative_to(directory) for directory in forbidden):
                      line = text.count('\n', 0, match.start()) + 1
                      raise SystemExit(f'{source.relative_to(root)}:{line}: forbidden source path {relative}')
          PY
      - name: Require commands and CLI dependency graphs without Runtime business code
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN CORE_SDK_READ_TOKEN
          cargo tree -p respire_commands --no-default-features --locked --edges normal,build --prefix none --format '{p}' > "$RUNNER_TEMP/commands-frontend-tree.txt"
          cat "$RUNNER_TEMP/commands-frontend-tree.txt"
          if grep -Eq '^(respire_app|respire_app_domain|respire_storage|respire_crypto|respire_core_sdk|respire_runtime)([[:space:]]|$)' "$RUNNER_TEMP/commands-frontend-tree.txt"; then
            echo 'Commands frontend depends on a forbidden business package' >&2
            exit 1
          fi
          for features in default no-default; do
            options=()
            if [ "$features" = no-default ]; then options+=(--no-default-features); fi
            cargo tree -p respire "${options[@]}" --locked --edges normal,build,dev --prefix none --format '{p}' > "$RUNNER_TEMP/cli-$features-tree.txt"
            cat "$RUNNER_TEMP/cli-$features-tree.txt"
            if grep -Eq '^(respire_app|respire_app_domain|respire_storage|respire_core_sdk|respire_runtime)([[:space:]]|$)' "$RUNNER_TEMP/cli-$features-tree.txt"; then
              echo "CLI $features depends on a forbidden business package" >&2
              exit 1
            fi
          done
      - name: Test host cryptography without the engine or native SDK
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN CORE_SDK_READ_TOKEN
          cargo test -p respire_crypto --no-default-features --lib --locked
      - name: Test CLI frontend packages
        run: cargo test --locked -p respire_spawn -p respire_protocol -p respire_client_host -p respire_host_control -p respire_commands -p respire_logging
      - name: Test CLI units and source integrations without Runtime or SDK
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN CORE_SDK_READ_TOKEN RSRS_RUNTIME_BIN
          node --input-type=module <<'NODE'
          import {execFileSync, spawnSync} from 'node:child_process';
          const metadata = JSON.parse(execFileSync('cargo', ['metadata', '--locked', '--no-deps', '--format-version', '1'], {encoding: 'utf8'}));
          // These targets need the official Runtime; release validation owns them.
          const native = ['runtime_smoke', 'runtime_autostart', 'model_maintenance', 'model_settings', 'private_controls', 'net_rpc_http'];
          const tests = metadata.packages.find(p => p.name === 'respire').targets.filter(t => t.kind.includes('test')).map(t => t.name);
          if (!native.every(name => tests.includes(name))) throw Error('Runtime test targets changed; review the source scope');
          const args = ['test', '--locked', '-p', 'respire', '--lib', '--bins', '--examples'];
          for (const name of tests.filter(name => !native.includes(name))) args.push('--test', name);
          args.push('--', '--skip', 'rpc::tests::http_pipeline_and_nonreading_peer_keep_runtime_available', '--skip', 'rpc::tests::scoped_operation_replays_and_retains_its_result_over_real_http');
          const result = spawnSync('cargo', args, {stdio: 'inherit'});
          if (result.error) throw result.error;
          process.exit(result.status ?? 1);
          NODE
          cargo test --locked -p respire --test net_rpc_http -- client_
          cargo test --locked -p respire --test runtime_smoke -- no_command_without_tty_exits_2 --exact
      - name: Stage ordinary Rust dependency cache
        if: steps.rust-build.outputs.cache-hit != 'true'
        run: |
          node scripts/rust-ci-cache.mjs pack workspace
          ls -lh "$RUNNER_TEMP/rust-build-workspace.tar.gz"
          sha256sum "$RUNNER_TEMP/rust-build-workspace.tar.gz"
      # Cache transport must fail promptly; a stall must not hold source acceptance indefinitely.
      - name: Upload workspace dependency cache with bounded transport
        uses: actions/upload-artifact@v4
        if: steps.rust-build.outputs.cache-hit != 'true'
        timeout-minutes: 10
        env:
          ACTIONS_ARTIFACT_UPLOAD_CONCURRENCY: '2'
          ACTIONS_ARTIFACT_UPLOAD_TIMEOUT_MS: '60000'
        with:
          name: rust-build-workspace
          path: ${{ runner.temp }}/rust-build-workspace.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  rust-build-save:
    # This writer never checks out or executes source, and cannot restore SDK caches.
    cache-mode: write-only
    needs: workspace-tests
    if: ${{ needs.workspace-tests.outputs.rust_cache_hit != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      BUILD_KEY: ${{ needs.workspace-tests.outputs.rust_cache_key }}
      CACHE_HIT: ${{ needs.workspace-tests.outputs.rust_cache_hit }}
    steps:
      - name: Validate the compilation-only cache key
        if: env.CACHE_HIT != 'true'
        run: '[[ "$BUILD_KEY" =~ ^rust-ci-v1-workspace-[a-f0-9]{64}$ ]]'
      - uses: actions/download-artifact@v4
        if: env.CACHE_HIT != 'true'
        with:
          name: rust-build-workspace
          path: incoming
      - name: Extract dependency data without executing it
        if: env.CACHE_HIT != 'true'
        env:
          CACHE_KIND: workspace
        run: |
          python3 - <<'PY'
          import os, pathlib, tarfile
          with tarfile.open('incoming/rust-build-'+os.environ['CACHE_KIND']+'.tar.gz') as archive:
              for member in archive.getmembers():
                  path=pathlib.PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts or path.parts[0] not in ['target','cargo']:
                      raise ValueError('Unexpected Rust dependency cache path')
              archive.extractall('.rust-ci-cache', filter='data')
          PY
      - uses: actions/cache/save@v4
        if: env.CACHE_HIT != 'true'
        with:
          path: .rust-ci-cache
          key: ${{ env.BUILD_KEY }}

  windows-client-host:
    name: Windows client-host units
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Test Windows host paths without a Runtime or SDK
        run: cargo test --locked -p respire_client_host --lib
      - name: Test host component plans and file verification without Runtime or Core
        run: |
          cargo test --locked -p respire --lib model_maintenance::tests:: -- --test-threads=1

  native-fixture-contracts:
    # Isolated Python-only checks; full native Runtime acceptance remains required.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --only-binary=:all: psutil==7.1.0
      - name: Verify inspector failures, deadlines and owned-process cleanup
        run: python scripts/test-native-fixture-process.py --output-dir "${{ runner.temp }}/native-fixture-contracts"

  contract-checks:
    # Lightweight source, packaging and fixture contracts do not build Rust.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The alias contract executes the frozen product's original reader.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the frozen Runtime control contract
        run: node scripts/verify-runtime-control-contract.mjs
      - name: Reject invalid required-gate evidence
        run: node scripts/test-required-tests.mjs
      - run: node --check npm/scripts/pack.mjs
      - run: node --check npm/scripts/release-notes.mjs
      - run: node npm/scripts/check-manifest.mjs
      - run: node npm/scripts/test-wrapper.mjs
      - run: python3 scripts/test_published_upgrade_policy.py
      - run: node --test scripts/test-cli-coverage-policy.mjs scripts/test-private-sdk-download.mjs scripts/test-sdk-ci-cache.mjs
      - run: node --test scripts/test-stage-core-runtime.mjs
      - name: Verify publication transactions and immutable artifact contracts offline
        run: node --test npm/scripts/test-release-publication.mjs npm/scripts/test-publication-acceptance.mjs npm/scripts/test-release-regression-contract.mjs npm/scripts/test-parallel-publication.mjs npm/scripts/test-release-preparation.mjs npm/scripts/test-prepared-import.mjs npm/scripts/test-verified-receipt.mjs npm/scripts/test-publication-fence.mjs npm/scripts/test-next-dev-version.mjs
      - run: python3 scripts/test-dev-smoke-gate.py
      - run: python3 scripts/test-dev-api-contract.py
      - run: python3 scripts/test-dev-model-fixture.py
      - run: python3 scripts/test-native-runtime-install.py
      - name: Verify native candidate runner isolation and cleanup without products
        run: python3 -B scripts/test-native-account-candidate.py
      - run: python3 scripts/test-dev-fixture-tty.py
      - run: python3 scripts/test-dev-witness-fixture.py
      - name: Install pinned offline credential-fixture dependency
        run: |
          python3 -m pip install --only-binary=:all: cryptography==46.0.3
      - name: Verify exact credential alias ownership and legacy vault fixtures
        run: python3 -B scripts/test-dev-credential-alias-fixtures.py
      - name: Verify safe full-release failure diagnostics
        run: python3 -B scripts/test-full-release-diagnostics.py
      - name: Verify owned login interruption and terminal recovery fixtures
        run: python3 -B scripts/test-login-interruption-contract.py
      - name: Verify current native seed readiness before shutdown
        run: python3 -B scripts/test-native-seed-readiness.py
      - name: Verify Runtime forwarding rejection and owned cleanup
        run: python3 -B scripts/test-runtime-forwarding-rejection.py
      - name: Verify Runtime private credential ownership and failure cleanup
        run: python3 -B scripts/test-runtime-private-credentials.py
      - name: Verify isolated Runtime supplement and diagnostic wiring
        run: python3 -B scripts/test-runtime-supplement-isolation.py
      - name: Verify standalone diagnostic sweep identity and failure guards
        run: node --test npm/scripts/test-dev-sweep-standalone-contract.mjs
      - name: Verify invalid account pre-validation source contract
        run: python3 -B scripts/test-account-rejection-source.py
      - name: Verify client-only no-write failure diagnostics
        run: python3 -B scripts/test-client-only-no-write-diagnostics.py
      - name: Validate release sweep PowerShell syntax
        shell: pwsh
        run: |
          $parseTokens = $null; $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/dev-release-sweep.ps1'), [ref]$parseTokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -ne 0) { throw ($parseErrors | Out-String) }
          & ./scripts/test-reembed-progress-contract.ps1
          & ./scripts/test-account-failure-diagnostics.ps1
          & ./scripts/test-keygen-fixture-handoff.ps1
          & ./scripts/test-account-rejection-contract.ps1

  client2-focus-contract:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test focus readiness policy without product or credentials
        shell: powershell
        run: ./scripts/test-client2-focus-readiness.ps1
      - name: Test process ownership for the Client2 GUI probe
        shell: powershell
        run: ./scripts/test-client2-cleanup-identity.ps1

  check-complete:
    if: ${{ always() }}
    needs: [workspace-tests, windows-client-host, rust-build-save, contract-checks, native-fixture-contracts, client2-focus-contract]
    runs-on: ubuntu-latest
    steps:
      - name: Require every source check and every fixture platform
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = {name: job['result'] for name, job in results.items() if job['result'] != 'success' and not (name == 'rust-build-save' and job['result'] == 'skipped')}
          if failed:
              raise SystemExit(f'Source CI did not pass: {failed}')
          PY
      - name: State the verified scope
        run: echo 'CLI source checks passed. Published native acceptance runs separately in Release.' >> "$GITHUB_STEP_SUMMARY"
