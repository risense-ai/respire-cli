[workspace]
resolver = "2"
members = ["cli", "spawn", "crates/core-sdk", "crates/protocol", "crates/crypto", "crates/app", "crates/storage"]
default-members = ["cli"]

# Match the separately linked Core's unwind runtime and avoid host cross-crate LTO.
[profile.release]
strip = "debuginfo"
lto = false
codegen-units = 1
panic = "unwind"
