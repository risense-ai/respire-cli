[package]
name = "respire_core_sdk"
version = "2.0.0-dev.1"
edition = "2021"
rust-version = "1.95"
license-file = "LICENSE"
description = "Safe Rust binding to the separately distributed Respire Core SDK"
repository = "https://github.com/risense-ai/respire-cli"
readme = "README.md"
include = ["Cargo.toml", "src/**", "build.rs", "README.md", "LICENSE", "core-sdk.lock.json", "prepare-sdk.mjs"]
links = "respire_core_ffi"
publish = ["crates-io"]

[dependencies]
anyhow = "1.0"
respire_protocol = { path = "../protocol", version = "=2.0.0-dev.1" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
dirs = "6.0"

[build-dependencies]
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"

[lints.rust]
unsafe_code = "deny"
