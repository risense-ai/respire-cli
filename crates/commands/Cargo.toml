[package]
name = "respire_commands"
version = "1.0.0"
edition = "2021"
rust-version = "1.88"
description = "shared rsrs command surface: clap definitions, gates and output contract"
license-file = "../../LICENSE"
repository = "https://github.com/risense-ai/respire-cli"
publish = false

[features]
# Mirrors the CLI's native-fault-tests marker so version strings keep their
# non-releasable suffix when the fixture feature is enabled upstream.
native-fault-tests = []

[dependencies]
respire_app = { package = "respire_app", path = "../app", default-features = false }
respire_spawn = { path = "../../spawn" }
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
unicode-width = "=0.2.0"
ureq = { version = "2.12", features = ["json", "socks-proxy"] }
url = "2.5"
uuid = { version = "1.0", features = ["v4", "v5"] }

[dev-dependencies]
tempfile = "3.15"
tiny_http = "0.12"

[lints.rust]
unsafe_code = "forbid"
