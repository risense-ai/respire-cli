[package]
name = "respire_commands"
version = "1.0.0"
edition = "2021"
rust-version = "1.88"
description = "shared rsrs command surface: clap definitions, gates and output contract"
license-file = "../../LICENSE"
repository = "https://github.com/risense-ai/respire-cli"
publish = false

[features]
default = ["server"]
server = [
    "dep:respire_app",
    "dep:respire_spawn",
    "dep:base64",
    "dep:chrono",
    "dep:hex",
    "dep:sha2",
    "dep:url",
    "dep:tiny_http",
    "dep:axum",
    "dep:tokio",
    "dep:signal-hook",
]
# Mirrors the CLI's native-fault-tests marker so version strings keep their
# non-releasable suffix when the fixture feature is enabled upstream.
native-fault-tests = []

[dependencies]
respire_client_host = { path = "../client-host" }
respire_app = { package = "respire_app", path = "../app", default-features = false, optional = true }
respire_protocol = { path = "../protocol" }
respire_spawn = { path = "../../spawn", optional = true }
anyhow = "1.0"
base64 = { version = "0.22", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"], optional = true }
clap = { version = "4.5", features = ["derive"] }
hex = { version = "0.4", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.10", optional = true }
unicode-width = "=0.2.0"
ureq = { version = "2.12", features = ["json", "socks-proxy"] }
url = { version = "2.5", optional = true }
uuid = { version = "1.0", features = ["v4", "v5"] }
# Runtime server transport: authenticated loopback HTTP RPC/MCP
tiny_http = { version = "0.12", optional = true }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"], optional = true }
tokio = { version = "=1.52.3", features = ["rt-multi-thread", "net", "time", "sync", "io-util"], optional = true }

[target.'cfg(unix)'.dependencies]
# serve() installs a no-op SIGHUP handler off the listener thread.
signal-hook = { version = "0.3", optional = true }

[dev-dependencies]
tempfile = "3.15"
tiny_http = "0.12"

[lints.rust]
unsafe_code = "forbid"
